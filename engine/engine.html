<title>__LW_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/*__LW_KATEX_CSS__*/
</style>
<style>
/* Learning Web engine. Minimal look (Joe, 2026-11-23): almost no boxes or borders, one plain sans-serif font,
   dark brown ground, light yellow text. Content column on the left; the concept map sits on the right. */
:root{
  --bg:#241811; --surface:#2b1d14; --raise:#2f2117; --ink:#f4e7b8; --muted:#bfae86; --line:#3a2a1e; --line2:#4a3626;
  --accent:#86c9bd; --accent-soft:rgba(134,201,189,.09); --good:#b7d98c; --good-soft:rgba(183,217,140,.10);
  --warn:#eda25e; --warn-soft:rgba(237,162,94,.10); --bad:#e8826f;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --body:var(--display);
  --mono:ui-monospace,"SF Mono",Consolas,monospace; --math:"Inter",system-ui,sans-serif;
  --gutter-l:max(24px, env(safe-area-inset-left, 0px)); --gutter-r:max(24px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
@media (max-width:880px){:root{--gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px))}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header.top{background:rgba(36,24,17,.96);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:16px;padding-block:12px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);flex-wrap:wrap}
header.top h1{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0;flex:1 1 auto}
header.top h1 small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.backbtn{border:0;background:transparent;color:var(--accent);font-size:.92rem;padding:6px 4px}
.backbtn:hover:not([disabled]){text-decoration:underline;text-underline-offset:4px}
.backbtn[disabled]{opacity:.35;cursor:default;color:var(--muted)}

.return{background:#3a2616;color:var(--warn);
  padding-block:8px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.return[hidden]{display:none}
.return .trail{flex:1 1 220px;font-size:.82rem;opacity:.85}
.return button{border:0;background:var(--warn);color:var(--bg);font-size:.88rem;font-weight:600;padding:6px 14px;border-radius:999px}

.shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:56px;max-width:1180px;margin:0 auto;padding-block:32px 96px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
@media (max-width:880px){.shell{grid-template-columns:minmax(0,1fr);gap:40px;padding-block:20px 80px}}
main{min-width:0}

nav.map{align-self:start;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto;padding:0 4px 0 0;font-size:.92rem}
@media (max-width:880px){nav.map{position:static;max-height:none}}
nav.map h2{font-weight:600;font-size:.95rem;color:var(--ink);margin:0 0 8px}
.prog{height:3px;background:var(--line);margin:6px 0 6px;position:relative;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.progtxt{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.lvl{font-size:.8rem;font-weight:600;color:var(--muted);margin:18px 0 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:4px 6px;font-size:.92rem;border-radius:6px;color:var(--ink)}
.mi:hover{background:var(--accent-soft)}
.mi.on{color:var(--accent);font-weight:600}
.mi .soon{margin-left:auto;font-size:.72rem;color:var(--muted)}
.dot{flex:none;width:7px;height:7px;border:1.5px solid var(--muted);display:inline-block;border-radius:50%}
.dot.v{border-color:var(--accent);background:var(--accent)}
.dot.m{border-color:var(--good);background:var(--good)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:18px}
.legend span{display:inline-flex;gap:6px;align-items:center}

.intro{padding:0 36px 0 0;margin-bottom:28px;font-size:.95rem;color:var(--muted);position:relative}
.intro p{margin:.2em 0}
.intro button.x{position:absolute;top:0;right:0;border:0;background:transparent;width:28px;height:28px;color:var(--muted);line-height:1}

article{position:relative}
.eyebrow{font-size:.85rem;color:var(--muted)}
h1.title{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.4vw,2.8rem);line-height:1.12;letter-spacing:-.02em;margin:.15em 0 .3em;text-wrap:balance}
.big{font-size:1.2rem;color:var(--muted);margin:0 0 1.6em;max-width:60ch}
article h2{font-family:var(--display);font-weight:650;font-size:1.35rem;letter-spacing:-.01em;margin:2.2em 0 .5em;text-wrap:balance}
article h3{font-size:1.05rem;margin:1.2em 0 .4em}
article p,article li{max-width:68ch}
p.cap{font-size:.88rem;color:var(--muted);margin-top:-.4em}
p.cap em{font-style:normal}
.eq{padding:4px 0 4px 2px;margin:1.1em 0;font-size:1.1rem;overflow-x:auto;overflow-y:hidden}
.eq .katex-display{margin:0;text-align:left}
.eq .katex-display>.katex{text-align:left}
.katex{font-size:1.08em;text-transform:none;letter-spacing:0}
.tex-raw{font-family:var(--mono);font-size:.9em;color:var(--warn)}

button.term{border:0;background:transparent;padding:0;border-bottom:1px dotted var(--accent);color:var(--ink);font-weight:inherit}
button.term:hover{color:var(--accent)}
button.fn{border:0;background:transparent;color:var(--accent);font-size:.72rem;font-weight:600;vertical-align:super;line-height:1;margin-left:2px;padding:0 .15em}
button.fn:hover{text-decoration:underline}
button.clink{border:0;background:transparent;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.missing,button.missing{color:var(--warn)!important;border-color:var(--warn)!important;cursor:not-allowed;text-decoration-style:dashed}
button.clink.missing::after{content:" (not written yet)";font-size:.8em}

#pop{position:fixed;z-index:50;max-width:min(340px,calc(100vw - 24px));background:#382819;color:var(--ink);border-radius:10px;
  box-shadow:0 12px 36px rgba(0,0,0,.5);padding:12px 14px;font-size:.92rem}
#pop[hidden]{display:none}
#pop b{display:block;margin-bottom:4px;font-size:.88rem;font-weight:600;color:var(--accent)}
#pop .lnk{margin-top:10px}

.lnk{border:0;background:transparent;color:var(--accent);padding:2px 0;font-size:.88rem;text-decoration:underline;text-underline-offset:4px}
.lnk:hover{color:var(--ink)}
.chip{border:0;background:transparent;color:var(--accent);padding:0;font-size:.88rem;margin-right:12px;text-decoration:underline;text-underline-offset:4px}
.chip:hover{color:var(--ink)}

.prereq,.stub{margin:1.6em 0}
.prereq h2,.stub h2{margin:0 0 .4em;font-size:1rem;font-weight:600;color:var(--muted)}
.stub h2{color:var(--warn)}
.prereq ul{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.prereq li{padding:4px 0}
.pr-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pr-head strong{flex:1 1 auto;font-weight:500}
@media (max-width:560px){.pr-head{gap:2px 14px}.pr-head strong{flex-basis:calc(100% - 30px)}.pr-head .lnk{margin-left:20px}.pr-head .lnk+.lnk{margin-left:0}}
.recap{margin:4px 0 8px 0;padding:0 0 0 14px;border-left:2px solid var(--line2);font-size:.93rem;color:var(--muted)}
.stub .recap{margin-left:0}
.recap[hidden]{display:none}

.checks{margin:1.6em 0}
.q{padding:10px 0;margin:6px 0 18px}
.q .tag{font-size:.8rem;color:var(--muted)}
.q .qt{margin:.2em 0 .7em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{border:0;background:var(--raise);padding:9px 14px;text-align:left;position:relative;border-radius:8px}
.opt:hover{background:#3b2a1d}
.opt.ok{background:var(--good-soft);color:var(--good);font-weight:600}
.opt.no{background:var(--warn-soft);color:var(--warn)}
.fb{margin-top:10px;font-size:.93rem}
.fb.ok{color:var(--good)} .fb.no{color:var(--warn)}
.fb .lnk{margin-left:8px;color:var(--warn)}

/* Figures. Shared look for every subject's widgets. */
.fig{margin:1.6em 0;padding:0;max-width:540px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.fig .cap,.wcard .cap{font-size:.86rem;color:var(--muted);margin:8px 0 2px}
.fig.pic{max-width:640px}
.picframe img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;border-radius:6px}
.piclink{display:flex;gap:14px;align-items:center;padding:8px 0;color:var(--accent);text-decoration:none}
.piclink:hover strong,.piclink:hover{text-decoration:underline}
.piclink .ico{flex:none;width:40px;height:32px;background:var(--raise);border-radius:6px;display:grid;place-items:center;font-size:.72rem}
.piclink small{display:block;color:var(--muted);font-size:.8rem}
.fig .credit{display:block;margin-top:4px;opacity:.8}
.fig .credit a{color:var(--accent)}
.fig.missing{color:var(--warn);font-size:.9rem}
svg .ax{stroke:var(--muted);stroke-width:1.2;opacity:.7}
svg .cv{stroke:var(--accent);stroke-width:2.6;fill:none}
svg .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg .sec{stroke:var(--warn);stroke-width:2.2;fill:none}
svg .tan{stroke:var(--good);stroke-width:1.8;fill:none;stroke-dasharray:6 5}
svg .pt{fill:var(--ink)}
svg .ptw{fill:var(--warn)}
svg text{fill:var(--ink);font-family:var(--body);font-size:12px}
svg .mt{fill:var(--muted)}
svg .box{fill:var(--raise);stroke:var(--accent);stroke-width:1.2}
.wcard{padding:0;margin:1.6em 0;max-width:580px}
.wcard h3{margin:0 0 .5em;font-weight:600;font-size:.95rem;color:var(--muted)}
.wcard label{font-size:.9rem}
.wcard input[type=range]{width:100%;accent-color:var(--accent)}
.read{margin:.6em 0 0;font-size:.98rem}

.tablewrap{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;margin:1.1em 0;font-size:.92rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:0;border-bottom:1px solid var(--line);padding:6px 14px;text-align:center}
table.t th{color:var(--muted);font-weight:600}
table.t td:first-child,table.t th:first-child{text-align:left;padding-left:0}
table.t .katex{font-size:1.15em}

.ex{margin:1.6em 0}
.ex .exq{font-weight:500}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:.6em 0 0}
ol.steps li{counter-increment:s;position:relative;margin:0;padding:8px 0 8px 36px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;line-height:24px;text-align:center;font-size:.82rem;font-weight:600;
  color:var(--bg);background:var(--accent);border-radius:50%}
.st{font-weight:500}
.why{color:var(--muted);font-size:.93rem}
.uses{margin-top:4px;font-size:.82rem;color:var(--muted)}

details.practice{padding:0;margin:1.4em 0}
details.practice summary,details.ans summary{cursor:pointer;font-size:.95rem;font-weight:600;color:var(--accent)}
details.ans{margin-top:10px}
details.pset{margin:1.2em 0 0}
details.pset>summary{cursor:pointer;font-size:.95rem;font-weight:600;color:var(--accent)}
details.pset>summary small{font-weight:400;color:var(--muted);margin-left:6px}
.pset .hint{font-size:.9rem;color:var(--muted);margin:.6em 0 0}
ol.probs{padding-left:1.6em;margin:.8em 0 0}
ol.probs>li{margin:0 0 1.1em;padding-left:4px}
ol.probs>li::marker{color:var(--muted);font-size:.9rem}
ol.probs details.ans{margin-top:4px}
ol.probs details.ans summary{font-size:.86rem;font-weight:500}
ol.probs details.ans p{margin:.3em 0 0;color:var(--muted);font-size:.95rem}

.master{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:2.6em 0 .6em}
.mbtn{border:1.5px solid var(--good);background:transparent;color:var(--good);font-size:.95rem;font-weight:600;padding:9px 20px;border-radius:999px}
.mbtn:hover{background:var(--good-soft)}
.mbtn.on{background:var(--good);color:var(--bg)}
.next{margin-top:1em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.next strong{font-size:.88rem;color:var(--muted);font-weight:500;margin-right:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/*__LW_WIDGET_CSS__*/
</style>

<div class="bar">
<header class="top">
  <h1 id="sitetitle">__LW_TITLE__<small id="sitesub"></small></h1>
  <button class="backbtn" id="backbtn" data-act="back" disabled>← Back to where I was</button>
</header>
<div class="return" id="ret" hidden></div>
</div>

<div class="shell">
  <main id="main"></main>
  <nav class="map" aria-label="Concept map">
    <h2>Your map</h2>
    <div class="prog"><i id="progbar"></i></div>
    <div class="progtxt" id="progtxt"></div>
    <div id="maplist"></div>
    <div class="legend">
      <span><i class="dot n"></i>Not yet</span>
      <span><i class="dot v"></i>Visited</span>
      <span><i class="dot m"></i>Got it</span>
    </div>
  </nav>
</div>

<div id="pop" role="dialog" hidden></div>

<script>
/*__LW_KATEX_JS__*/
</script>
<script>
"use strict";
/* ==========================================================================
   Learning Web engine. Subject-neutral: everything specific to a subject
   arrives in LW_DATA (built from the subject's Markdown files) and in the
   subject's widgets (registered with LW.widget below).
   ========================================================================== */
const LW_DATA = /*__LW_DATA__*/null;

const SUBJ = LW_DATA.subject;
const LBL = SUBJ.labels || {example:"Worked example", practice:"Try it yourself", level:"Level"};
const C = {}; LW_DATA.concepts.forEach(c=>{ C[c.id]=c; });
/* Pages from another subject (like calculus:exponents): recap and check show here; the page opens in that subject, in a new tab. */
(LW_DATA.external||[]).forEach(e=>{ C[e.id] = Object.assign({prereqs:[]}, e); });
const isExt = id => !!(C[id] && C[id].ext);
const ORDER = LW_DATA.concepts.map(c=>c.id);
const G = LW_DATA.glossary;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

/* ---------- math (KaTeX) ---------- */
function tex(s, display){
  if(window.katex){ try{ return katex.renderToString(String(s), {displayMode:!!display, throwOnError:false}); }catch(e){} }
  return `<span class="tex-raw">${esc(s)}</span>`;
}
function typeset(root){
  if(!root) return;
  root.querySelectorAll("span.tex").forEach(el=>{
    const src = el.textContent, d = el.dataset.d==="1";
    if(window.katex){ try{ katex.render(src, el, {displayMode:d, throwOnError:false}); }catch(e){ el.classList.add("tex-raw"); } }
    else el.classList.add("tex-raw");
    el.classList.remove("tex"); el.classList.add("tex-done");
  });
}

/* ---------- widget registry: subject widgets call LW.widget(name, fn) ---------- */
const WIDGETS = {};
const LW = { widget(name, fn){ WIDGETS[name] = fn; }, tex, typeset, esc };

/*__LW_WIDGETS__*/

/* ---------- levels ---------- */
const LEVEL = {};
function level(id, seen){
  if(LEVEL[id]) return LEVEL[id];
  seen = seen || new Set(); if(seen.has(id)) return 1; seen.add(id);
  const p = (C[id].prereqs||[]).filter(x=>C[x] && !isExt(x));
  return LEVEL[id] = p.length ? 1 + Math.max(...p.map(x=>level(x, seen))) : 1;
}

/* ---------- state (progress is keyed by concept id) ---------- */
let cur = null, stack = [];
const mastered = new Set(), visited = new Set(), answered = {};
const KEY = SUBJ.storage || "learning-web";
try{
  const s = JSON.parse(localStorage.getItem(KEY)||"{}");
  (s.m||[]).forEach(x=>{ if(C[x]) mastered.add(x); });
  (s.v||[]).forEach(x=>{ if(C[x]) visited.add(x); });
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({m:[...mastered], v:[...visited]})); }catch(e){} }
const status = id => mastered.has(id) ? "m" : visited.has(id) ? "v" : "n";
const title = id => C[id] ? C[id].title : id;

/* ---------- rendering ---------- */
let introDismissed = false;

function mapHTML(){
  const byLevel = {};
  ORDER.forEach(id=>{ (byLevel[level(id)] = byLevel[level(id)] || []).push(id); });
  return Object.keys(byLevel).sort((a,b)=>a-b).map(l=>
    `<div class="lvl">${esc(LBL.level)} ${l}${l==1?" (start here)":""}</div>` +
    byLevel[l].map(id=>`<button class="mi ${id===cur?'on':''}" data-c="${id}"><i class="dot ${status(id)}"></i>${esc(C[id].title)}${C[id].stub?'<span class="soon">Draft</span>':''}</button>`).join("")
  ).join("");
}

function renderChrome(){
  $("maplist").innerHTML = mapHTML();
  const n = ORDER.filter(id=>mastered.has(id)).length;
  $("progbar").style.width = (100*n/ORDER.length)+"%";
  $("progtxt").textContent = `${n} of ${ORDER.length} marked “got it”`;
  $("backbtn").disabled = !stack.length;
  const ret = $("ret");
  if(stack.length){
    const top = stack[stack.length-1];
    ret.hidden = false;
    const names = stack.map(s=>title(s.id)).concat([title(cur)]).map(esc);
    const trail = (names.length>4 ? "…  ›  " : "") + names.slice(-4).join("  ›  ");
    ret.innerHTML = `<span>You stepped away from <b>${esc(title(top.id))}</b>.</span><span class="trail">${trail}</span><button data-act="back">← Return to ${esc(title(top.id))}</button>`;
  }else{ ret.hidden = true; ret.innerHTML = ""; }
}

function checkHTML(id, tag){
  const k = C[id].check;
  return `<div class="q" data-q="${id}"><div class="tag">${esc(tag)}</div><p class="qt">${k.q}</p>
    <div class="opts">${k.options.map((o,i)=>`<button class="opt" data-act="ans" data-id="${id}" data-i="${i}">${o}</button>`).join("")}</div>
    <div class="fb" id="fb-${id}" aria-live="polite"></div></div>`;
}

function pageHTML(id){
  const c = C[id];
  const next = ORDER.filter(o=>C[o].prereqs.includes(id));
  const prereqs = c.prereqs.filter(p=>C[p]);
  const prereq = prereqs.length ? `
    <section class="prereq"><h2>What you need for this</h2><ul>
      ${prereqs.map(p=>`<li><div class="pr-head"><i class="dot ${status(p)}"></i><strong>${esc(C[p].title)}</strong>
        <button class="lnk" data-act="recap" data-id="${p}">Remind me</button>
        <button class="lnk" data-c="${p}">${isExt(p) ? `Open in ${esc(C[p].from)} ↗` : "Open page"}</button></div>
        <div class="recap" id="recap-${p}" hidden>${C[p].recap}</div></li>`).join("")}
    </ul></section>
    <section class="checks"><h2>Check yourself first</h2>
      <p>One quick question per idea you need. A wrong answer sends you to that page. An orange bar at the top brings you back.</p>
      ${prereqs.map(p=>checkHTML(p, "Needed idea: "+C[p].title)).join("")}
    </section>` : `<section class="prereq"><h2>What you need for this</h2><p>Nothing. This is a starting point.</p></section>`;
  let main;
  if(c.stub){
    main = `<section class="stub"><h2>Not written yet</h2><p>This page is still being written. Here is the short version.</p><div class="recap">${c.recap}</div></section>`;
  }else{
    const ex = c.example ? `<section class="ex"><h2>${esc(LBL.example)}</h2><p class="exq">${c.example.title}</p><ol class="steps">${
      c.example.steps.map(s=>`<li><div class="st">${s.text}</div>${s.why?`<div class="why">${s.why}</div>`:""}${
        s.uses.length ? `<div class="uses">Uses: ${s.uses.map(u=>`<button class="chip" data-c="${u}">${esc(title(u))}</button>`).join("")}</div>`:""}</li>`).join("")
    }</ol></section>` : "";
    const practice = c.practice ? `<details class="practice"><summary>${esc(LBL.practice)}</summary><p>${c.practice.q}</p>
      <details class="ans"><summary>Show answer</summary><p>${c.practice.answer}</p></details></details>` : "";
    main = `${c.body}${ex}${practice}`;
  }
  const ps = (!c.stub && c.problems && c.problems.length) ? c.problems : null;
  const pset = ps ? `<details class="pset"><summary>Practice set<small>${ps.length} problems, easiest first</small></summary>
      <p class="hint">Do as many as you need until they feel easy. Work each one out before you open its answer.</p>
      <ol class="probs">${ps.map(p=>`<li><div>${p.q}</div><details class="ans"><summary>Answer</summary><p>${p.answer}</p></details></li>`).join("")}</ol></details>` : "";
  const mine = `<section class="checks"><h2>Do you have it?</h2>${checkHTML(id,"Check")}${pset}</section>`;
  const master = `<div class="master"><button class="mbtn ${mastered.has(id)?'on':''}" data-act="master" data-id="${id}" aria-pressed="${mastered.has(id)}">${mastered.has(id)?"✓ Got it":"Mark as got it"}</button>
    <span class="progtxt" style="margin:0">Your map updates when you mark it.</span></div>
    ${next.length?`<div class="next"><strong>Where this leads:</strong> ${next.map(n=>`<button class="lnk" data-c="${n}">${esc(C[n].title)} →</button>`).join("")}</div>`:`<div class="next"><strong>Nothing builds on this page yet.</strong></div>`}`;
  const intro = (SUBJ.intro && !introDismissed && stack.length===0 && id===SUBJ.intro.page) ? `<div class="intro"><button class="x" data-act="dismiss" aria-label="Dismiss">×</button>${SUBJ.intro.html}</div>` : "";
  const big = c.stub ? "" : `<p class="big">${c.big}</p>`;
  return `${intro}<article><div class="eyebrow">${esc(LBL.level)} ${level(id)} · ${esc(SUBJ.name)}</div><h1 class="title">${esc(c.title)}</h1>${big}
    ${prereq}${main}${mine}${master}</article>`;
}

function mountWidgets(root){
  root.querySelectorAll(".widget[data-w]").forEach(el=>{
    const name = el.dataset.w, f = WIDGETS[name];
    if(!f){ el.innerHTML = `<div class="fig missing">Figure “${esc(name)}” is missing.</div>`; return; }
    let args = {lines:[], caption:""}; try{ args = JSON.parse(el.dataset.args||"{}"); }catch(e){}
    try{ f(el, LW, args); typeset(el); }catch(e){ console.error(e); el.innerHTML = `<div class="fig missing">Figure “${esc(name)}” failed to load.</div>`; }
  });
}
/* Pictures load live from Wikimedia Commons. If this host blocks outside images,
   show a captioned link that opens the picture in a new tab instead. */
function mountPictures(root){
  root.querySelectorAll(".fig.pic").forEach(fig=>{
    const frame = fig.querySelector(".picframe");
    const fallback = ()=>{ frame.innerHTML = `<a class="piclink" href="${esc(fig.dataset.page)}" target="_blank" rel="noopener"><span class="ico">IMG</span><span>${esc(fig.dataset.alt)}<small>Open the picture on Wikimedia Commons ↗</small></span></a>`; };
    const img = new Image();
    img.alt = fig.dataset.alt; img.loading = "lazy"; img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.onerror = fallback;
    img.src = fig.dataset.src;
    frame.innerHTML = ""; frame.appendChild(img);
    setTimeout(()=>{ if(!img.complete || !img.naturalWidth){ if(!img.complete) return; fallback(); } }, 4000);
  });
}
function markMissing(root){
  root.querySelectorAll("[data-c]").forEach(el=>{ if(!C[el.dataset.c]){ el.classList.add("missing"); el.title="This page is not written yet"; } });
}

function render(id){
  cur = id;
  visited.add(id); save();
  const m = $("main");
  m.innerHTML = pageHTML(id);
  typeset(m);
  Object.keys(answered).forEach(k=>{ if($("fb-"+k)) applyAnswer(k, answered[k], true); });
  mountWidgets(m);
  mountPictures(m);
  markMissing(m);
  renderChrome();
  closePop();
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  document.title = C[id].title + " · " + SUBJ.title;
}

function go(id){
  if(!C[id] || id===cur) return;
  if(isExt(id)){ window.open(C[id].ext, "_blank", "noopener"); return; }
  stack.push({id:cur, y:window.scrollY});
  if(stack.length>30) stack.shift();
  render(id);
  window.scrollTo(0,0);
}
function back(){
  const e = stack.pop();
  if(!e) return;
  render(e.id);
  window.scrollTo(0,e.y);
}

/* ---------- check questions ---------- */
function applyAnswer(id, i, quiet){
  const k = C[id].check, fb = $("fb-"+id);
  const q = document.querySelector(`.q[data-q="${id}"]`);
  if(!fb || !q) return;
  q.querySelectorAll(".opt").forEach(b=>b.classList.remove("ok","no"));
  const btn = q.querySelector(`.opt[data-i="${i}"]`);
  if(i===k.answer){
    btn.classList.add("ok");
    fb.className="fb ok"; fb.innerHTML = `Correct. ${k.why}`;
    if(!quiet){ mastered.add(id); visited.add(id); save(); renderChrome(); refreshDots(); }
  }else{
    btn.classList.add("no");
    fb.className="fb no"; fb.innerHTML = `Not quite. ${k.why}` + (id!==cur ? ` <button class="lnk" data-c="${id}">Review ${esc(C[id].title)}${isExt(id) ? ` in ${esc(C[id].from)} ↗` : ""}</button>` : ` Re-read the sections above, then try again.`);
  }
  typeset(fb);
}
function refreshDots(){
  document.querySelectorAll(".pr-head").forEach(h=>{
    const btn = h.querySelector("[data-c]"); if(!btn) return;
    const d = h.querySelector(".dot"); d.className = "dot "+status(btn.dataset.c);
  });
  const m = document.querySelector(".mbtn");
  if(m){ const on = mastered.has(cur); m.classList.toggle("on",on); m.textContent = on?"✓ Got it":"Mark as got it"; m.setAttribute("aria-pressed",on); }
}

/* ---------- pop-ups (terms and footnotes) ---------- */
function closePop(){ $("pop").hidden = true; $("pop").innerHTML = ""; }
function showPop(key, el){
  const g = G[key]; if(!g) return;
  const pop = $("pop");
  pop.innerHTML = `<b>${g.title}</b>${g.def}${g.concept && C[g.concept] && g.concept!==cur ? `<div><button class="lnk" data-c="${g.concept}">Open “${esc(C[g.concept].title)}”</button></div>`:""}`;
  typeset(pop);
  pop.hidden = false;
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(Math.max(12, r.left), window.innerWidth - pw - 12);
  let y = r.bottom + 8; if(y + ph > window.innerHeight - 8) y = Math.max(8, r.top - ph - 8);
  pop.style.left = x+"px"; pop.style.top = y+"px";
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target;
  const act = t.closest("[data-act]");
  if(act){
    const a = act.dataset.act, id = act.dataset.id;
    if(a==="back") return back();
    if(a==="recap"){ const r=$("recap-"+id); r.hidden=!r.hidden; act.textContent = r.hidden?"Remind me":"Hide reminder"; return; }
    if(a==="ans"){ const i=parseInt(act.dataset.i,10); answered[id]=i; applyAnswer(id,i,false); return; }
    if(a==="master"){ mastered.has(id)?mastered.delete(id):mastered.add(id); save(); refreshDots(); renderChrome(); return; }
    if(a==="dismiss"){ introDismissed=true; act.parentElement.remove(); return; }
  }
  const c = t.closest("[data-c]");
  if(c){ go(c.dataset.c); return; }
  const g = t.closest("[data-g]");
  if(g){ const pop=$("pop"); if(!pop.hidden && pop.dataset.key===g.dataset.g){ closePop(); return; } pop.dataset.key=g.dataset.g; showPop(g.dataset.g,g); return; }
  if(!t.closest("#pop")) closePop();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePop(); });
window.addEventListener("scroll", closePop, {passive:true});
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(C[h] && !isExt(h) && h!==cur) go(h); });

(function start(){
  $("sitesub").textContent = `${SUBJ.subtitle ? SUBJ.subtitle+" · " : ""}${ORDER.length} linked concepts`;
  const h = location.hash.slice(1);
  render(C[h] && !isExt(h) ? h : (C[SUBJ.start] ? SUBJ.start : ORDER[0]));
})();
</script>
