 end.<\/strong> Armies of the time took weeks to gather, and plans were built around railway timetables. Each country feared that if it waited while its enemy mobilized, it would lose the war before it began. So once one great power started to mobilize, the others felt they had to as well.<\/p>", "example": {"title": "How the war spread from 28 July to 4 August 1914.", "steps": [{"text": "Austria-Hungary declares war on Serbia.", "why": "It wanted to crush Serbia, and Germany's blank cheque made it confident.", "uses": ["sarajevo-assassination"]}, {"text": "Russia mobilizes to support Serbia.", "why": "Russia saw itself as Serbia's protector and would not let Austria-Hungary control the Balkans.", "uses": ["alliance-system"]}, {"text": "Germany declares war on Russia, then on France.", "why": "Germany was allied to Austria-Hungary, and its war plan required striking France before Russia was ready.", "uses": ["alliance-system"]}, {"text": "Germany invades Belgium, and Britain declares war on Germany.", "why": "The Schlieffen Plan went through Belgium. Britain had promised to respect Belgium's neutrality.", "uses": []}]}, "practice": {"q": "Russia had no alliance with Serbia. Why did it still mobilize in July 1914?", "answer": "Russia saw itself as the protector of the Slavic peoples, and it did not want Austria-Hungary to dominate the Balkans. It had also backed down once before, in the Bosnian Crisis of 1908 to 1909, and its leaders did not want to be humiliated again."}, "stub": false}], "glossary": {"nation": {"title": "Nation", "def": "A group of people who feel they belong together, usually because they share a language, a culture and a history. The Serbs and the Hungarians were nations.", "concept": null}, "state": {"title": "State", "def": "A country with its own government and borders, like France or Serbia. A nation and a state are not the same thing: one state can hold many nations.", "concept": null}, "nationalism": {"title": "Nationalism", "def": "The belief that each nation should have its own state and rule itself.", "concept": "nationalism"}, "empire": {"title": "Empire", "def": "A large state that rules many different peoples and lands from one center. Austria-Hungary, Russia and the Ottoman Empire were empires in 1914.", "concept": "empire"}, "south-slavs": {"title": "South Slavs", "def": "The Slavic peoples of southeastern Europe, including Serbs, Croats, Slovenes and Bulgarians. Many lived inside Austria-Hungary in 1914.", "concept": null}, "great-powers": {"title": "Great powers", "def": "The strongest countries of the time. In 1914 Europe's great powers were Britain, France, Germany, Austria-Hungary, Russia and, the weakest of them, Italy.", "concept": null}, "alliance": {"title": "Alliance", "def": "A treaty in which countries promise to help each other, often by fighting, if one of them is attacked.", "concept": "alliance-system"}, "entente": {"title": "Entente", "def": "French for \"understanding\". A friendly agreement between countries that settles quarrels but does not promise to fight for each other.", "concept": "alliance-system"}, "neutrality": {"title": "Neutrality", "def": "Staying out of a war and taking no side. A neutral country's land is not supposed to be invaded.", "concept": null}, "annex": {"title": "Annex", "def": "To take over another territory and make it officially part of your own country.", "concept": null}, "pan-slavism": {"title": "Pan-Slavism", "def": "The idea that all Slavic peoples belong together. In Russia it meant that Russia should protect smaller Slavic nations such as Serbia.", "concept": null}, "young-bosnia": {"title": "Young Bosnia", "def": "A loose group of young revolutionaries in Bosnia, mostly students. They wanted to end Austro-Hungarian rule and unite the South Slavs.", "concept": null}, "black-hand": {"title": "Black Hand", "def": "A secret society of Serbian army officers, officially called \"Unification or Death\". It wanted to unite all Serbs in one state and was ready to use violence.", "concept": null}, "ultimatum": {"title": "Ultimatum", "def": "A final list of demands with a deadline. If the demands are not met in time, the sender threatens to act, often with war.", "concept": null}, "mobilize": {"title": "Mobilize", "def": "To call up an army's soldiers and reserves and move them toward the border, ready for war.", "concept": null}, "blank-cheque": {"title": "Blank cheque", "def": "The name for Germany's promise in early July 1914 to back Austria-Hungary in whatever it did to Serbia. Like a signed cheque with no amount written in, it set no limit.", "concept": "july-crisis"}, "bce-ce": {"title": "BCE and CE", "def": "BCE means \"before the common era\": years counted backward before year 1. CE means \"common era\": years counted forward from year 1. Older books write BC and AD for the same years.", "concept": "chronology"}, "century": {"title": "Century", "def": "A period of 100 years. The 1st century CE is the years 1 to 100, so the 1800s are the 19th century.", "concept": "chronology"}, "period": {"title": "Period (or era)", "def": "A stretch of time that historians group together and give a name, such as the Middle Ages. People living at the time did not use most of these names.", "concept": "chronology"}, "circa": {"title": "Circa (c.)", "def": "Latin for \"around\". \"c. 3200 BCE\" means about 3200 BCE, when the exact year is not known.", "concept": null}, "primary-source": {"title": "Primary source", "def": "Evidence made at the time by people who took part in or saw the events: a letter, a law, a diary, a photograph, a coin, a tool.", "concept": "primary-sources"}, "secondary-source": {"title": "Secondary source", "def": "A work made later by someone studying the past, such as a textbook or a history book. It is built from primary sources.", "concept": "primary-sources"}, "archaeology": {"title": "Archaeology", "def": "The study of the past through the things people left behind: buildings, tools, bones, pottery, rubbish. It is how we learn about times and people that left no writing.", "concept": null}, "point-of-view": {"title": "Point of view", "def": "The position a source is written from: who made it, what they wanted, and what they knew. Every source has one. Spotting it is not the same as rejecting the source.", "concept": null}, "long-term-cause": {"title": "Long-term cause", "def": "A condition that builds up over years or decades and makes an event possible, such as debt, rivalry or a new idea spreading.", "concept": "causation"}, "trigger": {"title": "Trigger", "def": "A short-term cause: the event that sets things off once the long-term causes are in place. Also called the spark or immediate cause.", "concept": "causation"}, "consequence": {"title": "Consequence", "def": "A result of an event. Consequences often become causes of later events.", "concept": "causation"}, "homo-sapiens": {"title": "Homo sapiens", "def": "The scientific name of our species, modern humans. It is Latin for \"wise human\".", "concept": "human-origins"}, "hunter-gatherer": {"title": "Hunter-gatherer", "def": "A person who gets food by hunting animals, fishing and gathering wild plants, instead of farming. Hunter-gatherers usually move with the seasons.", "concept": "human-origins"}, "stone-age": {"title": "Old Stone Age", "def": "The long period when people made their tools mainly from stone and lived as hunter-gatherers, before farming. Also called the Paleolithic. The New Stone Age, or Neolithic, is the period of the first farmers.", "concept": null}, "ice-age": {"title": "Ice Age", "def": "The most recent cold period, when ice sheets covered much of northern Europe, Asia and North America. It ended about 11,700 years ago.", "concept": null}, "domesticate": {"title": "Domesticate", "def": "To tame and breed wild plants or animals over many generations until they change to suit people, as wild grasses became wheat and wild boars became pigs.", "concept": "agricultural-revolution"}, "fertile-crescent": {"title": "Fertile Crescent", "def": "A curved band of good farmland in southwest Asia, running from the Nile through modern Israel, Lebanon and Syria and down the Tigris and Euphrates rivers in Iraq. Farming began there first.", "concept": null}, "surplus": {"title": "Surplus", "def": "An amount left over beyond what is needed. A food surplus means more food than the farmers themselves need to eat.", "concept": "agricultural-revolution"}, "city": {"title": "City", "def": "A large, permanent settlement where many people live close together and most do jobs other than farming.", "concept": "civilization"}, "specialization": {"title": "Specialization", "def": "People doing one particular kind of work, such as making pots or keeping records, instead of each family doing a bit of everything.", "concept": "civilization"}, "social-class": {"title": "Social class", "def": "A group of people with a similar level of wealth, power and respect in a society, such as nobles, farmers or slaves.", "concept": "civilization"}, "irrigation": {"title": "Irrigation", "def": "Bringing water to fields through canals, ditches or channels, so crops can grow where rain alone is not enough.", "concept": null}, "cuneiform": {"title": "Cuneiform", "def": "The writing system of ancient Mesopotamia, made of wedge-shaped marks pressed into wet clay with a cut reed.", "concept": "writing"}, "hieroglyphs": {"title": "Hieroglyphs", "def": "The picture-based writing of ancient Egypt. Its signs could stand for whole words or for sounds.", "concept": "writing"}, "scribe": {"title": "Scribe", "def": "A person trained to read and write, in an age when few could. Scribes kept records for temples, kings and merchants.", "concept": "writing"}, "alphabet": {"title": "Alphabet", "def": "A writing system in which each sign stands for a single sound. It needs only a few dozen signs, so it is much easier to learn than earlier scripts.", "concept": "writing"}, "prehistory": {"title": "Prehistory", "def": "The time before written records. We know about it from archaeology rather than from documents.", "concept": "writing"}, "city-state": {"title": "City-state", "def": "An independent city that rules itself and the farmland around it, like a small country. Sumer and, later, ancient Greece were made up of city-states.", "concept": null}, "ziggurat": {"title": "Ziggurat", "def": "A huge stepped tower of mud brick in a Mesopotamian city, with a temple to the city's god on top.", "concept": null}, "pharaoh": {"title": "Pharaoh", "def": "The title of the kings of ancient Egypt. Egyptians believed the pharaoh was a god on earth.", "concept": "ancient-egypt"}, "dynasty": {"title": "Dynasty", "def": "A family that rules a country for generation after generation, such as the Shang dynasty in China.", "concept": null}, "mummy": {"title": "Mummy", "def": "A dead body preserved by drying it and wrapping it in cloth. Egyptians made mummies because they believed the body was needed in the afterlife.", "concept": null}, "seal": {"title": "Seal", "def": "A small carved stone pressed into clay to leave a mark, used to sign or label goods. Indus seals often show an animal and a short inscription.", "concept": null}, "decipher": {"title": "Decipher", "def": "To work out how to read a script or code that no one understands.", "concept": null}, "oracle-bones": {"title": "Oracle bones", "def": "Turtle shells and ox bones that Shang priests carved with questions and heated until they cracked. The cracks were read as answers from the ancestors.", "concept": "early-china"}, "bronze": {"title": "Bronze", "def": "A metal made by melting copper and tin together. It is harder than copper and was used for tools, weapons and ritual vessels.", "concept": null}, "mandate-of-heaven": {"title": "Mandate of Heaven", "def": "The Chinese belief that Heaven gives a just ruler the right to rule, and takes it away from a cruel or failing one.", "concept": "early-china"}, "mesoamerica": {"title": "Mesoamerica", "def": "The region of southern Mexico and Central America where the Olmec, Maya and Aztecs lived.", "concept": "americas-before-1492"}, "tribute": {"title": "Tribute", "def": "Goods, money or people that a conquered or weaker people must hand over regularly to a stronger ruler.", "concept": null}, "quipu": {"title": "Quipu", "def": "A set of colored, knotted strings that the Inca used to record numbers, such as taxes and population. The type and position of each knot showed a value.", "concept": "americas-before-1492"}, "monotheism": {"title": "Monotheism", "def": "Belief in only one God. Judaism, Christianity and Islam are monotheistic. Belief in many gods is called polytheism.", "concept": "judaism"}, "covenant": {"title": "Covenant", "def": "A solemn, binding agreement. In Judaism, the covenant is the agreement between God and the Jewish people.", "concept": null}, "exile": {"title": "Exile", "def": "Being forced to leave your homeland and live somewhere else.", "concept": null}, "torah": {"title": "Torah", "def": "The first five books of the Hebrew Bible, the holiest Jewish scripture. It contains the stories of the early Israelites and the laws of Moses.", "concept": "judaism"}, "diaspora": {"title": "Diaspora", "def": "A people scattered far from their homeland. The word is used especially for Jewish communities living outside the land of Israel.", "concept": null}, "satrap": {"title": "Satrap", "def": "A governor of a province in the Persian Empire, ruling in the king's name.", "concept": "persian-empire"}, "zoroastrianism": {"title": "Zoroastrianism", "def": "The ancient religion of Persia, founded by the prophet Zoroaster. It teaches that a good god, Ahura Mazda, is in a struggle against evil, and that people must choose good.", "concept": null}, "democracy": {"title": "Democracy", "def": "Government by the people. The word is Greek for \"rule by the people\". In a direct democracy citizens vote on laws themselves; in a representative democracy they elect others to do it.", "concept": "ancient-greece"}, "citizen": {"title": "Citizen", "def": "A full member of a state, with rights such as voting and duties such as military service. In the ancient world, many residents were not citizens.", "concept": null}, "philosophy": {"title": "Philosophy", "def": "Greek for \"love of wisdom\". Careful thinking about big questions: what is true, what is right, how we should live and how the world works.", "concept": null}, "hellenistic": {"title": "Hellenistic", "def": "Greek-influenced. The Hellenistic age is the period from Alexander's death in 323 BCE to 31 BCE, when Greek culture spread across the lands he had conquered.", "concept": "alexander-hellenism"}, "republic": {"title": "Republic", "def": "A state with no king, where power belongs to the citizens and is used by leaders they choose. From the Latin res publica, \"the public thing\".", "concept": "roman-republic"}, "senate": {"title": "Senate", "def": "In Rome, a council of leading men, mostly from rich families, who advised the government and controlled its money and foreign policy. From the Latin senex, \"old man\".", "concept": null}, "patrician": {"title": "Patricians and plebeians", "def": "The two main classes of Roman citizens. Patricians were old noble families; plebeians were everyone else, the common people.", "concept": null}, "emperor": {"title": "Emperor", "def": "The ruler of an empire. In Rome, the emperor held supreme power for life, though early emperors pretended to be just the first citizen of the Republic.", "concept": "roman-empire"}, "pax-romana": {"title": "Pax Romana", "def": "Latin for \"Roman peace\": about 200 years, from 27 BCE to 180 CE, of relative peace and prosperity across the Roman Empire.", "concept": "roman-empire"}, "latin": {"title": "Latin", "def": "The language of ancient Rome. It is the ancestor of Italian, French, Spanish, Portuguese and Romanian, and the source of many English words.", "concept": null}, "aqueduct": {"title": "Aqueduct", "def": "A channel, often carried on tall arches, that brings fresh water from hills or springs into a city by gravity.", "concept": null}, "vedas": {"title": "Vedas", "def": "The oldest Hindu scriptures: hymns, prayers and rituals in the ancient Indian language Sanskrit. The earliest were composed around 1500 to 1200 BCE and memorized word for word for centuries before being written down.", "concept": null}, "karma": {"title": "Karma", "def": "The idea that every action has consequences that follow a person, in this life or the next. Good actions lead toward a better rebirth, bad actions toward a worse one.", "concept": "hinduism"}, "dharma": {"title": "Dharma", "def": "A person's duty, the right way to live. In Hinduism it depends partly on your place in life, such as your age and caste. Buddhists use the same word for the Buddha's teaching.", "concept": null}, "caste": {"title": "Caste", "def": "A social group a person is born into and usually cannot leave. In India, caste shaped whom people could marry, what work they did and whom they could eat with.", "concept": null}, "nirvana": {"title": "Nirvana", "def": "In Buddhism, the end of suffering: the \"blowing out\" of desire, which frees a person from the cycle of rebirth.", "concept": "buddhism"}, "sangha": {"title": "Sangha", "def": "The Buddhist community, especially the monks and nuns who live by the Buddha's rules.", "concept": null}, "edicts": {"title": "Edicts", "def": "Official public announcements from a ruler. Ashoka's edicts were carved on stone pillars and rock faces so people across his empire could hear them read aloud.", "concept": null}, "filial-piety": {"title": "Filial piety", "def": "Respect, obedience and care that children owe their parents and ancestors. Confucius made it the root of all good behavior.", "concept": "confucianism"}, "daoism": {"title": "Daoism", "def": "A Chinese way of thought that teaches living simply and in harmony with nature and the Dao (\"the Way\"), the natural order of the universe. It grew up in the same centuries as Confucianism.", "concept": null}, "legalism": {"title": "Legalism", "def": "A Chinese school of thought that said people are selfish and must be controlled by strict laws, harsh punishments and rewards. The Qin dynasty ruled by it.", "concept": null}, "crucifixion": {"title": "Crucifixion", "def": "A Roman method of execution: the condemned person was nailed or tied to a wooden cross and left to die. Rome used it for slaves, rebels and the worst criminals.", "concept": null}, "messiah": {"title": "Messiah", "def": "Hebrew for \"anointed one\". In Jewish belief, a future king sent by God to free and restore Israel. Christ is the same word in Greek (Christos).", "concept": "christianity"}, "caravan": {"title": "Caravan", "def": "A group of traders traveling together, with camels or other pack animals, for safety on long journeys across deserts and wild country.", "concept": null}, "globalization": {"title": "Globalization", "def": "The growing connection of distant parts of the world through trade, travel and the spread of ideas.", "concept": null}, "icon": {"title": "Icon", "def": "A holy picture of Jesus, Mary or a saint, painted on wood, used in prayer in Orthodox churches. In the 700s and 800s Byzantines fought bitterly over whether icons were allowed.", "concept": null}, "schism": {"title": "Schism", "def": "A split in a religious community into separate groups. The Great Schism of 1054 divided Catholic and Orthodox Christians.", "concept": null}, "orthodox": {"title": "Eastern Orthodox Church", "def": "The branch of Christianity that grew from the Byzantine Church. It is led by patriarchs, not the pope, and is strongest today in Greece, Russia, Ukraine and the Balkans.", "concept": "byzantine-empire"}, "quran": {"title": "Quran", "def": "The holy book of Islam. Muslims believe it contains God's words, revealed to Muhammad and written down in Arabic.", "concept": "islam"}, "hijra": {"title": "Hijra", "def": "Muhammad's move from Mecca to Medina in 622 CE. The Islamic calendar counts its years from it.", "concept": null}, "prophet": {"title": "Prophet", "def": "A person believed to bring messages from God to other people.", "concept": null}, "five-pillars": {"title": "Five Pillars", "def": "The five core duties of every Muslim: declaring the faith, praying five times a day, giving to the poor, fasting in Ramadan and making the pilgrimage to Mecca.", "concept": "islam"}, "sunni-shia": {"title": "Sunni and Shia", "def": "The two main branches of Islam. They split over who should lead Muslims after Muhammad. Shia Muslims believe leadership belonged to his family, through Ali. About 85 to 90 percent of Muslims today are Sunni.", "concept": null}, "caliph": {"title": "Caliph", "def": "\"Successor\": the title of the leaders of the Muslim community after Muhammad, who ruled as both political and religious heads.", "concept": "islamic-caliphates"}, "jizya": {"title": "Jizya", "def": "A tax paid by non-Muslims, such as Christians and Jews, under Muslim rule. In return they were protected and could keep their religion.", "concept": null}, "pope": {"title": "Pope", "def": "The bishop of Rome and head of the Roman Catholic Church.", "concept": null}, "knight": {"title": "Knight", "def": "A warrior who fought on horseback in heavy armor. Knights usually received land in return for their service.", "concept": null}, "vassal": {"title": "Vassal", "def": "A person who received land from a lord and promised loyalty and service, especially in war, in return.", "concept": "feudalism"}, "fief": {"title": "Fief", "def": "Land given by a lord to a vassal in return for loyalty and service.", "concept": null}, "serf": {"title": "Serf", "def": "A peasant who was bound to a lord's land. Serfs were not slaves, since they could not be sold, but they could not leave without permission and owed the lord work and crops.", "concept": null}, "manor": {"title": "Manor", "def": "A lord's estate: his house, the village, the fields, a mill and a church. Most medieval peasants lived and worked on one.", "concept": null}, "crusade": {"title": "Crusade", "def": "A war declared holy by the pope. The best known were fought to win Jerusalem from Muslim rulers between 1095 and 1291.", "concept": "crusades"}, "civil-service-exam": {"title": "Civil service exam", "def": "A written test used in China to choose government officials. Candidates studied the Confucian classics for years. In theory anyone could pass; in practice, families who could pay for long study had an advantage.", "concept": "tang-song-china"}, "movable-type": {"title": "Movable type", "def": "Printing with separate pieces for each character, which can be rearranged and reused for new pages, instead of carving a whole page into one block of wood.", "concept": null}, "gunpowder": {"title": "Gunpowder", "def": "An explosive powder made from saltpeter, charcoal and sulfur. Chinese alchemists discovered it, probably in the 800s, and it was used in weapons by the 1000s.", "concept": null}, "nomad": {"title": "Nomad", "def": "A person who moves from place to place with their herds or in search of food, instead of living in one settled home.", "concept": null}, "khan": {"title": "Khan", "def": "A ruler or chief among the Mongols and other peoples of Central Asia. Genghis Khan's title meant roughly \"universal ruler\".", "concept": "mongol-empire"}, "khanate": {"title": "Khanate", "def": "A state ruled by a khan. The Mongol Empire split into four khanates.", "concept": null}, "plague": {"title": "Plague", "def": "A deadly disease caused by the bacterium Yersinia pestis, usually spread by flea bites. It still exists today, but antibiotics can cure it.", "concept": "black-death"}, "monsoon": {"title": "Monsoon", "def": "A seasonal wind that changes direction with the time of year. In South Asia it also brings the heavy summer rains.", "concept": "indian-ocean-trade"}, "dhow": {"title": "Dhow", "def": "A wooden sailing ship with large triangular sails, used by Arab, Persian, Indian and Swahili sailors in the Indian Ocean.", "concept": null}, "swahili": {"title": "Swahili", "def": "The people and culture of the East African coast, and their language, which is African at its root with many words borrowed from Arabic. Swahili is still widely spoken in East Africa.", "concept": null}, "griot": {"title": "Griot", "def": "A West African storyteller, singer and historian who keeps a people's history by memory and passes it on aloud.", "concept": null}, "mansa": {"title": "Mansa", "def": "The title of the kings of Mali, meaning king or ruler.", "concept": "west-african-empires"}, "n_yugoslavia": {"title": "Note: where the name Yugoslavia comes from", "def": "\"Yug\" means \"south\" in the South Slav languages, so Yugoslavia means \"land of the South Slavs\". The state was created after World War I, in 1918, first under the name Kingdom of Serbs, Croats and Slovenes.", "concept": null}, "n_italy": {"title": "Note: what Italy did", "def": "Italy said the Triple Alliance only covered defensive wars, and Austria-Hungary had attacked first. So Italy stayed neutral in 1914. In 1915 it joined the war on the other side, against Austria-Hungary.", "concept": null}, "n_belgium_1839": {"title": "Note: the 1839 treaty", "def": "The Treaty of London of 1839 recognized Belgium as an independent and permanently neutral country. Britain, France, Prussia, Austria and Russia all signed it. In 1914 the German chancellor reportedly called it \"a scrap of paper\".", "concept": null}, "n_russia_1905": {"title": "Note: why Russia backed down in 1909", "def": "Russia had lost a war against Japan in 1904 to 1905 and was not ready to fight. When Germany firmly backed Austria-Hungary in the Bosnian Crisis, Russia gave way. Many historians think Russia's leaders resolved not to back down again.", "concept": null}, "n_vidovdan": {"title": "Note: why 28 June mattered", "def": "28 June is Vidovdan, St. Vitus's Day, a Serbian national day. It marks the Battle of Kosovo in 1389, a defeat by the Ottomans that Serbs remember as a symbol of their nation. A royal visit on that day struck many Serb nationalists as an insult.", "concept": null}, "n_serbian_govt": {"title": "Note: how much did Serbia's government know?", "def": "This is still debated. The weapons came from Black Hand officers, led by the head of Serbian military intelligence, Dragutin Dimitrijević. Prime Minister Nikola Pašić seems to have learned something of the plot and may have sent a vague warning to Vienna. There is no clear evidence that the Serbian government ordered the killing.", "concept": null}, "n_princip": {"title": "Note: what happened to Princip", "def": "Princip was 19, too young under Austro-Hungarian law to be executed. He was sentenced to 20 years in prison and died of tuberculosis there in April 1918, before the war ended.", "concept": null}, "n_blame": {"title": "Note: who was to blame?", "def": "Historians still argue. The peace treaty of 1919 placed the responsibility on Germany and its allies. In the 1960s the German historian Fritz Fischer argued that Germany's leaders wanted a war. Others, such as Christopher Clark in The Sleepwalkers (2012), argue that responsibility was shared among several powers.", "concept": null}, "n_bc_ad": {"title": "Note: BC and AD", "def": "BC means \"before Christ\". AD stands for the Latin anno Domini, \"in the year of the Lord\". The numbers are the same as BCE and CE. Many historians use BCE and CE because the calendar is now shared by people of every religion.", "concept": null}, "n_jesus_birth": {"title": "Note: an old counting mistake", "def": "The year count was worked out by a monk, Dionysius Exiguus, in the 500s CE. Most scholars now think Jesus was actually born a few years earlier, around 6 to 4 BCE.", "concept": null}, "n_other_calendars": {"title": "Note: other calendars", "def": "Many other calendars are still in use. The Islamic calendar counts from 622 CE, the year Muhammad moved from Mecca to Medina. The Jewish and Chinese calendars count in their own ways. This site uses BCE and CE throughout.", "concept": null}, "n_both": {"title": "Note: primary for one question, secondary for another", "def": "It depends on the question. A 1950s textbook is a secondary source about ancient Rome. It is a primary source if your question is how schools in the 1950s taught about Rome.", "concept": null}, "n_caesar": {"title": "Note: why Caesar wrote it", "def": "Caesar sent his reports back to Rome while he was still fighting. Many historians think they were meant to build his reputation with Roman voters and answer critics in the Senate.", "concept": null}, "n_post_hoc": {"title": "Note: \"after this, so because of this\"", "def": "This mistake has a Latin name: post hoc ergo propter hoc. It means \"after this, therefore because of this\". Coming first is needed for a cause, but it is not enough.", "concept": null}, "n_neanderthal": {"title": "Note: Neanderthal DNA", "def": "When modern humans spread out of Africa, they sometimes had children with Neanderthals. As a result, most people whose ancestors come from outside Africa carry about 1 to 2 percent Neanderthal DNA.", "concept": null}, "n_americas": {"title": "Note: when did people arrive?", "def": "This is actively debated. People were certainly in the Americas by about 15,000 years ago. Some sites, such as fossil footprints in New Mexico, suggest people were there earlier, perhaps over 20,000 years ago, but not all scientists accept those dates.", "concept": null}, "n_independent": {"title": "Note: how do we know it began separately?", "def": "Each region domesticated its own local wild plants and animals. Maize was bred from a Mexican wild grass, and wheat from wild grasses of southwest Asia. If farming had spread from one place, the same crops would have spread with it.", "concept": null}, "n_civ_word": {"title": "Note: a word with a past", "def": "In the 1800s, \"civilized\" was often used to rank peoples, with Europeans at the top and others called \"savage\". Historians today reject that. They use \"civilization\" only to describe a type of society, one built around cities.", "concept": null}, "n_undeciphered": {"title": "Note: unread scripts", "def": "A script can only be deciphered with enough examples, ideally alongside a known language. Indus Valley inscriptions are very short, and no bilingual text has been found, so they still cannot be read.", "concept": null}, "n_rosetta": {"title": "Note: the Rosetta Stone", "def": "Knowledge of how to read hieroglyphs was lost for centuries. The Rosetta Stone, found in 1799, carries the same decree in hieroglyphs, a later Egyptian script and Greek. Using it, Jean-François Champollion deciphered hieroglyphs in 1822.", "concept": null}, "n_gilgamesh": {"title": "Note: the Epic of Gilgamesh", "def": "It tells of Gilgamesh, a king of Uruk, and his search for a way to live forever. It includes a great flood story with strong similarities to the later story of Noah in the Bible.", "concept": null}, "n_cleopatra": {"title": "Note: how long Egypt lasted", "def": "Cleopatra, the last pharaoh, died in 30 BCE. She lived closer in time to the first Moon landing in 1969 than to the building of the Great Pyramid around 2560 BCE.", "concept": null}, "n_xia": {"title": "Note: was there an earlier dynasty?", "def": "Later Chinese histories describe an earlier dynasty, the Xia. Some archaeologists link it to remains found at Erlitou, but no writing from that time has been found to prove it, so historians still debate whether the Xia existed as described.", "concept": null}, "n_exodus": {"title": "Note: tradition and evidence", "def": "The stories of Abraham, Moses and the Exodus come from the Hebrew Bible and Jewish tradition. Historians and archaeologists have found little outside evidence for them and debate how they relate to real events. Evidence from about 900 BCE onward, such as inscriptions mentioning Israelite kings, is much firmer.", "concept": null}, "n_cyrus_cylinder": {"title": "Note: the Cyrus Cylinder", "def": "A clay cylinder written for Cyrus after he took Babylon praises him for restoring temples and letting deported peoples go home. It is sometimes called the first charter of human rights, but most historians think that goes too far: it is royal propaganda in an old Mesopotamian style, though it does reflect a real policy.", "concept": null}, "n_couriers": {"title": "Note: \"neither snow nor rain\"", "def": "The Greek historian Herodotus admired the Persian royal messengers, saying nothing stopped them from finishing their route. His words, \"neither snow nor rain nor heat nor gloom of night\", were later carved on a New York post office.", "concept": null}, "n_greek_language": {"title": "Note: Greek everywhere", "def": "Greek remained the common language of the eastern Mediterranean for centuries. That is why the books of the Christian New Testament, written in the first century CE, were written in Greek.", "concept": null}, "n_caesar_title": {"title": "Note: Caesar's name", "def": "Julius Caesar's family name became a title for Roman emperors. Much later it lived on in the German word Kaiser and the Russian word Tsar, both meaning emperor.", "concept": null}, "n_hindu_word": {"title": "Note: the word \"Hindu\"", "def": "Hindus did not use this name for themselves in ancient times. It comes from Sindhu, the old name of the Indus River. Persians said it as \"Hindu\" and used it for the people beyond the river.", "concept": null}, "n_buddha_dates": {"title": "Note: uncertain dates", "def": "No writings survive from the Buddha's own lifetime, and his teachings were first written down centuries later. Scholars place his life somewhere between the late 500s and the early 300s BCE; many favor about 480 to 400 BCE.", "concept": null}, "n_numerals": {"title": "Note: \"Arabic\" numerals", "def": "The digits 0 to 9 and place value developed in India. The first clear written rules for calculating with zero come from the Indian mathematician Brahmagupta in 628 CE, after the Gupta age. Arab and Persian scholars passed the system on to Europe, which is why Europeans called the digits \"Arabic numerals\".", "concept": null}, "n_burning": {"title": "Note: book burning", "def": "Ancient sources say the books were burned in 213 BCE, though useful books on medicine, farming and fortune-telling were spared. A later story says the emperor also buried hundreds of scholars alive. Many historians doubt that part, or think it was exaggerated by his enemies.", "concept": null}, "n_jesus_evidence": {"title": "Note: what we know about Jesus", "def": "Almost all historians agree Jesus was a real person. Besides the Christian Gospels, he is mentioned by the Jewish historian Josephus and the Roman historian Tacitus. The odd date \"4 BCE\" exists because a monk who set up the BC/AD system around 525 CE made a small error in his counting.", "concept": null}, "n_silk_name": {"title": "Note: who named the Silk Roads", "def": "The German geographer Ferdinand von Richthofen coined the name Seidenstraße (\"Silk Road\") in 1877. People who traded on the routes never used it.", "concept": null}, "n_gibbon": {"title": "Note: Gibbon's famous answer", "def": "The English historian Edward Gibbon wrote The History of the Decline and Fall of the Roman Empire, starting in 1776. He blamed, among other things, the loss of old Roman civic virtue and the rise of Christianity. Modern historians find his answer too simple, but his book is still read.", "concept": null}, "n_byzantine_name": {"title": "Note: who called it \"Byzantine\"?", "def": "The Byzantines never used the word. They called themselves Romans, and their neighbors often did too. The name \"Byzantine Empire\" was made popular by western European scholars, starting in the 1500s.", "concept": null}, "n_muhammad_sources": {"title": "Note: sources on Muhammad's life", "def": "The Quran says little about Muhammad's life story. Most details come from Muslim biographies and traditions written down more than a century after his death, the earliest being that of Ibn Ishaq, who died around 767. Historians accept the main outline but treat some details with care.", "concept": null}, "n_paper": {"title": "Note: how paper reached the Islamic world", "def": "A well-known story says Chinese papermakers were captured at the Battle of Talas in 751 and taught their craft in Samarkand. Many historians now doubt that story and think the skill spread more gradually. Either way, paper was common in Baghdad by about 800.", "concept": null}, "n_feudalism_word": {"title": "Note: a debated word", "def": "No one in the Middle Ages used the word \"feudalism.\" Lawyers and historians invented it centuries later. Some historians now avoid it, because customs varied so much from place to place that one tidy \"system\" is misleading. It is still a useful shorthand for land given in return for service.", "concept": null}, "n_crusade_numbers": {"title": "Note: numbering the crusades", "def": "People at the time did not number the crusades. Later historians did, and they do not all agree on how to count them. Crusades were also fought against pagans in the Baltic, Muslims in Spain, and even Christians the pope saw as heretics.", "concept": null}, "n_printing": {"title": "Note: printing firsts", "def": "The oldest printed book with a date is the Diamond Sutra, a Buddhist text printed in China in 868. Bi Sheng's movable type was made of baked clay. Korea printed a book with metal movable type in 1377. Johannes Gutenberg developed his metal type press in Germany around 1450, apparently on his own.", "concept": null}, "n_mongol_deaths": {"title": "Note: how many died?", "def": "Estimates of deaths from the Mongol conquests vary widely, from several million to 40 million or more. Medieval writers often exaggerated numbers, and population records are poor, so no figure is certain.", "concept": null}, "n_marco_polo": {"title": "Note: did Marco Polo go to China?", "def": "Marco Polo's book describes travels from 1271 to 1295. A few scholars have doubted he reached China, since he never mentions tea or the Great Wall. Most historians think he did, because he describes many details accurately that he could hardly have known otherwise.", "concept": null}, "n_caffa": {"title": "Note: the siege of Caffa", "def": "An Italian writer, Gabriele de' Mussi, said the Mongol besiegers threw plague corpses over the walls of Caffa. He was probably not there, and historians debate the story. Rats and fleas moving between the camp and the town could explain the spread on their own.", "concept": null}, "n_zheng_he": {"title": "Note: how big were Zheng He's ships?", "def": "Chinese records describe \"treasure ships\" around 120 meters long, several times the size of Columbus's ships. Many historians think these numbers are exaggerated and that the largest ships were perhaps half that length. Either way, his fleets were far larger than any European fleet of the time.", "concept": null}, "n_mansa_musa": {"title": "Note: \"the richest man ever\"?", "def": "Mansa Musa is often called the richest person who ever lived. That makes a good headline but cannot really be measured, since his wealth was tied to the land and trade of his empire. It is certain that his gold amazed people from Cairo to Europe, and a map made on the Spanish island of Majorca in 1375, the Catalan Atlas, shows him holding a gold nugget.", "concept": null}}};

const SUBJ = LW_DATA.subject;
const LBL = SUBJ.labels || {example:"Worked example", practice:"Try it yourself", level:"Level"};
const C = {}; LW_DATA.concepts.forEach(c=>{ C[c.id]=c; });
const ORDER = LW_DATA.concepts.map(c=>c.id);
const G = LW_DATA.glossary;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

/* ---------- math (KaTeX) ---------- */
function tex(s, display){
  if(window.katex){ try{ return katex.renderToString(String(s), {displayMode:!!display, throwOnError:false}); }catch(e){} }
  return `<span class="tex-raw">${esc(s)}</span>`;
}
function typeset(root){
  if(!root) return;
  root.querySelectorAll("span.tex").forEach(el=>{
    const src = el.textContent, d = el.dataset.d==="1";
    if(window.katex){ try{ katex.render(src, el, {displayMode:d, throwOnError:false}); }catch(e){ el.classList.add("tex-raw"); } }
    else el.classList.add("tex-raw");
    el.classList.remove("tex"); el.classList.add("tex-done");
  });
}

/* ---------- widget registry: subject widgets call LW.widget(name, fn) ---------- */
const WIDGETS = {};
const LW = { widget(name, fn){ WIDGETS[name] = fn; }, tex, typeset, esc };

/* widgets/alliance-blocs.js */
// Static figure: the two camps of 1914. Solid lines are alliances, dashed lines are ententes. Used on: alliance-system.
LW.widget("alliance-blocs", function(el){
  const box = (x, y, name, sub, cls) => `<rect class="box ${cls||""}" x="${x}" y="${y}" width="150" height="46"/>
    <text x="${x+75}" y="${y+21}" text-anchor="middle" style="font-size:14px">${name}</text>
    ${sub ? `<text class="mt" x="${x+75}" y="${y+37}" text-anchor="middle" style="font-size:10.5px">${sub}</text>` : ""}`;
  el.innerHTML = `<figure class="fig">
    <svg viewBox="0 0 480 300" role="img" aria-label="Two camps. Triple Alliance: Germany and Austria-Hungary allied, Italy linked by a dotted line. Triple Entente: France and Russia allied, Britain linked to each by dashed lines.">
      <text class="mt" x="85" y="22" text-anchor="middle">TRIPLE ALLIANCE</text>
      <text class="mt" x="375" y="22" text-anchor="middle">TRIPLE ENTENTE</text>
      <path class="ax" d="M230 10 V290" style="stroke-dasharray:2 6"/>
      <path class="ln" d="M85 86 V136"/>
      <path class="ln" d="M85 182 V232" style="stroke-dasharray:2 4;opacity:.6"/>
      <path class="ln" d="M375 86 V136"/>
      <path class="sec" d="M375 182 V232" style="stroke-dasharray:6 5"/>
      <path class="sec" d="M450 63 C470 120 470 200 450 255" style="stroke-dasharray:6 5"/>
      ${box(10, 40, "Germany", "")}
      ${box(10, 136, "Austria-Hungary", "")}
      ${box(10, 232, "Italy", "stayed out in 1914")}
      ${box(300, 40, "France", "")}
      ${box(300, 136, "Russia", "")}
      ${box(300, 232, "Britain", "entente only")}
    </svg>
    <figcaption>Solid lines are alliances, promises to fight. Orange dashed lines are ententes, which promised nothing. Italy's link was real on paper only.</figcaption>
  </figure>`;
});

/* widgets/timeline.js */
// Data-driven figure: a vertical timeline. Each data line is "date | event".
// Used on several pages; the events are written in the page's Markdown, not here.
LW.widget("timeline", function(el, lw, args){
  const rows = (args.lines || []).map(l => { const i = l.indexOf("|"); return i < 0 ? ["", l] : [l.slice(0, i).trim(), l.slice(i + 1).trim()]; });
  el.innerHTML = `<figure class="fig tl"><ol>${rows.map(r => `<li><span class="when">${r[0]}</span><span class="what">${r[1]}</span></li>`).join("")}</ol>
    ${args.caption ? `<figcaption>${args.caption}</figcaption>` : ""}</figure>`;
});


/* ---------- levels ---------- */
const LEVEL = {};
function level(id, seen){
  if(LEVEL[id]) return LEVEL[id];
  seen = seen || new Set(); if(seen.has(id)) return 1; seen.add(id);
  const p = (C[id].prereqs||[]).filter(x=>C[x]);
  return LEVEL[id] = p.length ? 1 + Math.max(...p.map(x=>level(x, seen))) : 1;
}

/* ---------- state (progress is keyed by concept id) ---------- */
let cur = null, stack = [];
const mastered = new Set(), visited = new Set(), answered = {};
const KEY = SUBJ.storage || "learning-web";
try{
  const s = JSON.parse(localStorage.getItem(KEY)||"{}");
  (s.m||[]).forEach(x=>{ if(C[x]) mastered.add(x); });
  (s.v||[]).forEach(x=>{ if(C[x]) visited.add(x); });
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({m:[...mastered], v:[...visited]})); }catch(e){} }
const status = id => mastered.has(id) ? "m" : visited.has(id) ? "v" : "n";
const title = id => C[id] ? C[id].title : id;

/* ---------- rendering ---------- */
let introDismissed = false;

function mapHTML(){
  const byLevel = {};
  ORDER.forEach(id=>{ (byLevel[level(id)] = byLevel[level(id)] || []).push(id); });
  return Object.keys(byLevel).sort((a,b)=>a-b).map(l=>
    `<div class="lvl">${esc(LBL.level)} ${l}${l==1?" (start here)":""}</div>` +
    byLevel[l].map(id=>`<button class="mi ${id===cur?'on':''}" data-c="${id}"><i class="dot ${status(id)}"></i>${esc(C[id].title)}${C[id].stub?'<span class="soon">Draft</span>':''}</button>`).join("")
  ).join("");
}

function renderChrome(){
  $("maplist").innerHTML = mapHTML();
  const n = ORDER.filter(id=>mastered.has(id)).length;
  $("progbar").style.width = (100*n/ORDER.length)+"%";
  $("progtxt").textContent = `${n} of ${ORDER.length} marked “got it”`;
  $("backbtn").disabled = !stack.length;
  const ret = $("ret");
  if(stack.length){
    const top = stack[stack.length-1];
    ret.hidden = false;
    const names = stack.map(s=>title(s.id)).concat([title(cur)]).map(esc);
    const trail = (names.length>4 ? "…  ›  " : "") + names.slice(-4).join("  ›  ");
    ret.innerHTML = `<span>You stepped away from <b>${esc(title(top.id))}</b>.</span><span class="trail">${trail}</span><button data-act="back">← Return to ${esc(title(top.id))}</button>`;
  }else{ ret.hidden = true; ret.innerHTML = ""; }
}

function checkHTML(id, tag){
  const k = C[id].check;
  return `<div class="q" data-q="${id}"><div class="tag">${esc(tag)}</div><p class="qt">${k.q}</p>
    <div class="opts">${k.options.map((o,i)=>`<button class="opt" data-act="ans" data-id="${id}" data-i="${i}">${o}</button>`).join("")}</div>
    <div class="fb" id="fb-${id}" aria-live="polite"></div></div>`;
}

function pageHTML(id){
  const c = C[id];
  const next = ORDER.filter(o=>C[o].prereqs.includes(id));
  const prereqs = c.prereqs.filter(p=>C[p]);
  const prereq = prereqs.length ? `
    <section class="prereq"><h2>What you need for this</h2><ul>
      ${prereqs.map(p=>`<li><div class="pr-head"><i class="dot ${status(p)}"></i><strong>${esc(C[p].title)}</strong>
        <button class="lnk" data-act="recap" data-id="${p}">Remind me</button>
        <button class="lnk" data-c="${p}">Open page</button></div>
        <div class="recap" id="recap-${p}" hidden>${C[p].recap}</div></li>`).join("")}
    </ul></section>
    <section class="checks"><h2>Check yourself first</h2>
      <p>One quick question per idea you need. A wrong answer sends you to that page. An orange bar at the top brings you back.</p>
      ${prereqs.map(p=>checkHTML(p, "Needed idea: "+C[p].title)).join("")}
    </section>` : `<section class="prereq"><h2>What you need for this</h2><p>Nothing. This is a starting point.</p></section>`;
  let main;
  if(c.stub){
    main = `<section class="stub"><h2>Not written yet</h2><p>This page is still being written. Here is the short version.</p><div class="recap">${c.recap}</div></section>`;
  }else{
    const ex = c.example ? `<section class="ex"><h2>${esc(LBL.example)}</h2><p class="exq">${c.example.title}</p><ol class="steps">${
      c.example.steps.map(s=>`<li><div class="st">${s.text}</div>${s.why?`<div class="why">${s.why}</div>`:""}${
        s.uses.length ? `<div class="uses">Uses: ${s.uses.map(u=>`<button class="chip" data-c="${u}">${esc(title(u))}</button>`).join("")}</div>`:""}</li>`).join("")
    }</ol></section>` : "";
    const practice = c.practice ? `<details class="practice"><summary>${esc(LBL.practice)}</summary><p>${c.practice.q}</p>
      <details class="ans"><summary>Show answer</summary><p>${c.practice.answer}</p></details></details>` : "";
    main = `${c.body}${ex}${practice}`;
  }
  const mine = `<section class="checks"><h2>Do you have it?</h2>${checkHTML(id,"Check")}</section>`;
  const master = `<div class="master"><button class="mbtn ${mastered.has(id)?'on':''}" data-act="master" data-id="${id}" aria-pressed="${mastered.has(id)}">${mastered.has(id)?"✓ Got it":"Mark as got it"}</button>
    <span class="progtxt" style="margin:0">Your map updates when you mark it.</span></div>
    ${next.length?`<div class="next"><strong>Where this leads:</strong> ${next.map(n=>`<button class="lnk" data-c="${n}">${esc(C[n].title)} →</button>`).join("")}</div>`:`<div class="next"><strong>Nothing builds on this page yet.</strong></div>`}`;
  const intro = (SUBJ.intro && !introDismissed && stack.length===0 && id===SUBJ.intro.page) ? `<div class="intro"><button class="x" data-act="dismiss" aria-label="Dismiss">×</button>${SUBJ.intro.html}</div>` : "";
  const big = c.stub ? "" : `<p class="big">${c.big}</p>`;
  return `${intro}<article><div class="eyebrow">${esc(LBL.level)} ${level(id)} · ${esc(SUBJ.name)}</div><h1 class="title">${esc(c.title)}</h1>${big}
    ${prereq}${main}${mine}${master}</article>`;
}

function mountWidgets(root){
  root.querySelectorAll(".widget[data-w]").forEach(el=>{
    const name = el.dataset.w, f = WIDGETS[name];
    if(!f){ el.innerHTML = `<div class="fig missing">Figure “${esc(name)}” is missing.</div>`; return; }
    let args = {lines:[], caption:""}; try{ args = JSON.parse(el.dataset.args||"{}"); }catch(e){}
    try{ f(el, LW, args); typeset(el); }catch(e){ console.error(e); el.innerHTML = `<div class="fig missing">Figure “${esc(name)}” failed to load.</div>`; }
  });
}
/* Pictures load live from Wikimedia Commons. If this host blocks outside images,
   show a captioned link that opens the picture in a new tab instead. */
function mountPictures(root){
  root.querySelectorAll(".fig.pic").forEach(fig=>{
    const frame = fig.querySelector(".picframe");
    const fallback = ()=>{ frame.innerHTML = `<a class="piclink" href="${esc(fig.dataset.page)}" target="_blank" rel="noopener"><span class="ico">IMG</span><span>${esc(fig.dataset.alt)}<small>Open the picture on Wikimedia Commons ↗</small></span></a>`; };
    const img = new Image();
    img.alt = fig.dataset.alt; img.loading = "lazy"; img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.onerror = fallback;
    img.src = fig.dataset.src;
    frame.innerHTML = ""; frame.appendChild(img);
    setTimeout(()=>{ if(!img.complete || !img.naturalWidth){ if(!img.complete) return; fallback(); } }, 4000);
  });
}
function markMissing(root){
  root.querySelectorAll("[data-c]").forEach(el=>{ if(!C[el.dataset.c]){ el.classList.add("missing"); el.title="This page is not written yet"; } });
}

function render(id){
  cur = id;
  visited.add(id); save();
  const m = $("main");
  m.innerHTML = pageHTML(id);
  typeset(m);
  Object.keys(answered).forEach(k=>{ if($("fb-"+k)) applyAnswer(k, answered[k], true); });
  mountWidgets(m);
  mountPictures(m);
  markMissing(m);
  renderChrome();
  closePop();
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  document.title = C[id].title + " · " + SUBJ.title;
}

function go(id){
  if(!C[id] || id===cur) return;
  stack.push({id:cur, y:window.scrollY});
  if(stack.length>30) stack.shift();
  render(id);
  window.scrollTo(0,0);
}
function back(){
  const e = stack.pop();
  if(!e) return;
  render(e.id);
  window.scrollTo(0,e.y);
}

/* ---------- check questions ---------- */
function applyAnswer(id, i, quiet){
  const k = C[id].check, fb = $("fb-"+id);
  const q = document.querySelector(`.q[data-q="${id}"]`);
  if(!fb || !q) return;
  q.querySelectorAll(".opt").forEach(b=>b.classList.remove("ok","no"));
  const btn = q.querySelector(`.opt[data-i="${i}"]`);
  if(i===k.answer){
    btn.classList.add("ok");
    fb.className="fb ok"; fb.innerHTML = `Correct. ${k.why}`;
    if(!quiet){ mastered.add(id); visited.add(id); save(); renderChrome(); refreshDots(); }
  }else{
    btn.classList.add("no");
    fb.className="fb no"; fb.innerHTML = `Not quite. ${k.why}` + (id!==cur ? ` <button class="lnk" data-c="${id}">Review ${esc(C[id].title)}</button>` : ` Re-read the sections above, then try again.`);
  }
  typeset(fb);
}
function refreshDots(){
  document.querySelectorAll(".pr-head").forEach(h=>{
    const btn = h.querySelector("[data-c]"); if(!btn) return;
    const d = h.querySelector(".dot"); d.className = "dot "+status(btn.dataset.c);
  });
  const m = document.querySelector(".mbtn");
  if(m){ const on = mastered.has(cur); m.classList.toggle("on",on); m.textContent = on?"✓ Got it":"Mark as got it"; m.setAttribute("aria-pressed",on); }
}

/* ---------- pop-ups (terms and footnotes) ---------- */
function closePop(){ $("pop").hidden = true; $("pop").innerHTML = ""; }
function showPop(key, el){
  const g = G[key]; if(!g) return;
  const pop = $("pop");
  pop.innerHTML = `<b>${g.title}</b>${g.def}${g.concept && C[g.concept] && g.concept!==cur ? `<div><button class="lnk" data-c="${g.concept}">Open “${esc(C[g.concept].title)}”</button></div>`:""}`;
  typeset(pop);
  pop.hidden = false;
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(Math.max(12, r.left), window.innerWidth - pw - 12);
  let y = r.bottom + 8; if(y + ph > window.innerHeight - 8) y = Math.max(8, r.top - ph - 8);
  pop.style.left = x+"px"; pop.style.top = y+"px";
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target;
  const act = t.closest("[data-act]");
  if(act){
    const a = act.dataset.act, id = act.dataset.id;
    if(a==="back") return back();
    if(a==="recap"){ const r=$("recap-"+id); r.hidden=!r.hidden; act.textContent = r.hidden?"Remind me":"Hide reminder"; return; }
    if(a==="ans"){ const i=parseInt(act.dataset.i,10); answered[id]=i; applyAnswer(id,i,false); return; }
    if(a==="master"){ mastered.has(id)?mastered.delete(id):mastered.add(id); save(); refreshDots(); renderChrome(); return; }
    if(a==="dismiss"){ introDismissed=true; act.parentElement.remove(); return; }
  }
  const c = t.closest("[data-c]");
  if(c){ go(c.dataset.c); return; }
  const g = t.closest("[data-g]");
  if(g){ const pop=$("pop"); if(!pop.hidden && pop.dataset.key===g.dataset.g){ closePop(); return; } pop.dataset.key=g.dataset.g; showPop(g.dataset.g,g); return; }
  if(!t.closest("#pop")) closePop();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePop(); });
window.addEventListener("scroll", closePop, {passive:true});
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(C[h] && h!==cur) go(h); });

(function start(){
  $("sitesub").textContent = `${SUBJ.subtitle ? SUBJ.subtitle+" · " : ""}${ORDER.length} linked concepts`;
  const h = location.hash.slice(1);
  render(C[h] ? h : (C[SUBJ.start] ? SUBJ.start : ORDER[0]));
})();
</script>
