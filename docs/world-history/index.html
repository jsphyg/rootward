at made many of them resent Aztec rule.<\/p>\n<h2>The Inca<\/h2>\n<p>The Inca built the largest empire in the Americas along the Andes mountains, with perhaps 10 million people. Its capital was Cusco.<\/p>\n<p>The Inca had no writing, no iron and no wheeled vehicles. Yet they ran a huge empire. A road network of tens of thousands of kilometers carried relay runners and armies. Storehouses held food for hard times. Officials recorded numbers on <button class=\"term\" data-g=\"quipu\">quipu<\/button>, sets of knotted strings.<\/p>\n<p><strong>Why it matters.<\/strong> The Americas show that civilization was not invented once and spread. People on a separate continent built cities, states, calendars and writing on their own.<\/p>", "example": {"title": "Why did the Americas develop on a separate path from Europe, Africa and Asia?", "steps": [{"text": "Rising seas after the Ice Age cut the Americas off from Asia.", "why": "The land bridge was flooded, and the oceans were too wide to cross regularly.", "uses": ["human-origins"]}, {"text": "The Americas had different plants and very few large animals that could be domesticated.", "why": "Horses had died out there thousands of years earlier. The llama was the only large pack animal.", "uses": ["agricultural-revolution"]}, {"text": "So the peoples of the Americas built cities, states and writing with their own crops and tools.", "why": "They developed independently, with no ideas borrowed from other continents.", "uses": []}, {"text": "They also had no exposure to the diseases of Europe, Africa and Asia.", "why": "This would prove catastrophic after 1492, when contact brought new diseases they had no resistance to.", "uses": ["causation"]}]}, "practice": {"q": "The Inca had no writing. How did they run an empire of millions of people?", "answer": "Officials kept records of people, goods and taxes on knotted-string quipu. A huge road system carried relay runners with messages and moved armies quickly. Storehouses along the roads held food and supplies. People paid taxes partly in labor for the state."}, "stub": false}, {"id": "empire", "title": "What an empire is", "prereqs": ["civilization"], "big": "An empire is a state that rules many different peoples and lands from one center, usually won by conquest and held together by armies, officials, roads and taxes.", "recap": "An empire rules many peoples and lands from one center, usually after conquering them. It holds together with an army, officials, roads, taxes or tribute, and often by letting conquered peoples keep their own customs. Empires tend to fall when they grow too big to defend or fight over who rules.", "check": {"q": "What makes a state an empire?", "options": ["It rules many different peoples and lands from one center.", "It has a king or an emperor.", "It is very old.", "It is often at war."], "answer": 0, "why": "An empire is defined by what it rules, not by the title of its ruler. Rome conquered most of the Mediterranean while it was a republic with no emperor. Plenty of small kingdoms had kings but ruled only one people. Age and war do not make an empire either."}, "body": "<h2>One center, many peoples<\/h2>\n<p>The first cities ruled only themselves and their nearby fields. An <button class=\"term\" data-g=\"empire\">empire<\/button> is different. It rules many peoples, with different languages, religions and customs, from one capital.<\/p>\n<p>Most empires were built by conquest. The first known one was built by Sargon of Akkad in Mesopotamia, around 2300 BCE. Many followed.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Empire<\/th><th>Center<\/th><th>At its height<\/th><\/tr><\/thead><tbody><tr><td>Persian<\/td><td>Persia (Iran)<\/td><td>About 500 BCE<\/td><\/tr><tr><td>Roman<\/td><td>Rome<\/td><td>About 117 CE<\/td><\/tr><tr><td>Han<\/td><td>China<\/td><td>About 100 BCE<\/td><\/tr><tr><td>Inca<\/td><td>Cusco, in the Andes<\/td><td>About 1500 CE<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: empires grew up on every continent with cities, in very different times.<\/em><\/p>\n<h2>How empires hold together<\/h2>\n<p>Conquering land is one thing. Holding it is harder. Empires that lasted usually used the same set of tools:<\/p>\n<ul><li><strong>An army<\/strong> to defend the borders and crush revolts.<\/li><li><strong>Officials and governors<\/strong> to rule distant regions in the ruler's name.<\/li><li><strong>Taxes or <button class=\"term\" data-g=\"tribute\">tribute<\/button><\/strong> to pay for the army and the officials.<\/li><li><strong>Roads and messengers<\/strong> to move soldiers and orders quickly.<\/li><li><strong>A shared idea<\/strong>, such as a religion, a law or a belief that the ruler was chosen by the gods.<\/li><li><strong>Some tolerance.<\/strong> Letting conquered peoples keep their gods, languages and local leaders made them less likely to revolt.<\/li><\/ul>\n<h2>Why empires fall<\/h2>\n<p>Empires rarely fall for one reason. Common causes include growing too large to defend, running out of money, fights over who should rule next, revolts by conquered peoples, and attacks from outside. Usually several of these build up together.<\/p>\n<p><strong>Why it matters.<\/strong> For most of recorded history, most people lived inside empires. Empires spread languages, religions, laws and trade over huge areas. They also brought conquest, heavy taxes and rule by outsiders.<\/p>", "example": {"title": "How a new empire turns conquered land into a working state.", "steps": [{"text": "The conquerors put governors in charge of each region.", "why": "One ruler cannot run every place personally from the capital.", "uses": []}, {"text": "The governors collect taxes or tribute from the local people.", "why": "The army and officials must be paid, and the empire must profit from its conquests.", "uses": []}, {"text": "The empire builds roads and a messenger system.", "why": "Orders, news and soldiers must reach distant regions quickly, before a revolt can spread.", "uses": []}, {"text": "The empire leaves local customs and religions mostly alone, as long as people pay and obey.", "why": "People are less likely to revolt if their daily life is not turned upside down.", "uses": ["causation"]}]}, "practice": {"q": "In 146 BCE, Rome was a republic ruled by elected officials, but it governed Italy, Spain, Greece and North Africa. Was it already an empire?", "answer": "Yes. An empire is a state that rules many peoples and lands from one center. Rome did that long before it had an emperor. The word \"empire\" is about what is ruled, not about the title of the ruler."}, "stub": false}, {"id": "judaism", "title": "Judaism", "prereqs": ["mesopotamia"], "big": "Judaism is the religion of the Jewish people, the first major faith to worship only one God, and the root from which Christianity and Islam grew.", "recap": "Judaism grew among the ancient Israelites, a people of the eastern Mediterranean with roots in Mesopotamia. It teaches that there is one God, who made a covenant with the Jewish people. Its scriptures form the Hebrew Bible. Judaism survived conquest and exile, and it is the foundation of both Christianity and Islam.", "check": {"q": "What made the religion of the ancient Israelites different from most religions around them?", "options": ["They worshipped only one God.", "They built temples.", "They had priests.", "They wrote their holy texts in cuneiform."], "answer": 0, "why": "Almost every people of the time worshipped many gods. The Israelites came to believe in one God only. Temples and priests were common everywhere, so they were not what made Judaism different. Its scriptures were written in Hebrew, not cuneiform."}, "body": "<h2>One God<\/h2>\n<p>Most ancient peoples believed in many gods, each with power over one thing: the sun, a river, a city. The ancient Israelites, also called the Hebrews, came to believe something different: that there is only one God, who created everything. This belief is called <button class=\"term\" data-g=\"monotheism\">monotheism<\/button>.<\/p>\n<p>According to Jewish tradition, the story begins with Abraham, who came from the city of Ur in Mesopotamia. God made a <button class=\"term\" data-g=\"covenant\">covenant<\/button>, a sacred agreement, with Abraham and his descendants. Later, the prophet Moses led the Israelites out of slavery in Egypt and received God's law, including the Ten Commandments.<button class=\"fn\" data-g=\"n_exodus\" aria-label=\"Note 1\">1<\/button><\/p>\n<h2>Kingdom, conquest and exile<\/h2>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>About when<\/th><th>What happened<\/th><\/tr><\/thead><tbody><tr><td>About 1000 BCE<\/td><td>Kings David and Solomon rule a kingdom of Israel, with a temple in Jerusalem<\/td><\/tr><tr><td>722 BCE<\/td><td>The Assyrians conquer the northern kingdom, Israel<\/td><\/tr><tr><td>586 BCE<\/td><td>The Babylonians destroy Jerusalem and its Temple, and take many Jews into <button class=\"term\" data-g=\"exile\">exile<\/button><\/td><\/tr><tr><td>538 BCE<\/td><td>The Persian king Cyrus lets the exiles return and rebuild the Temple<\/td><\/tr><tr><td>70 CE<\/td><td>The Romans destroy the rebuilt Temple<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the Jewish people were conquered by almost every great empire of the region, one after another.<\/em><\/p>\n<h2>A portable faith<\/h2>\n<p>The exile in Babylon changed Judaism deeply. With the Temple gone and the people far from home, Jewish faith came to center on scripture, law, prayer and the Sabbath, the weekly day of rest. These could be practiced anywhere.<\/p>\n<p>The holiest scripture is the <button class=\"term\" data-g=\"torah\">Torah<\/button>, the first five books of the Hebrew Bible. Its laws cover worship, food, family and justice, including care for the poor and the stranger.<\/p>\n<p>After the Romans destroyed the Temple in 70 CE, most Jews lived scattered across many lands. This scattering is called the <button class=\"term\" data-g=\"diaspora\">diaspora<\/button>. Their faith held them together as a people for nearly 2,000 years without a homeland.<\/p>\n<p><strong>Why it matters.<\/strong> Judaism's belief in one God, and its idea that God demands justice and right behavior, passed into Christianity and Islam. Together, these three faiths are followed by more than half of the people in the world today.<\/p>", "example": {"title": "How the Babylonian exile made Judaism a faith that could survive anywhere.", "steps": [{"text": "In 586 BCE the Babylonians destroyed the Temple in Jerusalem and deported many Jews.", "why": "Babylon was punishing a rebellion and breaking the kingdom's power.", "uses": ["mesopotamia"]}, {"text": "Without their Temple, the exiles could no longer worship in the old way, through sacrifices there.", "why": "Worship had been centered on that one building.", "uses": []}, {"text": "They focused instead on studying scripture, keeping the law and the Sabbath, and praying together.", "why": "These practices needed no temple and no homeland.", "uses": []}, {"text": "This portable faith let the Jewish people keep their identity through later conquests and scattering.", "why": "A religion based on texts and practice can travel wherever its people go.", "uses": ["causation"]}]}, "practice": {"q": "Name two religions that grew out of Judaism, and one belief they took from it.", "answer": "Christianity and Islam. Both took the belief that there is only one God, who created the world and expects people to live justly."}, "stub": false}, {"id": "persian-empire", "title": "The Persian Empire", "prereqs": ["empire", "mesopotamia"], "big": "Founded by Cyrus the Great around 550 BCE, the Persian Empire was the largest the world had yet seen, and it was held together by good roads, local governors and tolerance.", "recap": "The Persian Empire, founded by Cyrus the Great around 550 BCE, stretched from Egypt and Turkey to the Indus River. Its kings ruled through governors called satraps, linked the empire with roads, and mostly let conquered peoples keep their own religions and customs. Alexander the Great conquered it in 330 BCE.", "check": {"q": "How did the Persian kings mostly keep their many different peoples loyal?", "options": ["They let conquered peoples keep their own religions and customs, as long as they paid taxes and obeyed.", "They forced everyone to speak Persian and follow the Persian religion.", "They destroyed every city they conquered.", "They let each province choose its own king."], "answer": 0, "why": "Persia's kings were famous for tolerance. Cyrus let the exiled Jews go home, and local gods were respected. They did not force their language or religion on others, and they ruled provinces through governors they appointed themselves."}, "body": "<h2>Cyrus the Great<\/h2>\n<p>The Persians came from what is now Iran. Around 550 BCE their king, Cyrus, began a series of conquests. In 539 BCE he took Babylon, the great city of Mesopotamia.<\/p>\n<p>Instead of punishing the conquered, Cyrus often respected their gods and customs. He allowed the Jews exiled in Babylon to return home and rebuild their temple.<button class=\"fn\" data-g=\"n_cyrus_cylinder\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>Under the kings who followed, the empire stretched from Egypt and Turkey in the west to the Indus River in the east. It was the largest empire the world had yet seen.<\/p>\n<h2>Darius and the art of running an empire<\/h2>\n<p>King Darius I (who ruled 522 to 486 BCE) organized the empire so it could be governed.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Tool<\/th><th>How it worked<\/th><\/tr><\/thead><tbody><tr><td>Provinces<\/td><td>The empire was divided into about 20 provinces, each run by a governor called a <button class=\"term\" data-g=\"satrap\">satrap<\/button><\/td><\/tr><tr><td>Inspectors<\/td><td>Officials called \"the eyes and ears of the king\" checked on the satraps<\/td><\/tr><tr><td>The Royal Road<\/td><td>A highway of about 2,700 km linked the west of the empire to the capital, with relay stations for fast messengers<button class=\"fn\" data-g=\"n_couriers\" aria-label=\"Note 2\">2<\/button><\/td><\/tr><tr><td>Coins and taxes<\/td><td>Standard gold coins and fixed taxes made trade and payment easier<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: almost every tool on this list is about control at a distance. That was the central problem of a huge empire.<\/em><\/p>\n<p>The Persians followed a religion called <button class=\"term\" data-g=\"zoroastrianism\">Zoroastrianism<\/button>, which taught that the world is a struggle between good and evil.<\/p>\n<h2>War with Greece and the end<\/h2>\n<p>Persia tried to conquer the Greek city-states, but was defeated, at Marathon in 490 BCE and at Salamis in 480 BCE. A century and a half later, Alexander the Great of Macedonia turned the tables. By 330 BCE, he had conquered the entire Persian Empire.<\/p>\n<p><strong>Why it matters.<\/strong> Persia showed how a huge empire could be run: through local governors, good roads, standard money and tolerance. Later empires, including Alexander's and Rome's, followed a similar model.<\/p>", "example": {"title": "How Darius kept control of an empire too big for one person to see.", "steps": [{"text": "He divided the empire into provinces, each ruled by a satrap.", "why": "Someone had to govern each region on the spot, in the king's name.", "uses": ["empire"]}, {"text": "He sent inspectors, \"the eyes and ears of the king\", to check on the satraps.", "why": "A governor far from the capital might grow too powerful or rebel.", "uses": []}, {"text": "He built the Royal Road, with fresh horses and riders at stations along it.", "why": "News of trouble could reach the king, and his orders the provinces, in days instead of months.", "uses": []}, {"text": "He let local peoples keep their own religions and customs.", "why": "Tolerance made revolts less likely and the empire cheaper to rule.", "uses": []}]}, "practice": {"q": "Why might tolerance have been a smart policy for Persian kings, not just a kind one?", "answer": "People who keep their own gods, customs and local leaders have fewer reasons to revolt. Fewer revolts meant fewer costly wars and a steady flow of taxes. Tolerance made a huge, varied empire cheaper and safer to rule."}, "stub": false}, {"id": "ancient-greece", "title": "Ancient Greece and the city-state", "prereqs": ["civilization"], "big": "Ancient Greece was a world of small, independent city-states, such as Athens and Sparta, that shared a language and gods and created democracy, philosophy and theater.", "recap": "Ancient Greece was divided by mountains and sea into many independent city-states. Athens created the first democracy, about 508 BCE, though only adult male citizens could vote. Sparta was a military state. The Greeks shared a language, gods and the Olympic Games, and their thinkers, such as Socrates, Plato and Aristotle, shaped later Western thought.", "check": {"q": "Who could vote in the democracy of ancient Athens?", "options": ["Adult male citizens only", "Every adult who lived in Athens", "Only rich landowners", "Both men and women citizens"], "answer": 0, "why": "Athenian democracy gave power to adult male citizens, who could vote directly on laws. Women, enslaved people and foreigners living in Athens could not vote. That was still a much wider group than in other states of the time, where one ruler or a few rich families decided."}, "body": "<h2>A land of mountains and sea<\/h2>\n<p>Greece is a land of rocky mountains, small valleys and many islands. Travel over land was hard; travel by sea was easier. So the Greeks never formed one country. Instead they lived in hundreds of independent <button class=\"term\" data-g=\"city-state\">city-states<\/button>, each called a polis.<\/p>\n<p>Each polis had its own government, laws and army. They often fought each other. But they shared a language, the same gods, and festivals such as the Olympic Games, first held, by tradition, in 776 BCE. Greeks thought of all non-Greek speakers as outsiders.<\/p>\n<h2>Athens and Sparta<\/h2>\n<p>The two most famous city-states were very different.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th><\/th><th>Athens<\/th><th>Sparta<\/th><\/tr><\/thead><tbody><tr><td>Government<\/td><td><button class=\"term\" data-g=\"democracy\">Democracy<\/button>: citizens voted on laws<\/td><td>Two kings and a council of elders<\/td><\/tr><tr><td>What it valued<\/td><td>Trade, art, ideas, the sea<\/td><td>Military discipline, obedience<\/td><\/tr><tr><td>Boys' education<\/td><td>Reading, music, sport, speaking<\/td><td>Army training from age 7<\/td><\/tr><tr><td>Who did the farm work<\/td><td>Citizens, and many enslaved people<\/td><td>Helots, a huge enslaved population<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: both societies depended on enslaved labor. Freedom for some rested on unfreedom for others.<\/em><\/p>\n<p>Athens' democracy began around 508 BCE. Every adult male <button class=\"term\" data-g=\"citizen\">citizen<\/button> could speak and vote in the assembly. It was a direct democracy, where citizens voted on laws themselves.<\/p>\n<h2>War with Persia, and with each other<\/h2>\n<p>When Persia invaded, the Greek city-states united and won, at Marathon (490 BCE) and Salamis (480 BCE). Afterwards Athens grew rich and powerful, and in its golden age built the Parthenon temple.<\/p>\n<figure class=\"fig pic\" data-src=\"https://commons.wikimedia.org/wiki/Special:FilePath/The_Parthenon_in_Athens.jpg?width=800\" data-page=\"https://commons.wikimedia.org/wiki/File:The_Parthenon_in_Athens.jpg\" data-alt=\"The Parthenon, a ruined marble temple with rows of columns on a hilltop\"><div class=\"picframe\"><\/div><figcaption>The Parthenon in Athens, a temple to the goddess Athena finished in 432 BCE. Notice the columns: this style was copied for banks, museums and government buildings around the world.<span class=\"credit\">Image: Wikimedia Commons (author and license on the source page) · <a href=\"https://commons.wikimedia.org/wiki/File:The_Parthenon_in_Athens.jpg\" target=\"_blank\" rel=\"noopener\">source<\/a><\/span><\/figcaption><\/figure>\n<p>But Athens and Sparta became rivals. Their long war, the Peloponnesian War (431 to 404 BCE), ended in Athens' defeat and left Greece weakened and divided.<\/p>\n<h2>Ideas that lasted<\/h2>\n<p>Greeks asked big questions about nature, truth, justice and how to live. This kind of thinking is called <button class=\"term\" data-g=\"philosophy\">philosophy<\/button>. Socrates questioned everything and was put to death by Athens in 399 BCE. His student Plato wrote about the ideal state. Plato's student Aristotle wrote on science, politics and logic.<\/p>\n<p>Greeks also created theater, both tragedy and comedy, and the writing of history. Herodotus, who wrote about the Persian Wars, is often called the \"father of history\".<\/p>\n<p><strong>Why it matters.<\/strong> Democracy, philosophy, theater and the study of history all have Greek roots. Rome borrowed heavily from Greece, and through Rome these ideas passed into Europe and the wider world.<\/p>", "example": {"title": "Why did Greece become many city-states instead of one country?", "steps": [{"text": "Mountains split the land into small, separate valleys and plains.", "why": "Crossing mountains was slow and hard, so communities grew up apart.", "uses": []}, {"text": "Each community governed itself and grew into an independent polis.", "why": "With no easy way to rule a distant valley, each region looked after its own affairs.", "uses": ["civilization"]}, {"text": "The sea connected them for trade, but did not unite them politically.", "why": "Ships carried goods and ideas, so Greeks shared a culture without sharing a government.", "uses": []}, {"text": "The result was a shared Greek world of rival city-states that often fought each other.", "why": "Independence bred competition, in war, trade, sport and ideas.", "uses": ["causation"]}]}, "practice": {"q": "In what ways was Athenian democracy different from democracy in most countries today?", "answer": "It was direct: citizens voted on laws themselves, instead of electing representatives. And it was limited: only adult male citizens could take part. Women, enslaved people and foreigners were excluded, so most adults in Athens had no vote."}, "stub": false}, {"id": "alexander-hellenism", "title": "Alexander and the spread of Greek culture", "prereqs": ["ancient-greece", "persian-empire"], "big": "Alexander the Great conquered the Persian Empire in about ten years, and after his death Greek language and culture spread from Egypt to the edge of India.", "recap": "Alexander of Macedonia conquered Greece, Egypt and the whole Persian Empire, reaching India, before dying in 323 BCE at 32. His generals split his empire into kingdoms. In this Hellenistic age, Greek became the shared language of trade and learning across the eastern Mediterranean and western Asia.", "check": {"q": "What happened to Alexander's empire after he died?", "options": ["His generals split it into several kingdoms.", "His son ruled all of it for fifty years.", "The Persians immediately took it back.", "Rome conquered it the following year."], "answer": 0, "why": "Alexander died young without an adult heir, and his generals fought over his conquests. They divided them into kingdoms, such as Ptolemaic Egypt. Persia never returned, and Rome conquered these kingdoms only gradually, over the next two to three centuries."}, "body": "<h2>From Macedonia<\/h2>\n<p>Macedonia was a kingdom on the northern edge of the Greek world. Its king, Philip II, built a powerful army and took control of the Greek city-states in 338 BCE.<\/p>\n<p>When Philip was murdered in 336 BCE, his son Alexander became king at 20. Aristotle had been his teacher.<\/p>\n<h2>Ten years of conquest<\/h2>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Year<\/th><th>What happened<\/th><\/tr><\/thead><tbody><tr><td>334 BCE<\/td><td>Alexander invades the Persian Empire<\/td><\/tr><tr><td>332 to 331 BCE<\/td><td>He takes Egypt and founds the city of Alexandria<\/td><\/tr><tr><td>330 BCE<\/td><td>The Persian Empire falls<\/td><\/tr><tr><td>326 BCE<\/td><td>He reaches India; his exhausted army refuses to go further<\/td><\/tr><tr><td>323 BCE<\/td><td>He dies in Babylon, aged 32<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: in about ten years, Alexander conquered the largest empire in the world, without losing a major battle.<\/em><\/p>\n<p>He kept much of the Persian system of government. He married Roxana, a noblewoman from Central Asia, and later a daughter of the defeated Persian king. He wanted Greeks and Persians to rule together.<\/p>\n<h2>The Hellenistic world<\/h2>\n<p>Alexander left no adult heir. His generals fought over his empire and split it into kingdoms. The biggest were the Ptolemies in Egypt and the Seleucids in Asia.<\/p>\n<p>The period that followed, from 323 to 31 BCE, is called the <button class=\"term\" data-g=\"hellenistic\">Hellenistic<\/button> age, from Hellas, the Greeks' name for Greece. Greek settlers lived in new cities across the conquered lands. Greek became the common language of government, trade and learning, from Egypt to Afghanistan.<\/p>\n<p>Alexandria in Egypt became the greatest center of learning in the world, with a famous library. Greek ideas mixed with Egyptian, Persian and Indian ones in art, science and religion.<button class=\"fn\" data-g=\"n_greek_language\" aria-label=\"Note 1\">1<\/button><\/p>\n<p><strong>Why it matters.<\/strong> Alexander's conquests spread Greek culture far beyond Greece. When Rome later conquered these lands, it absorbed a Greek-speaking world, and that is how Greek ideas reached the whole Roman Empire and, later, Europe.<\/p>", "example": {"title": "How Greek culture spread across Alexander's conquests.", "steps": [{"text": "Alexander conquered lands from Egypt to India.", "why": "His army destroyed Persian power, opening the whole region to Macedonian rule.", "uses": ["persian-empire"]}, {"text": "He and his successors founded new cities, settled by Greek soldiers and colonists.", "why": "Loyal Greek settlers helped hold conquered land.", "uses": []}, {"text": "Greek became the language of rulers, officials and merchants.", "why": "Anyone who wanted to trade or rise in government needed Greek.", "uses": ["ancient-greece"]}, {"text": "Greek ideas mixed with local cultures, creating something new.", "why": "People do not simply swap cultures. They blend them.", "uses": []}]}, "practice": {"q": "Alexander's empire fell apart as soon as he died. Did his conquests still matter? Explain.", "answer": "Yes. The empire split, but the Greek kingdoms that replaced it lasted for centuries. Greek language, cities and culture spread from Egypt to Central Asia and stayed long after. Rome inherited that Greek-speaking world, which carried Greek ideas into later history."}, "stub": false}, {"id": "roman-republic", "title": "The Roman Republic", "prereqs": ["ancient-greece"], "big": "For nearly 500 years Rome was a republic, governed by elected officials and a senate instead of a king, and in that time it conquered the Mediterranean.", "recap": "In 509 BCE the Romans threw out their king and set up a republic, led by two consuls elected each year and advised by the Senate. The Republic conquered Italy, defeated Carthage and came to rule the Mediterranean. Wealth, inequality and ambitious generals led to civil wars, and in 27 BCE Augustus became Rome's first emperor.", "check": {"q": "Who led the government of the Roman Republic each year?", "options": ["Two consuls, elected for one year", "A king chosen by the gods", "An emperor who ruled for life", "The oldest member of the Senate"], "answer": 0, "why": "The Romans had thrown out their last king and feared one-man rule. So they elected two consuls each year, and each could block the other. Emperors came only after the Republic ended."}, "body": "<h2>No more kings<\/h2>\n<p>By tradition, Rome was founded in 753 BCE and ruled by kings. In 509 BCE the Romans drove out their last king and set up a <button class=\"term\" data-g=\"republic\">republic<\/button>: a state with no king, run by officials chosen by citizens.<\/p>\n<p>The Romans built their system to stop any one person from taking too much power.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Part<\/th><th>Who<\/th><th>What it did<\/th><\/tr><\/thead><tbody><tr><td>Consuls<\/td><td>Two officials, elected each year<\/td><td>Led the government and the army; each could veto the other<\/td><\/tr><tr><td><button class=\"term\" data-g=\"senate\">Senate<\/button><\/td><td>Former officials, mostly from rich families, for life<\/td><td>Advised the consuls and controlled money and foreign affairs<\/td><\/tr><tr><td>Assemblies<\/td><td>Citizens<\/td><td>Elected officials and voted on laws<\/td><\/tr><tr><td>Tribunes<\/td><td>Officials elected by the common people<\/td><td>Could block actions that harmed ordinary citizens<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: power was split and checked. The writers of the United States Constitution studied this system closely.<\/em><\/p>\n<h2>Rich and poor<\/h2>\n<p>Roman society was divided between <button class=\"term\" data-g=\"patrician\">patricians<\/button>, old noble families, and plebeians, the common people. Over two centuries, the plebeians won more rights, including tribunes to protect them and written laws, the Twelve Tables, around 450 BCE.<\/p>\n<p>Rome took much from the Greeks: its gods, styles of building and, later, philosophy and literature. Educated Romans learned Greek.<\/p>\n<h2>Conquest<\/h2>\n<p>Rome first conquered Italy. Then it fought three great wars, the Punic Wars (264 to 146 BCE), against Carthage, a rich trading city in North Africa. In the second, the Carthaginian general Hannibal crossed the Alps with elephants and won great victories in Italy, but Rome would not surrender. In 146 BCE Rome destroyed Carthage. The same year it destroyed Corinth in Greece. Rome now dominated the Mediterranean.<\/p>\n<h2>How the Republic fell<\/h2>\n<p>Conquest brought enormous wealth, but not to everyone. Rich families bought up land and worked it with enslaved captives, while many small farmers lost their land. Generals began to recruit poor men who were loyal to their commander, not to the Republic.<\/p>\n<p>Rival generals fought civil wars. In 49 BCE Julius Caesar led his army into Italy, defeated his rivals, and made himself dictator. In 44 BCE senators who feared he would become king stabbed him to death. More civil war followed, until Caesar's adopted heir, Octavian, defeated Mark Antony and Cleopatra in 31 BCE. In 27 BCE the Senate gave Octavian the name Augustus. He kept the forms of the Republic, but in reality he was Rome's first emperor.<button class=\"fn\" data-g=\"n_caesar_title\" aria-label=\"Note 1\">1<\/button><\/p>\n<p><strong>Why it matters.<\/strong> The Roman Republic is the model for many later republics. Its ideas of elected leaders, a senate, checks on power and written law live on in governments today.<\/p>", "example": {"title": "How the Republic's own success destroyed it.", "steps": [{"text": "Rome conquered a huge empire and grew enormously rich.", "why": "Plunder, taxes and enslaved captives flowed into Rome.", "uses": ["causation"]}, {"text": "The rich bought up land, while many ordinary farmers became poor and landless.", "why": "Large estates worked by enslaved people pushed small farmers out.", "uses": []}, {"text": "Generals recruited the poor into armies loyal to them personally.", "why": "Soldiers depended on their general for pay and land when they retired.", "uses": []}, {"text": "Ambitious generals used their armies to fight for power, until one, Augustus, held it all.", "why": "When armies are loyal to men, not to the state, the strongest man can take control.", "uses": []}]}, "practice": {"q": "Why did the Romans elect two consuls instead of one?", "answer": "After getting rid of their king, the Romans feared one person holding too much power. With two consuls, each able to block the other, and both changing every year, no single leader could become a king."}, "stub": false}, {"id": "roman-empire", "title": "The Roman Empire", "prereqs": ["roman-republic", "empire"], "big": "From 27 BCE Rome was ruled by emperors, and for about two centuries its empire around the Mediterranean enjoyed peace, trade and shared laws.", "recap": "Augustus became Rome's first emperor in 27 BCE. For about 200 years, the Pax Romana, the empire was largely peaceful. It stretched from Britain to the Middle East and was held together by the army, roads, Latin, Roman law and citizenship. In the 300s Emperor Constantine became Christian and founded Constantinople, and the empire later split into east and west.", "check": {"q": "What was the Pax Romana?", "options": ["About 200 years of relative peace and stability across the Roman Empire", "A peace treaty between Rome and Persia", "The Roman code of law", "The official religion of Rome"], "answer": 0, "why": "Pax Romana means \"Roman peace\". It describes roughly 27 BCE to 180 CE, when the empire had few major wars inside its borders, and trade and travel flourished. It was a period, not a treaty, a law code or a religion."}, "body": "<h2>The emperors<\/h2>\n<p>Augustus ruled from 27 BCE to 14 CE. He held all real power but called himself only \"first citizen\". After him came a long line of <button class=\"term\" data-g=\"emperor\">emperors<\/button>. Some were able, and some were cruel or mad.<\/p>\n<h2>The Roman peace<\/h2>\n<p>Augustus' reign began the <button class=\"term\" data-g=\"pax-romana\">Pax Romana<\/button>, about 200 years of relative peace inside the empire. At its largest, around 117 CE, the empire stretched from Britain to Egypt and Mesopotamia, with perhaps 50 to 70 million people.<\/p>\n<h2>What held it together<\/h2>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>What<\/th><th>How it helped<\/th><\/tr><\/thead><tbody><tr><td>The army<\/td><td>Professional soldiers guarded the frontiers<\/td><\/tr><tr><td>Roads<\/td><td>About 80,000 km of paved roads moved troops, trade and news<\/td><\/tr><tr><td><button class=\"term\" data-g=\"latin\">Latin<\/button> and Greek<\/td><td>Latin in the west and Greek in the east were shared languages of government and trade<\/td><\/tr><tr><td>Roman law<\/td><td>The same laws and courts across the empire<\/td><\/tr><tr><td>Citizenship<\/td><td>Gradually extended; in 212 CE nearly all free men in the empire became citizens<\/td><\/tr><tr><td>Cities<\/td><td>Built on a Roman pattern, with baths, temples, forums and theaters<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: many of these tools also made life better for ordinary people, which gave them reasons to stay loyal.<\/em><\/p>\n<p>Roman engineers built <button class=\"term\" data-g=\"aqueduct\">aqueducts<\/button> to carry water into cities, and great buildings using concrete, such as the Colosseum (finished in 80 CE).<\/p>\n<figure class=\"fig pic\" data-src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Colosseum_in_Rome%2C_Italy_-_April_2007.jpg?width=800\" data-page=\"https://commons.wikimedia.org/wiki/File:Colosseum_in_Rome%2C_Italy_-_April_2007.jpg\" data-alt=\"The Colosseum in Rome, a huge oval stone arena with rows of arches\"><div class=\"picframe\"><\/div><figcaption>The Colosseum in Rome, finished in 80 CE. It held perhaps 50,000 people watching gladiator fights. Notice the arches: Roman engineering at a huge scale.<span class=\"credit\">Image: Wikimedia Commons (author and license on the source page) · <a href=\"https://commons.wikimedia.org/wiki/File:Colosseum_in_Rome%2C_Italy_-_April_2007.jpg\" target=\"_blank\" rel=\"noopener\">source<\/a><\/span><\/figcaption><\/figure>\n<h2>Christianity and a new capital<\/h2>\n<p>Christianity began in the Roman province of Judea in the first century CE and spread along Roman roads. At first Christians were sometimes persecuted. Then, from 312 CE, Emperor Constantine favored Christianity, and he was baptized before he died in 337. By the end of the century, Christianity was the empire's official religion.<\/p>\n<p>In 330 CE, Constantine founded a new capital in the east: Constantinople, today Istanbul.<\/p>\n<h2>East and west<\/h2>\n<p>The empire was too big for one ruler. After 395 CE it was permanently divided into an eastern and a western half. The western half fell in 476 CE. The eastern half, centered on Constantinople, lasted almost another thousand years.<\/p>\n<p><strong>Why it matters.<\/strong> Rome's laws, languages, roads, cities and religion shaped Europe and the Mediterranean for over a thousand years. French, Spanish, Italian, Portuguese and Romanian all grew from Latin.<\/p>", "example": {"title": "How Rome kept such a vast empire together for so long.", "steps": [{"text": "The army guarded the frontiers, and roads let it move quickly to trouble spots.", "why": "Force, and the speed to use it, kept invaders out and revolts down.", "uses": ["empire"]}, {"text": "Local elites were allowed to run their own cities, and were given Roman citizenship.", "why": "Leading families had a stake in Rome's success, so they helped rule for it.", "uses": []}, {"text": "Shared laws, money and languages made trade easy across the whole empire.", "why": "Peace and trade made many people richer, so Roman rule had real benefits.", "uses": []}, {"text": "Over time, people across the empire came to see themselves as Roman.", "why": "Shared citizenship, cities and culture turned conquered peoples into Romans.", "uses": []}]}, "practice": {"q": "Several modern European languages are called \"Romance languages\". Why?", "answer": "They grew from Latin, the language of the Romans. As the empire spread across Europe, Latin spread with it. After the empire fell, local forms of Latin slowly turned into Italian, French, Spanish, Portuguese and Romanian."}, "stub": false}, {"id": "hinduism", "title": "Hinduism", "prereqs": ["indus-valley"], "big": "Hinduism is one of the world's oldest living religions, grown over thousands of years in India, with no single founder and a belief in rebirth shaped by one's actions.", "recap": "Hinduism developed in India over thousands of years from the Vedas, ancient sacred hymns, with no single founder. Many Hindus worship many gods as forms of one ultimate reality, Brahman. Key ideas are karma (actions have consequences), reincarnation (the soul is reborn) and dharma (one's duty). It became tied to a social order of castes.", "check": {"q": "In Hindu belief, what is karma?", "options": ["The idea that a person's actions shape their future, including their next life", "The name of the main Hindu god", "A sacred river in India", "A holy book written by Hinduism's founder"], "answer": 0, "why": "Karma means that good and bad actions have consequences, in this life and in the next. It is an idea, not a god, a river or a book. Hinduism has no single founder and many holy books."}, "body": "<h2>A religion without a founder<\/h2>\n<p>Most major religions trace back to one founder. Hinduism does not. It grew slowly in India over more than 3,000 years, mixing many traditions.<\/p>\n<p>Its oldest scriptures are the <button class=\"term\" data-g=\"vedas\">Vedas<\/button>, hymns and rituals composed in the ancient language Sanskrit, beginning around 1500 BCE. They were passed down by memory for centuries before being written down. Later texts include the Upanishads, which explore the nature of reality, and great epic poems such as the Ramayana and the Mahabharata.<button class=\"fn\" data-g=\"n_hindu_word\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>Whether any Hindu beliefs go back to the Indus Valley civilization is uncertain, because its writing cannot be read.<\/p>\n<h2>Many gods, one reality<\/h2>\n<p>Hindus worship many gods and goddesses, such as Vishnu, Shiva and Lakshmi. Many Hindus see them all as forms of one ultimate reality, called Brahman.<\/p>\n<h2>Karma, rebirth and release<\/h2>\n<p>Three ideas are at the heart of Hindu belief:<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Idea<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Reincarnation<\/td><td>When a person dies, their soul is reborn in a new body<\/td><\/tr><tr><td><button class=\"term\" data-g=\"karma\">Karma<\/button><\/td><td>Good and bad actions shape what happens to you, in this life and the next<\/td><\/tr><tr><td><button class=\"term\" data-g=\"dharma\">Dharma<\/button><\/td><td>Each person's duty: the right way to live for someone of their place in life<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the three ideas fit together. Doing your dharma creates good karma, which leads to a better rebirth.<\/em><\/p>\n<p>The final goal is moksha: release from the cycle of rebirth, when the soul unites with Brahman.<\/p>\n<h2>Caste<\/h2>\n<p>Hinduism became tied to a social order of <button class=\"term\" data-g=\"caste\">castes<\/button>: groups that people were born into, which decided their job, whom they could marry and how others treated them. The Vedas describe four broad classes: priests, warriors and rulers, merchants and farmers, and laborers. Below them, some groups were treated as \"untouchable\". Discrimination by caste was outlawed in India's constitution in 1950, though its effects remain.<\/p>\n<p><strong>Why it matters.<\/strong> Hinduism is followed today by over a billion people, most of them in India. Its ideas of karma and rebirth also shaped Buddhism, Jainism and Sikhism, which grew up in India too.<\/p>", "example": {"title": "How karma and caste supported each other in traditional Hindu thought.", "steps": [{"text": "Each person is born into a caste, with its own duties, or dharma.", "why": "Caste decided a person's role in society from birth.", "uses": []}, {"text": "Doing your caste's duty well earns good karma.", "why": "Living rightly, for your place in life, counts as good action.", "uses": []}, {"text": "Good karma leads to rebirth in a higher position in the next life.", "why": "The soul's next life depends on its actions in this one.", "uses": []}, {"text": "So caste could be seen as deserved, the result of past lives, which made it hard to challenge.", "why": "When an inequality is explained as fair reward, people are less likely to question it.", "uses": ["causation"]}]}, "practice": {"q": "How is Hinduism different from Judaism in how it began?", "answer": "Judaism traces itself back to particular founders, Abraham and Moses, and a covenant with one God. Hinduism has no single founder or moment of beginning. It grew gradually over thousands of years from many traditions, and many Hindus worship many gods as forms of one reality."}, "stub": false}, {"id": "buddhism", "title": "Buddhism", "prereqs": ["hinduism"], "big": "Buddhism began in India around 500 BCE with the teachings of Siddhartha Gautama, the Buddha, who taught a path to end suffering and escape the cycle of rebirth.", "recap": "Buddhism was founded in northern India around 500 BCE by Siddhartha Gautama, called the Buddha, \"the awakened one\". He taught that life involves suffering caused by craving, and that following the Eightfold Path leads to nirvana, the end of suffering and of rebirth. Buddhism rejected caste and spread across Asia.", "check": {"q": "According to the Buddha, what causes suffering?", "options": ["Craving and attachment: wanting things to be other than they are", "Bad luck sent by the gods", "Being born into a low caste", "Not making enough sacrifices at the temple"], "answer": 0, "why": "The Buddha taught that suffering comes from craving and clinging to things that do not last. He rejected the idea that caste or rituals decide a person's fate. That is the second of his Four Noble Truths."}, "body": "<h2>The prince who left home<\/h2>\n<p>Siddhartha Gautama was born, according to tradition, a prince in what is now Nepal, probably in the 400s or 500s BCE.<button class=\"fn\" data-g=\"n_buddha_dates\" aria-label=\"Note 1\">1<\/button> Raised in luxury, he was shocked when he finally saw old age, sickness and death. He left his palace to search for the answer to suffering.<\/p>\n<p>After years of trying extreme self-denial, he chose a \"middle way\" between luxury and harsh denial. Meditating under a tree, he reached enlightenment, a full understanding of the truth. From then on he was called the Buddha, \"the awakened one\". He spent the rest of his life teaching.<\/p>\n<h2>The Four Noble Truths<\/h2>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Truth<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>1. Suffering<\/td><td>Life involves suffering and dissatisfaction<\/td><\/tr><tr><td>2. Its cause<\/td><td>Suffering comes from craving and attachment<\/td><\/tr><tr><td>3. Its end<\/td><td>Suffering can end, if craving ends<\/td><\/tr><tr><td>4. The path<\/td><td>The way to end it is the Eightfold Path<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the truths are set out like a doctor's diagnosis: the illness, its cause, the cure, and the treatment.<\/em><\/p>\n<p>The Eightfold Path is a guide to right understanding, right speech, right action and right concentration, among others. Following it leads to <button class=\"term\" data-g=\"nirvana\">nirvana<\/button>: the end of craving, of suffering and of the cycle of rebirth.<\/p>\n<h2>From Hinduism, and against it<\/h2>\n<p>The Buddha kept Hindu ideas of <button class=\"clink\" data-c=\"hinduism\">karma and rebirth<\/button>. But he rejected the authority of the Vedas, the power of priests and the caste system. Anyone, of any caste, man or woman, could follow his path. Communities of monks and nuns, the <button class=\"term\" data-g=\"sangha\">sangha<\/button>, spread his teachings.<\/p>\n<h2>Spreading across Asia<\/h2>\n<p>Buddhism spread widely, helped by the Indian emperor Ashoka in the 200s BCE and by traders on the Silk Roads. It reached Sri Lanka, Southeast Asia, China, Korea, Japan and Tibet.<\/p>\n<p>Strangely, it later faded in India, its birthplace, where Hinduism remained strong.<\/p>\n<p><strong>Why it matters.<\/strong> Buddhism became one of the great world religions, shaping the art, thought and daily life of much of Asia. Today it has around half a billion followers.<\/p>", "example": {"title": "Why did Buddhism appeal to many people in India?", "steps": [{"text": "Hindu society was ordered by caste, with priests at the top.", "why": "Caste decided much of a person's life from birth.", "uses": ["hinduism"]}, {"text": "The Buddha taught that anyone, of any caste, could reach enlightenment.", "why": "He said what mattered was a person's actions and understanding, not their birth.", "uses": []}, {"text": "His path needed no expensive rituals or priests.", "why": "Ordinary people could follow it through how they lived and thought.", "uses": []}, {"text": "So it attracted many people, especially those of lower status, and merchants.", "why": "A message of equality and self-help appealed to those the old order held down.", "uses": ["causation"]}]}, "practice": {"q": "What did Buddhism keep from Hinduism, and what did it reject?", "answer": "It kept the ideas of karma and the cycle of rebirth. It rejected the caste system, the authority of the Vedas and the need for priests and rituals. It taught that anyone could end suffering by following the Eightfold Path."}, "stub": false}, {"id": "mauryan-gupta", "title": "India's Mauryan and Gupta empires", "prereqs": ["buddhism", "empire"], "big": "Two great empires united much of India in ancient times: the Mauryan, whose emperor Ashoka turned to Buddhism and peace, and the Gupta, a golden age of science and art.", "recap": "The Mauryan Empire (about 321 to 185 BCE) united most of India. Its emperor Ashoka, horrified by a bloody war, turned to Buddhism and ruled by moral example. The later Gupta Empire (about 320 to 550 CE) was a golden age of Hindu culture, science and mathematics, including the decimal number system with zero.", "check": {"q": "Why is the emperor Ashoka famous?", "options": ["After a bloody conquest he turned to Buddhism and promoted peace and tolerance.", "He founded Hinduism.", "He conquered China.", "He invented the decimal number system."], "answer": 0, "why": "Horrified by the slaughter in his conquest of Kalinga, Ashoka embraced Buddhism and spread messages of nonviolence and respect for all religions. Hinduism has no founder, India's empires never conquered China, and the decimal system with zero was developed later, around the Gupta period."}, "body": "<h2>The Mauryan Empire<\/h2>\n<p>Around 321 BCE, soon after Alexander the Great had reached India's edge, a ruler named Chandragupta Maurya built an empire across northern India. His grandson, Ashoka, extended it over almost the whole subcontinent.<\/p>\n<h2>Ashoka's change of heart<\/h2>\n<p>Around 260 BCE, Ashoka conquered the kingdom of Kalinga, on India's east coast. The war was terribly bloody: by his own account, over 100,000 people were killed. Ashoka was filled with remorse.<\/p>\n<p>He turned to Buddhism and changed how he ruled. He had his messages carved on pillars and rocks across the empire. They urged nonviolence, kindness to animals, respect for parents and tolerance of all religions. Many of these <button class=\"term\" data-g=\"edicts\">edicts<\/button> survive and can still be read.<\/p>\n<p>He also sent Buddhist missionaries abroad, including to Sri Lanka, which helped Buddhism become a world religion.<\/p>\n<p>The empire broke apart about 50 years after his death.<\/p>\n<h2>The Gupta golden age<\/h2>\n<p>Around 320 CE, the Gupta dynasty reunited much of northern India. The Gupta period is often called a golden age.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Field<\/th><th>Achievement<\/th><\/tr><\/thead><tbody><tr><td>Mathematics<\/td><td>The decimal place-value system with a zero, the basis of the numbers used worldwide today<button class=\"fn\" data-g=\"n_numerals\" aria-label=\"Note 1\">1<\/button><\/td><\/tr><tr><td>Astronomy<\/td><td>The astronomer Aryabhata argued that the earth spins on its axis<\/td><\/tr><tr><td>Literature<\/td><td>The poet Kalidasa; classic Sanskrit writing<\/td><\/tr><tr><td>Religion<\/td><td>Hinduism flourished, and Hindu temples were built in stone<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: numbers we call \"Arabic numerals\" actually began in India; Arab scholars passed them to Europe.<\/em><\/p>\n<p>The Gupta Empire weakened under attacks by the Huns from Central Asia and broke up by about 550 CE.<\/p>\n<p><strong>Why it matters.<\/strong> Ashoka is remembered as a ruler who tried to govern by moral principles, not only force. The Gupta age gave the world the number system it still uses.<\/p>", "example": {"title": "How Ashoka tried to rule an empire through moral example instead of fear.", "steps": [{"text": "After the slaughter at Kalinga, Ashoka gave up wars of conquest.", "why": "He was horrified by the suffering his war had caused.", "uses": []}, {"text": "He adopted Buddhist ideas of nonviolence and compassion.", "why": "Buddhism taught that harming living beings creates suffering and bad karma.", "uses": ["buddhism"]}, {"text": "He carved edicts across his empire telling people how to live well and treat each other.", "why": "Messages in public places let the emperor speak to subjects he would never meet.", "uses": []}, {"text": "He promoted tolerance of all religions, to hold together a varied empire.", "why": "Respecting different beliefs reduced conflict among his many peoples.", "uses": ["empire"]}]}, "practice": {"q": "Why are Ashoka's edicts such valuable sources for historians?", "answer": "They are primary sources in the emperor's own words, carved at the time and still in place across India. They show what he wanted his subjects to believe, how he saw his own rule, and how far his empire reached."}, "stub": false}, {"id": "confucianism", "title": "Confucianism", "prereqs": ["early-china"], "big": "Confucianism is the teaching of Confucius, a Chinese thinker of about 500 BCE, who said society is orderly when people act with virtue and respect the duties of their relationships.", "recap": "Confucius (551 to 479 BCE) taught that a good society comes from good people, not harsh laws. Each person should act with kindness and proper behavior in their relationships, especially showing respect to parents (filial piety). Rulers should lead by moral example. From the Han dynasty on, Confucianism became the official philosophy of the Chinese state.", "check": {"q": "What did Confucius believe was the best way to create an orderly society?", "options": ["People and rulers acting with virtue and respecting the duties of their relationships", "Strict laws with harsh punishments for everyone", "Withdrawing from society to live simply in harmony with nature", "Praying to a single all-powerful God"], "answer": 0, "why": "Confucius taught that virtue and good example create order. Harsh laws and punishments were the idea of a rival school, Legalism. Living simply with nature was the idea of Daoism. Confucius said little about gods."}, "body": "<h2>A teacher in troubled times<\/h2>\n<p>Confucius lived from 551 to 479 BCE, in the late Zhou dynasty, when China was splitting into warring states. He worked as an official and a teacher, and asked: how can order and harmony be restored?<\/p>\n<p>He wrote little himself. His students collected his sayings in a book called the Analects.<\/p>\n<h2>Five relationships<\/h2>\n<p>Confucius believed society rests on relationships, and that each has duties on both sides.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Relationship<\/th><th>The senior owes<\/th><th>The junior owes<\/th><\/tr><\/thead><tbody><tr><td>Ruler and subject<\/td><td>Kindness, good government<\/td><td>Loyalty<\/td><\/tr><tr><td>Father and son<\/td><td>Care, guidance<\/td><td>Respect, obedience<\/td><\/tr><tr><td>Husband and wife<\/td><td>Protection<\/td><td>Obedience<\/td><\/tr><tr><td>Older and younger brother<\/td><td>Gentleness<\/td><td>Respect<\/td><\/tr><tr><td>Friend and friend<\/td><td>Trust<\/td><td>Trust<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: only one of the five is between equals. Confucian order is a world of ranks, but the higher rank has duties too.<\/em><\/p>\n<p>Above all he stressed <button class=\"term\" data-g=\"filial-piety\">filial piety<\/button>: respect for one's parents and ancestors. He also taught ren, kindness or humaneness, and li, proper behavior and ritual.<\/p>\n<h2>Rule by example<\/h2>\n<p>Confucius said a ruler should govern like the wind over grass: if the ruler is good, the people will follow, as grass bends in the wind. Good officials should be chosen for their learning and character, not their birth.<\/p>\n<h2>Rival schools<\/h2>\n<p>Confucianism was one of several schools of thought in this troubled time.<\/p>\n<ul><li><strong><button class=\"term\" data-g=\"daoism\">Daoism<\/button><\/strong>, linked to the sage Laozi, taught people to live simply and in harmony with nature and the Dao, \"the Way\".<\/li><li><strong><button class=\"term\" data-g=\"legalism\">Legalism<\/button><\/strong> taught that people are selfish and must be controlled by strict laws and harsh punishments.<\/li><\/ul>\n<p>The Qin dynasty used Legalism to unify China. The Han dynasty that followed made Confucianism the official philosophy of the state.<\/p>\n<p><strong>Why it matters.<\/strong> Confucian ideas about family, education, duty and good government shaped China for over 2,000 years, and spread to Korea, Japan and Vietnam. China's officials were chosen for centuries by exams on Confucian classics.<\/p>", "example": {"title": "How Confucius expected good order to spread from the ruler to the whole society.", "steps": [{"text": "The ruler acts with virtue and fairness.", "why": "In Confucian thought, the ruler's example is the foundation of all order.", "uses": []}, {"text": "Officials, chosen for learning and good character, copy the ruler's example.", "why": "Officials are the link between the ruler and the people.", "uses": []}, {"text": "Families practice filial piety, and each member fulfills their role.", "why": "The family is a small version of the state. Order at home builds order in society.", "uses": []}, {"text": "With everyone doing their duty, society is harmonious and harsh punishments are rarely needed.", "why": "Confucius believed people follow good examples more willingly than threats.", "uses": ["early-china"]}]}, "practice": {"q": "How does the Confucian idea of good rule connect to the Mandate of Heaven?", "answer": "Both say a ruler's right to rule depends on ruling well. Confucius taught that rulers must govern with virtue and set a good example. The Mandate of Heaven said Heaven withdraws its support from rulers who fail. Together they made good government a duty, not just a choice."}, "stub": false}, {"id": "qin-han-china", "title": "Qin and Han China", "prereqs": ["confucianism", "empire"], "big": "In 221 BCE the Qin dynasty united China by force into one empire, and the Han dynasty that followed made it last for 400 years, shaping China ever since.", "recap": "The Qin dynasty united China in 221 BCE. Its ruler, the First Emperor, standardized writing, money and measures, and ruled harshly with Legalism; the dynasty collapsed in 206 BCE. The Han dynasty (206 BCE to 220 CE) kept the unified empire but ruled through Confucian officials, opened the Silk Roads and saw the invention of paper.", "check": {"q": "Which of these did the Qin First Emperor do to unify China?", "options": ["Made everyone use the same writing, coins and measures", "Made Confucianism the official philosophy of the state", "Built the Great Wall exactly as it stands today", "Opened trade along the Silk Roads"], "answer": 0, "why": "The First Emperor standardized writing, money, weights and even cart axles across China. Making Confucianism official and opening the Silk Roads were Han achievements. He joined earlier walls into a long northern wall, but most of the Great Wall seen today was built much later, under the Ming."}, "body": "<h2>The First Emperor<\/h2>\n<p>For two centuries, the Warring States fought for control of China. In 221 BCE the state of Qin conquered the last of its rivals. Its king took a new title: Qin Shi Huang, \"First Emperor of Qin\". The name China probably comes from Qin.<\/p>\n<p>He ruled with <button class=\"term\" data-g=\"legalism\">Legalism<\/button>: strict laws, harsh punishments and total obedience to the state. To make China one country, he made many things the same everywhere.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>What he standardized<\/th><th>Why it mattered<\/th><\/tr><\/thead><tbody><tr><td>Writing<\/td><td>People with different spoken dialects could read the same documents<\/td><\/tr><tr><td>Coins<\/td><td>One currency made trade easier<\/td><\/tr><tr><td>Weights and measures<\/td><td>Fair taxes and trade across the empire<\/td><\/tr><tr><td>Cart axle widths<\/td><td>Carts could use the same road ruts everywhere<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: a shared written script held China together for the next 2,000 years, even when its spoken languages differed.<\/em><\/p>\n<p>He built roads and canals, and joined earlier walls into a long defensive wall in the north. He burned books of rival schools of thought.<button class=\"fn\" data-g=\"n_burning\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>He was buried with an army of life-size clay soldiers, the Terracotta Army, rediscovered by farmers digging a well in 1974.<\/p>\n<figure class=\"fig pic\" data-src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Qin_Shihuang_Terracotta_Army%2C_Pit_1.jpg?width=800\" data-page=\"https://commons.wikimedia.org/wiki/File:Qin_Shihuang_Terracotta_Army%2C_Pit_1.jpg\" data-alt=\"Rows of life-size clay soldiers standing in a long excavated pit\"><div class=\"picframe\"><\/div><figcaption>Part of the Terracotta Army in Pit 1. Notice the rows: the soldiers stand in battle order, and no two faces are quite the same.<span class=\"credit\">Image: Wikimedia Commons (author and license on the source page) · <a href=\"https://commons.wikimedia.org/wiki/File:Qin_Shihuang_Terracotta_Army%2C_Pit_1.jpg\" target=\"_blank\" rel=\"noopener\">source<\/a><\/span><\/figcaption><\/figure>\n<p>The Qin did not last. Forced labor and harsh laws made people furious. Soon after the First Emperor died in 210 BCE, revolts broke out, and the dynasty fell in 206 BCE.<\/p>\n<h2>The Han dynasty<\/h2>\n<p>The Han dynasty, founded by Liu Bang, a man of humble birth, ruled from 206 BCE to 220 CE. It kept the Qin's united empire and many of its systems, but softened its harshness.<\/p>\n<ul><li><strong>Confucian government.<\/strong> The Han made Confucianism the official philosophy. Officials were increasingly chosen for their learning in the Confucian classics.<\/li><li><strong>Expansion and trade.<\/strong> Han armies pushed west into Central Asia, and Han envoys opened the routes later called the Silk Roads.<\/li><li><strong>Inventions.<\/strong> Paper was invented in the Han era. So were better plows and the earliest seismograph to detect earthquakes.<\/li><\/ul>\n<p>A census in 2 CE counted about 57 million people, roughly as many as the Roman Empire at the same time. To this day, China's largest ethnic group calls itself the Han.<\/p>\n<p><strong>Why it matters.<\/strong> The Qin created a single Chinese empire; the Han made it last. The pattern they set, one emperor ruling through educated officials over a unified China, lasted until 1912.<\/p>", "example": {"title": "Why did the Han last 400 years when the Qin lasted only 15?", "steps": [{"text": "The Qin ruled by fear, with harsh laws and crushing forced labor.", "why": "Legalism relied on punishment, not loyalty.", "uses": []}, {"text": "When the First Emperor died, anger exploded into revolt, and the Qin fell.", "why": "A state held together only by fear collapses when its fear weakens.", "uses": ["causation"]}, {"text": "The Han kept the Qin's useful systems but lowered taxes and softened punishments.", "why": "The Han founders had seen why the Qin fell.", "uses": []}, {"text": "The Han ruled through Confucian officials and ideals, which gave people reasons to accept their rule.", "why": "Rule that is seen as fair and moral wins more lasting support than rule by force.", "uses": ["confucianism"]}]}, "practice": {"q": "How did standardizing writing help hold China together?", "answer": "People in different regions spoke very different dialects. But with one written script, officials, merchants and scholars everywhere could read the same laws, letters and books. That let one government rule all of China, and gave Chinese people a shared culture."}, "stub": false}, {"id": "christianity", "title": "Christianity", "prereqs": ["judaism", "roman-empire"], "big": "Christianity began as a movement within Judaism, following Jesus of Nazareth, and spread across the Roman Empire until it became Rome's official religion.", "recap": "Christianity grew from the teachings of Jesus, a Jewish teacher in Roman-ruled Judea who was crucified around 30 CE. His followers believed he rose from the dead and was the Messiah, or Christ. Spread by missionaries such as Paul along Roman roads, it was at first persecuted, then legalized by Constantine in 313 and made Rome's official religion in 380.", "check": {"q": "How did Christianity go from a persecuted faith to the official religion of Rome?", "options": ["Emperor Constantine legalized and favored it, and a later emperor made it official in 380.", "Jesus became the Roman emperor.", "Rome conquered a Christian kingdom.", "It was the official religion from the start."], "answer": 0, "why": "Christians were persecuted at times for nearly three centuries. Constantine legalized Christianity in 313 and favored it, and Emperor Theodosius made it the official religion in 380. Jesus was executed by Roman authorities, and no Christian kingdom existed for Rome to conquer."}, "body": "<h2>Jesus of Nazareth<\/h2>\n<p>Jesus was a Jewish teacher from Galilee, in the Roman province of Judea. He was born around 4 BCE and began preaching around 28 CE.<button class=\"fn\" data-g=\"n_jesus_evidence\" aria-label=\"Note 1\">1<\/button> He taught love of God and of one's neighbor, forgiveness, and care for the poor and outcast. He spoke of the coming kingdom of God.<\/p>\n<p>Around 30 CE, the Roman governor, Pontius Pilate, had him executed by <button class=\"term\" data-g=\"crucifixion\">crucifixion<\/button>, a Roman punishment for rebels and slaves.<\/p>\n<p>His followers believed that he rose from the dead, and that he was the <button class=\"term\" data-g=\"messiah\">Messiah<\/button> promised in the Jewish scriptures. \"Christ\" is the Greek word for Messiah, so his followers came to be called Christians.<\/p>\n<h2>From Jewish sect to world religion<\/h2>\n<p>At first, Jesus' followers were Jews. The apostle Paul, a Jew who became a follower, preached to non-Jews across the eastern Mediterranean and taught that they could join without following Jewish law. His letters became part of the New Testament.<\/p>\n<p>The Roman Empire helped Christianity spread:<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Roman feature<\/th><th>How it helped<\/th><\/tr><\/thead><tbody><tr><td>Roads and sea routes<\/td><td>Missionaries could travel safely and quickly<\/td><\/tr><tr><td>Greek as a shared language<\/td><td>The message and the New Testament could reach many peoples<\/td><\/tr><tr><td>Big cities<\/td><td>Ideas spread fast among crowds<\/td><\/tr><tr><td>Peace across the empire<\/td><td>Travel and letters moved freely<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: Christianity spread along the same networks that held the empire together.<\/em><\/p>\n<h2>Persecution, then power<\/h2>\n<p>Christians refused to worship the Roman gods or the emperor, which many Romans saw as disloyal. Some emperors persecuted them, from Nero in 64 CE to Diocletian around 303 CE. Christians killed for their faith were honored as martyrs.<\/p>\n<p>Then everything changed. In 313 CE, Emperor Constantine legalized Christianity. In 325 he called the Council of Nicaea, where bishops agreed on core beliefs. In 380, Emperor Theodosius made Christianity the empire's official religion.<\/p>\n<p>The Church organized itself like the empire, with bishops in major cities. The bishop of Rome, later called the pope, became the leader of Christians in the west.<\/p>\n<p><strong>Why it matters.<\/strong> Christianity became the religion of the Roman world and, through it, of Europe and later the Americas. It is the largest religion in the world today, with over two billion followers.<\/p>", "example": {"title": "Why did Roman authorities persecute early Christians?", "steps": [{"text": "Romans believed honoring the gods, and the emperor, kept the empire safe.", "why": "Religion and loyalty to the state were bound together in Rome.", "uses": ["roman-empire"]}, {"text": "Christians refused to worship the Roman gods or the emperor.", "why": "Like the Jews before them, they believed in only one God.", "uses": ["judaism"]}, {"text": "Many Romans saw this refusal as disloyal, and a danger to the empire.", "why": "If the gods were angered, disasters might follow.", "uses": []}, {"text": "So in times of trouble, Christians were blamed and sometimes executed.", "why": "A group that seems different is an easy target when things go wrong.", "uses": ["causation"]}]}, "practice": {"q": "Name two features of the Roman Empire that helped Christianity spread.", "answer": "Any two of these: its roads and sea routes, its shared Greek language in the east, its large cities, and the peace that allowed safe travel. Missionaries like Paul used all of them to carry their message."}, "stub": false}, {"id": "silk-roads", "title": "The Silk Roads", "prereqs": ["qin-han-china", "roman-empire"], "big": "The Silk Roads were a web of trade routes across Asia that, from about 100 BCE, carried goods, religions, inventions and diseases between China and the Mediterranean.", "recap": "From about the 100s BCE, the Silk Roads linked China to the Mediterranean through Central Asia. Goods such as silk, spices, horses, glass and silver passed from trader to trader in stages. Ideas traveled too: Buddhism spread from India to China along them, and later paper and other inventions moved west.", "check": {"q": "Did most traders travel the whole Silk Roads, from China all the way to Rome?", "options": ["No. Goods were passed from trader to trader, in stages, along the way.", "Yes. Caravans went from China to Rome and back every year.", "Yes, but only Roman traders made the trip.", "No. Goods only went by sea, never over land."], "answer": 0, "why": "Very few people traveled the whole way. Merchants carried goods over one section and sold them to the next, so goods traveled much further than people. Both land and sea routes were used."}, "body": "<h2>A web, not a road<\/h2>\n<p>The Silk Roads were not one road. They were a web of routes across deserts, mountains and grasslands, linking China, Central Asia, India, Persia and the Mediterranean. The name was invented much later, in 1877, by a German geographer.<button class=\"fn\" data-g=\"n_silk_name\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>They opened in the Han dynasty. Around 138 BCE, the emperor sent an envoy, Zhang Qian, west to find allies. He brought back news of rich kingdoms and fine horses, and trade grew.<\/p>\n<h2>Passed hand to hand<\/h2>\n<p>Almost no one traveled the whole route. Goods moved in stages through a chain of <button class=\"term\" data-g=\"caravan\">caravans<\/button> and middlemen, especially Persian and Central Asian traders. Oasis cities such as Samarkand and Kashgar grew rich from the trade.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Going west<\/th><th>Going east<\/th><\/tr><\/thead><tbody><tr><td>Silk, paper, porcelain (later), tea (later)<\/td><td>Horses, glass, gold and silver<\/td><\/tr><tr><td>Spices from India and Southeast Asia<\/td><td>Wool, wine, grapes<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: each side wanted what it could not easily make. Rome had no idea how silk was made; China prized the strong horses of Central Asia.<\/em><\/p>\n<p>Rich Romans loved Chinese silk. Yet Rome and China knew of each other only by rumor. A Chinese envoy reached the Persian Gulf around 97 CE but turned back.<\/p>\n<h2>More than goods<\/h2>\n<p>The most important things carried were often not goods.<\/p>\n<ul><li><strong>Religions.<\/strong> Buddhism spread from India to China in the first centuries CE. Later, Christianity and Islam traveled the routes too.<\/li><li><strong>Inventions.<\/strong> Papermaking spread west, reaching the Islamic world in the 700s and, much later, Europe.<\/li><li><strong>Disease.<\/strong> Germs traveled with traders. Plagues could spread along the routes.<\/li><\/ul>\n<p><strong>Why it matters.<\/strong> The Silk Roads were an early form of <button class=\"term\" data-g=\"globalization\">globalization<\/button>: distant peoples, who never met, became connected by trade. Religions, technologies and art traveled thousands of kilometers, shaping civilizations across Asia and Europe.<\/p>", "example": {"title": "How a bolt of Chinese silk could end up in Rome.", "steps": [{"text": "Chinese merchants sold the silk to traders at China's western frontier.", "why": "Each merchant knew only their own section of the route.", "uses": ["qin-han-china"]}, {"text": "Central Asian traders carried it by camel caravan across deserts to cities such as Samarkand.", "why": "Camels could cross dry land that other animals could not.", "uses": []}, {"text": "Persian merchants bought it and carried it west toward the Mediterranean.", "why": "Persia sat between east and west and profited as the middleman.", "uses": []}, {"text": "Traders in Syria or Egypt sold it to Romans, at many times its original price.", "why": "Each middleman added profit and transport costs, so silk was a luxury by the time it reached Rome.", "uses": ["roman-empire"]}]}, "practice": {"q": "Give one example of something other than trade goods that traveled along the Silk Roads.", "answer": "Any one of these: religions such as Buddhism, which spread from India to China; inventions such as papermaking, which spread west; and diseases, which traveled with traders."}, "stub": false}, {"id": "fall-of-rome", "title": "The fall of the western Roman Empire", "prereqs": ["roman-empire", "causation"], "big": "The western half of the Roman Empire fell in 476 CE, not in one blow, but after long-term problems weakened it until invaders could take it apart.", "recap": "The western Roman Empire fell in 476 CE, when a Germanic general removed the last emperor. Long-term causes, such as unstable government, money troubles and an overstretched army, weakened it, while Germanic peoples, pushed by the Huns, moved in. The eastern half survived for nearly a thousand more years as the Byzantine Empire.", "check": {"q": "Which is the best description of why the western Roman Empire fell?", "options": ["Many problems built up together: weak government, money troubles, a stretched army and invasions.", "It was destroyed in a single great battle.", "A plague killed almost everyone in the west.", "The eastern Roman Empire conquered it."], "answer": 0, "why": "Historians see the fall as the result of many causes over a long time. There was no single decisive battle or plague, and the eastern half did not conquer the west; it survived on its own as the Byzantine Empire."}, "body": "<h2>A slow collapse<\/h2>\n<p>The western Roman Empire did not fall in a day. Its decline lasted about two centuries. The date usually given for the end, 476 CE, is when a Germanic general named Odoacer removed the last western emperor, a teenager called Romulus Augustulus. Odoacer did not bother to name a new emperor.<\/p>\n<h2>Long-term causes<\/h2>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Problem<\/th><th>What happened<\/th><\/tr><\/thead><tbody><tr><td>Unstable government<\/td><td>In the 200s CE, emperors were made and murdered by their own armies; about 25 ruled in 50 years<\/td><\/tr><tr><td>Money troubles<\/td><td>Emperors put less silver in coins to pay soldiers, so prices soared; taxes became crushing<\/td><\/tr><tr><td>An overstretched army<\/td><td>The frontiers were long, and Rome relied more and more on Germanic soldiers<\/td><\/tr><tr><td>A divided empire<\/td><td>After 395 the richer, stronger east went its own way, leaving the west weaker<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: each problem made the others worse. Unstable rulers spent money on armies; armies made and unmade rulers.<\/em><\/p>\n<h2>The trigger: peoples on the move<\/h2>\n<p>In the late 300s the Huns, horse-riding warriors from Central Asia, swept west and drove Germanic peoples, such as the Goths, into Roman lands.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Year<\/th><th>Event<\/th><\/tr><\/thead><tbody><tr><td>376<\/td><td>The Goths cross the Danube into the empire, fleeing the Huns<\/td><\/tr><tr><td>378<\/td><td>The Goths destroy a Roman army at Adrianople and kill the emperor<\/td><\/tr><tr><td>410<\/td><td>The Visigoths sack the city of Rome<\/td><\/tr><tr><td>455<\/td><td>The Vandals sack Rome again<\/td><\/tr><tr><td>476<\/td><td>Odoacer removes the last western emperor<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: Rome had beaten invaders for centuries. This time it was too weak to recover.<\/em><\/p>\n<h2>The east survives<\/h2>\n<p>The eastern half of the empire, ruled from Constantinople, was richer, more populous and easier to defend. It survived for almost another thousand years, until 1453. Historians call it the Byzantine Empire.<\/p>\n<h2>How historians see it<\/h2>\n<p>Historians still debate the fall.<button class=\"fn\" data-g=\"n_gibbon\" aria-label=\"Note 1\">1<\/button> Some stress decline and catastrophe: cities shrank, trade collapsed, and life became poorer and more dangerous in the west. Others stress transformation: Germanic kingdoms kept many Roman laws, the Latin language and the Christian Church. Both are partly true.<\/p>", "example": {"title": "Sort the causes of the fall of the western Roman Empire.", "steps": [{"text": "Over two centuries, unstable government, money troubles and an overstretched army weakened the west.", "why": "These are long-term causes. They did not end the empire, but they made it fragile.", "uses": ["causation"]}, {"text": "The division of the empire left the poorer west to defend itself.", "why": "Another long-term cause: the east's wealth no longer helped the west.", "uses": ["roman-empire"]}, {"text": "The Huns drove Germanic peoples into Roman lands from 376 onward.", "why": "This is the trigger: a sudden pressure on an empire that was already weak.", "uses": []}, {"text": "Germanic armies took over the western provinces, and in 476 Odoacer removed the last emperor.", "why": "This is the result. A strong empire might have survived the invasions; a weak one did not.", "uses": []}]}, "practice": {"q": "Why did the eastern half of the Roman Empire survive when the western half fell?", "answer": "The east was richer, with more cities, trade and tax income. Its capital, Constantinople, was very hard to capture, protected by water and massive walls. It could pay invaders to go elsewhere, and some of them moved west instead."}, "stub": false}, {"id": "byzantine-empire", "title": "The Byzantine Empire", "prereqs": ["fall-of-rome", "christianity"], "big": "The eastern half of the Roman Empire survived the fall of the west and lasted another thousand years, until 1453, as a Greek-speaking Christian empire ruled from Constantinople.", "recap": "The Byzantine Empire was the eastern Roman Empire, which survived after the west fell in 476. Ruled from Constantinople, it spoke Greek and followed Orthodox Christianity. Under Justinian in the 500s it collected Roman law and built the Hagia Sophia. It slowly lost land to Arabs, Turks and western crusaders, and fell to the Ottoman Turks in 1453. It passed Greek learning, Roman law and Orthodox Christianity on to Russia, the Balkans and western Europe.", "check": {"q": "What was the Byzantine Empire?", "options": ["The eastern half of the Roman Empire, which survived until 1453.", "A Germanic kingdom that replaced Rome in the west.", "An Arab empire based in Baghdad.", "The first empire of ancient Greece."], "answer": 0, "why": "The Byzantine Empire was the continuation of the Roman Empire in the east, ruled from Constantinople. The Germanic kingdoms took over the west, Baghdad was the capital of the Abbasid caliphs, and ancient Greece came many centuries earlier."}, "body": "<h2>Rome lives on in the east<\/h2>\n<p>When the western Roman Empire fell in 476, the eastern half carried on. Its people still called themselves Romans. Historians call it the Byzantine Empire, after Byzantium, the old Greek town on the site of its capital.<button class=\"fn\" data-g=\"n_byzantine_name\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>The emperor Constantine had rebuilt Byzantium as a new
