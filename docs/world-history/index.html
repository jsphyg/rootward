<style>
/* Learning Web engine. Layout: content column on the left leads; a narrow instrument-panel map sits on the right.
   Sharp edges, thin rules, mono labels. One dark theme only: dark brown ground, light yellow text (Joe, 2026-11-23). */
:root{
  --bg:#241811; --surface:#2e2017; --raise:#38281c; --ink:#f4e7b8; --muted:#c9b68c; --line:#33241a; --line2:#5a4231;
  --accent:#86c9bd; --accent-soft:rgba(134,201,189,.10); --good:#b7d98c; --good-soft:rgba(183,217,140,.12);
  --warn:#eda25e; --warn-soft:rgba(237,162,94,.12); --bad:#e8826f;
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --math:"Literata",Georgia,serif;
  --gutter-l:max(24px, env(safe-area-inset-left, 0px)); --gutter-r:max(24px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
@media (max-width:880px){:root{--gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px))}}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-attachment:fixed;background-position:-1px -1px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 30% 0%,transparent 0%,var(--bg) 70%);pointer-events:none;z-index:-1}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header.top{background:rgba(36,24,17,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);flex-wrap:wrap}
header.top h1{font-family:var(--display);font-weight:600;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;margin:0;flex:1 1 auto}
header.top h1 small{display:block;font-family:var(--mono);font-weight:400;font-size:.7rem;letter-spacing:.08em;color:var(--muted)}
header.top h1 small::before{content:"● ";color:var(--good)}
.backbtn{border:1px solid var(--accent);background:transparent;color:var(--accent);font-family:var(--mono);font-size:.78rem;
  letter-spacing:.08em;text-transform:uppercase;padding:9px 14px}
.backbtn:hover:not([disabled]){background:var(--accent);color:var(--bg)}
.backbtn[disabled]{opacity:.35;cursor:default;border-color:var(--line2);color:var(--muted)}

.return{background:var(--warn-soft);backdrop-filter:blur(8px);color:var(--warn);border-bottom:1px solid var(--warn);
  padding-block:8px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.return[hidden]{display:none}
.return .trail{flex:1 1 220px;font-family:var(--mono);font-size:.74rem;opacity:.85}
.return button{border:1px solid var(--warn);background:var(--warn);color:var(--bg);font-family:var(--mono);font-size:.76rem;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px}

.shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;max-width:1240px;margin:0 auto;padding-block:28px 96px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
@media (max-width:880px){.shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:20px 80px}}
main{min-width:0}

nav.map{align-self:start;position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;
  background:var(--surface);border:1px solid var(--line2);border-top:2px solid var(--accent);padding:16px}
@media (max-width:880px){nav.map{position:static;max-height:none}}
nav.map h2{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
nav.map h2::before{content:"// "}
.prog{height:6px;background:var(--line);margin:6px 0 6px;position:relative}
.prog i{display:block;height:100%;background:var(--good);box-shadow:0 0 10px var(--good);width:0;transition:width .3s}
.progtxt{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:8px;letter-spacing:.03em}
.lvl{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:14px 0 4px;padding-top:8px;border-top:1px solid var(--line)}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-left:2px solid transparent;
  background:transparent;padding:6px 8px;font-size:.93rem}
.mi:hover{background:var(--accent-soft);border-left-color:var(--line2)}
.mi.on{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.mi .soon{margin-left:auto;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);padding:0 4px}
.dot{flex:none;width:9px;height:9px;border:1.5px solid var(--muted);display:inline-block;transform:rotate(45deg);margin:0 2px}
.dot.v{border-color:var(--accent);background:linear-gradient(135deg,var(--accent) 50%,transparent 50%)}
.dot.m{border-color:var(--good);background:var(--good);box-shadow:0 0 8px var(--good)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;gap:6px;align-items:center}

.intro{background:var(--accent-soft);border:1px solid var(--accent);border-left-width:3px;padding:12px 44px 12px 16px;margin-bottom:20px;font-size:.93rem;position:relative}
.intro p{margin:.2em 0}
.intro button.x{position:absolute;top:6px;right:8px;border:1px solid var(--line2);background:transparent;width:28px;height:28px;color:var(--muted);line-height:1}

article{position:relative;background:var(--surface);border:1px solid var(--line2);padding:32px clamp(18px,4vw,48px) 40px}
article::before,article::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--accent);pointer-events:none}
article::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
article::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"// "}
h1.title{font-family:var(--display);font-weight:600;font-size:clamp(2rem,4.4vw,3rem);line-height:1.08;letter-spacing:.01em;margin:.2em 0 .3em;text-wrap:balance}
.big{font-size:1.2rem;color:var(--muted);margin:0 0 1.4em;max-width:60ch;padding-left:14px;border-left:2px solid var(--line2)}
article h2{font-family:var(--display);font-weight:600;font-size:1.35rem;letter-spacing:.02em;margin:2em 0 .5em;text-wrap:balance;display:flex;align-items:center;gap:10px}
article h2::after{content:"";flex:1;height:1px;background:var(--line2)}
article h3{font-size:1.05rem;margin:1.2em 0 .4em}
article p,article li{max-width:68ch}
p.cap{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.02em;margin-top:-.4em}
p.cap em{font-style:normal}
.eq{background:var(--raise);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:14px 18px;margin:1.1em 0;font-size:1.1rem;overflow-x:auto;overflow-y:hidden}
.eq .katex-display{margin:0;text-align:left}
.eq .katex-display>.katex{text-align:left}
.katex{font-size:1.08em;text-transform:none;letter-spacing:0}
.tex-raw{font-family:var(--mono);font-size:.9em;color:var(--warn)}

button.term{border:0;background:transparent;padding:0;border-bottom:1px solid var(--accent);color:var(--ink);font-weight:500}
button.term:hover{background:var(--accent-soft);color:var(--accent)}
button.fn{border:1px solid var(--accent);background:transparent;color:var(--accent);font-family:var(--mono);font-size:.62rem;font-weight:700;
  min-width:1.45em;height:1.45em;vertical-align:super;line-height:1;margin-left:3px;padding:0 .25em}
button.fn:hover{background:var(--accent);color:var(--bg)}
button.clink{border:0;background:transparent;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
button.clink::after{content:" ↗";font-size:.8em}
.missing,button.missing{color:var(--warn)!important;border-color:var(--warn)!important;cursor:not-allowed;text-decoration-style:dashed}
button.clink.missing::after{content:" (not written yet)";font-family:var(--mono);font-size:.7em}

#pop{position:fixed;z-index:50;max-width:min(340px,calc(100vw - 24px));background:var(--raise);color:var(--ink);border:1px solid var(--accent);
  box-shadow:0 0 0 1px rgba(134,201,189,.15),0 16px 40px rgba(0,0,0,.55);padding:12px 14px;font-size:.92rem}
#pop[hidden]{display:none}
#pop b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#pop .lnk{margin-top:10px}

.lnk{border:1px solid var(--line2);background:transparent;color:var(--accent);padding:5px 10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.lnk:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip{border:1px solid var(--line2);background:var(--raise);color:var(--accent);padding:2px 8px;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;margin-right:6px}
.chip:hover{border-color:var(--accent)}

.prereq,.stub{background:var(--raise);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:4px 20px 16px;margin:1.6em 0}
.stub{border-left-color:var(--warn)}
.prereq h2,.stub h2{margin:.9em 0 .6em;font-size:1rem;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.stub h2{color:var(--warn)}
.prereq h2::after,.stub h2::after{display:none}
.prereq ul{list-style:none;padding:0;margin:0;display:grid;gap:0}
.prereq li{padding:10px 0;border-top:1px solid var(--line)}
.pr-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pr-head strong{flex:1 1 auto;font-weight:600}
.recap{margin:8px 0 0 22px;padding:8px 12px;background:var(--surface);border-left:2px solid var(--accent);font-size:.93rem}
.stub .recap{margin-left:0}
.recap[hidden]{display:none}

.checks{margin:1.6em 0}
.q{border:1px solid var(--line2);padding:14px 18px;margin:10px 0;background:var(--raise)}
.q .tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q .qt{margin:.3em 0 .7em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.opt{border:1px solid var(--line2);background:var(--surface);padding:8px 12px;text-align:left;position:relative}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.no{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.fb{margin-top:10px;font-size:.93rem}
.fb.ok{color:var(--good)} .fb.no{color:var(--warn)}
.fb .lnk{margin-left:8px;color:var(--warn);border-color:var(--warn)}

/* Figures. Shared look for every subject's widgets. */
.fig{margin:1.3em 0;background:var(--raise);border:1px solid var(--line2);padding:12px;max-width:540px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.fig .cap,.wcard .cap{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin:8px 4px 2px;letter-spacing:.02em}
.fig.pic{max-width:640px}
.picframe img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:var(--surface)}
.piclink{display:flex;gap:14px;align-items:center;padding:14px;border:1px dashed var(--line2);color:var(--accent);text-decoration:none}
.piclink:hover{border-color:var(--accent);background:var(--accent-soft)}
.piclink .ico{flex:none;width:44px;height:36px;border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--mono);font-size:.7rem}
.piclink small{display:block;color:var(--muted);font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase}
.fig .credit{display:block;margin-top:4px;opacity:.8}
.fig .credit a{color:var(--accent)}
.fig.missing{border-color:var(--warn);font-family:var(--mono);font-size:.8rem}
svg .ax{stroke:var(--muted);stroke-width:1.2}
svg .cv{stroke:var(--accent);stroke-width:2.6;fill:none;filter:drop-shadow(0 0 4px rgba(134,201,189,.45))}
svg .ln{stroke:var(--ink);stroke-width:2;fill:none}
svg .sec{stroke:var(--warn);stroke-width:2.2;fill:none}
svg .tan{stroke:var(--good);stroke-width:1.8;fill:none;stroke-dasharray:6 5}
svg .pt{fill:var(--ink)}
svg .ptw{fill:var(--warn)}
svg text{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .mt{fill:var(--muted)}
svg .box{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.wcard{background:var(--raise);border:1px solid var(--line2);border-top:2px solid var(--accent);padding:16px;margin:1.3em 0;max-width:580px}
.wcard h3{margin:0 0 .6em;font-family:var(--mono);font-weight:500;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.wcard label{font-family:var(--mono);font-size:.82rem}
.wcard input[type=range]{width:100%;accent-color:var(--accent)}
.read{margin:.6em 0 0;font-size:.98rem}

.tablewrap{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;margin:1.1em 0;font-family:var(--mono);font-size:.88rem}
table.t th,table.t td{border:1px solid var(--line2);padding:6px 12px;text-align:center}
table.t th{background:var(--raise);color:var(--muted);font-weight:500}
table.t td:first-child{text-align:left}
table.t .katex{font-size:1.15em}

.ex{border:1px solid var(--line2);padding:4px 20px 18px;margin:1.6em 0;background:var(--surface)}
.ex .exq{font-weight:500}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:.6em 0 0}
ol.steps li{counter-increment:s;position:relative;margin:0;padding:12px 0 12px 48px;border-top:1px solid var(--line)}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:12px;font-family:var(--mono);font-size:.78rem;
  color:var(--accent);border:1px solid var(--accent);padding:2px 6px}
.st{font-weight:500}
.why{color:var(--muted);font-size:.93rem}
.uses{margin-top:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

details.practice{border:1px dashed var(--line2);padding:12px 18px;margin:1.3em 0;background:var(--raise)}
details.practice summary,details.ans summary{cursor:pointer;font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details.ans{margin-top:10px}

.master{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:2.2em 0 .6em;padding-top:1.4em;border-top:1px solid var(--line2)}
.mbtn{border:1px solid var(--good);background:transparent;color:var(--good);font-family:var(--mono);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px}
.mbtn:hover{background:var(--good-soft)}
.mbtn.on{background:var(--good);color:var(--bg);box-shadow:0 0 14px rgba(183,217,140,.4)}
.next{margin-top:1em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.next strong{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.fig.tl{max-width:620px;padding:14px 16px}
.tl ol{list-style:none;margin:0;padding:0;position:relative}
.tl ol::before{content:"";position:absolute;left:7.4em;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl li{display:grid;grid-template-columns:7em 1fr;gap:1.2em;padding:6px 0;position:relative;font-size:.95rem}
.tl li::before{content:"";position:absolute;left:calc(7.4em - 4px);top:.85em;width:8px;height:8px;background:var(--accent);transform:rotate(45deg)}
.tl .when{font-family:var(--mono);font-size:.8rem;color:var(--accent);text-align:right;padding-top:.15em;letter-spacing:.03em}
@media (max-width:480px){.tl ol::before,.tl li::before{display:none}.tl li{grid-template-columns:1fr;gap:0}.tl .when{text-align:left}}

</style>

<div class="bar">
<header class="top">
  <h1 id="sitetitle">World History Learning Web<small id="sitesub"></small></h1>
  <button class="backbtn" id="backbtn" data-act="back" disabled>← Back to where I was</button>
</header>
<div class="return" id="ret" hidden></div>
</div>

<div class="shell">
  <main id="main"></main>

      <span><i class="dot n"></i>Not yet</span>

    </div>
  </nav>
</div>

<div id="pop" role="dialog" hidden></div>

const LW_DATA = {"subject": {"title": "World History Learning Web", "name": "World History", "subtitle": "From the first humans to today", "start": "chronology", "storage": "learning-web-world-history-v1", "intro": {"page": "chronology", "html": "<p><strong>Welcome.<\/strong> This is the first page of the World History web. Each page teaches one idea and shows what it builds on. Use the map (on the right, or at the bottom on a phone) to move around, and the orange <strong>Return<\/strong> bar to get back to where you were.<\/p>\n<p>Underlined words open a quick definition. Small numbered boxes are footnotes.<\/p>"}, "labels": {"example": "Walkthrough", "practice": "Try it yourself", "level": "Level"}}, "concepts": [{"id": "chronology", "title": "Dates and periods", "prereqs": [], "big": "Historians place every event on one shared line of years, and group long stretches of that line into named periods.", "recap": "Years are counted from year 1. Years before it are BCE and count down toward 1, so 500 BCE is earlier than 300 BCE. Years after it are CE and count up. There is no year 0. A century is 100 years, so the 1800s are the 19th century.", "check": {"q": "Which came first, an event in 500 BCE or an event in 300 BCE?", "options": ["The event in 500 BCE", "The event in 300 BCE", "They are the same year", "You cannot tell without the month"], "answer": 0, "why": "BCE years count down toward year 1, so a bigger BCE number is further back in time. 500 BCE came 200 years before 300 BCE. Reading BCE like an ordinary number, where bigger means later, gives the wrong answer."}, "body": "<h2>One line of years<\/h2>\n<p>To compare events, historians need one shared way to count years. Most of the world now uses the same count. It starts from a year 1 that was meant to be the year Jesus was born.<button class=\"fn\" data-g=\"n_jesus_birth\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>Years after that start are labeled CE. Years before it are labeled BCE.<button class=\"fn\" data-g=\"n_bc_ad\" aria-label=\"Note 2\">2<\/button> These two labels, <button class=\"term\" data-g=\"bce-ce\">BCE and CE<\/button>, are how this site writes every date.<button class=\"fn\" data-g=\"n_other_calendars\" aria-label=\"Note 3\">3<\/button><\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>300 BCE<\/th><th>200 BCE<\/th><th>100 BCE<\/th><th>1 BCE<\/th><th>1 CE<\/th><th>100 CE<\/th><th>200 CE<\/th><\/tr><\/thead><tbody><tr><td>← further back<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>later →<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: BCE numbers get smaller as time moves forward. There is no year 0: 1 BCE is followed directly by 1 CE.<\/em><\/p>\n<h2>Counting across the line<\/h2>\n<p>Working out how long ago something happened is easy when both dates are CE. From 1900 CE to 2000 CE is 100 years.<\/p>\n<p>When one date is BCE and the other is CE, add the two numbers, then take away 1. You take away 1 because there is no year 0. From 200 BCE to 300 CE is 200 + 300 − 1 = 499 years.<\/p>\n<p><strong>Why it works.<\/strong> From 200 BCE to 1 BCE is 199 years. One more year gets you to 1 CE. Then 299 more get you to 300 CE. That is 199 + 1 + 299 = 499.<\/p>\n<h2>Centuries<\/h2>\n<p>A <button class=\"term\" data-g=\"century\">century<\/button> is 100 years. The 1st century CE is the years 1 to 100. The 2nd century is 101 to 200. So the century number is always one more than the \"hundreds\" in the year.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Years<\/th><th>Century<\/th><\/tr><\/thead><tbody><tr><td>1 to 100 CE<\/td><td>1st century CE<\/td><\/tr><tr><td>1801 to 1900<\/td><td>19th century<\/td><\/tr><tr><td>1901 to 2000<\/td><td>20th century<\/td><\/tr><tr><td>500 to 401 BCE<\/td><td>5th century BCE<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the 1800s are the 19th century, not the 18th. This is the most common slip.<\/em><\/p>\n<h2>Periods and eras<\/h2>\n<p>Long stretches of time get names, such as \"the classical world\" or \"the Middle Ages\". Each name marks a <button class=\"term\" data-g=\"period\">period<\/button> that historians think hangs together.<\/p>\n<p>Three things to remember about periods:<\/p>\n<ul><li><strong>People at the time did not use the names.<\/strong> Nobody in 1200 thought they lived in the \"Middle Ages\".<\/li><li><strong>The edges are blurry.<\/strong> Change happens gradually, so historians disagree about where one period ends.<\/li><li><strong>A period can fit one region and not another.<\/strong> \"The Middle Ages\" is a European label. China in the same centuries had a very different story.<\/li><\/ul>\n<p>When an exact year is unknown, historians write \"c.\" before it, short for <button class=\"term\" data-g=\"circa\">circa<\/button>: c. 3200 BCE means \"about 3200 BCE\".<\/p>", "example": {"title": "Rome was founded, by tradition, in 753 BCE. The western Roman Empire ended in 476 CE. How many years is that?", "steps": [{"text": "Notice that one date is BCE and the other is CE.", "why": "The two dates are on opposite sides of year 1, so the counting-across rule applies.", "uses": []}, {"text": "Add the two numbers: 753 + 476 = 1229.", "why": "753 years lie on the BCE side and 476 on the CE side.", "uses": []}, {"text": "Take away 1: 1229 − 1 = 1228 years.", "why": "There is no year 0, so simply adding counts one year too many.", "uses": []}, {"text": "Check the answer by counting in steps: 752 years from 753 BCE to 1 BCE, 1 year to 1 CE, then 475 years to 476 CE. 752 + 1 + 475 = 1228.", "why": "Counting a second way catches mistakes with the missing year 0.", "uses": []}]}, "practice": {"q": "The Battle of Hastings, in England, was fought in 1066. Which century is that?", "answer": "The <strong>11th century<\/strong>. The 11th century is the years 1001 to 1100. The hundreds in 1066 are 10, and the century number is one more: 11."}, "stub": false}, {"id": "primary-sources", "title": "Sources and evidence", "prereqs": [], "big": "Everything we know about the past comes from evidence that survived, and historians test each piece by asking who made it, when and why.", "recap": "A primary source was made at the time, by people who took part in or saw the events (a letter, a law, a photo, a tool). A secondary source was made later by someone studying the past (a textbook). Every source has a point of view, so historians ask who made it, when, and why.", "check": {"q": "A historian publishes a book about the French Revolution in 2010. What kind of source is it, for studying the Revolution?", "options": ["A secondary source", "A primary source, because it is about the Revolution", "A primary source, because it is printed and published", "Not a source at all"], "answer": 0, "why": "It was written long after the events, by someone studying them, so it is a secondary source. Being about an event does not make a source primary; being from the time does. Secondary sources are still sources, and good ones are very useful."}, "body": "<h2>How we know anything<\/h2>\n<p>Nobody alive today saw ancient Rome. Everything we know about it comes from things that survived: writing, buildings, coins, bones, pictures. Historians call these traces evidence.<\/p>\n<p>For most of human history, nobody wrote anything down. Writing was only invented around 3200 BCE. For the long stretch before that, and for peoples who did not write, we rely on <button class=\"term\" data-g=\"archaeology\">archaeology<\/button>: the study of what people left behind.<\/p>\n<h2>Primary and secondary<\/h2>\n<p>Historians sort sources into two kinds.<\/p>\n<p>A <button class=\"term\" data-g=\"primary-source\">primary source<\/button> was made at the time by people who took part in or saw the events. A <button class=\"term\" data-g=\"secondary-source\">secondary source<\/button> was made later by someone studying the past.<button class=\"fn\" data-g=\"n_both\" aria-label=\"Note 1\">1<\/button><\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Source<\/th><th>Kind<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td>A soldier's letter home in 1916<\/td><td>Primary<\/td><td>Written by someone in the war, at the time<\/td><\/tr><tr><td>A Roman coin<\/td><td>Primary<\/td><td>Made and used in Roman times<\/td><\/tr><tr><td>A textbook chapter on World War I<\/td><td>Secondary<\/td><td>Written long after, from other sources<\/td><\/tr><tr><td>A 1990 documentary about ancient Egypt<\/td><td>Secondary<\/td><td>Made long after, by people studying Egypt<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: what makes a source primary is when and by whom it was made, not what it is about.<\/em><\/p>\n<h2>Asking questions of a source<\/h2>\n<p>Every source was made by someone, for a reason. So every source has a <button class=\"term\" data-g=\"point-of-view\">point of view<\/button>. That does not make it useless. It means you have to read it with questions in mind:<\/p>\n<ul><li><strong>Who made it?<\/strong> What did they know? What did they gain?<\/li><li><strong>When?<\/strong> At the time, or years later, from memory?<\/li><li><strong>Why, and for whom?<\/strong> To inform, to persuade, to boast, to obey an order?<\/li><li><strong>What does it leave out?<\/strong><\/li><\/ul>\n<h2>The silences<\/h2>\n<p>What survives is uneven. Rich and powerful people wrote more and built in stone, so their lives are better recorded. Poor people, women and enslaved people appear far less often in written records, and often only through the eyes of others. Historians work hard to fill these gaps, with archaeology, with records such as court cases and tax lists, and by reading sources against their grain.<\/p>\n<p><strong>Why this matters.<\/strong> History is not a list of facts handed down. It is a set of conclusions built from evidence. Knowing where the evidence comes from tells you how confident to be.<\/p>", "example": {"title": "How reliable is Julius Caesar's own account of his war in Gaul (58 to 50 BCE)?", "steps": [{"text": "Decide what kind of source it is. Caesar wrote it during the war, about his own campaigns, so it is a primary source.", "why": "It was made at the time by someone who took part.", "uses": []}, {"text": "Ask who made it and why. Caesar was a politician as well as a general. He wanted Romans at home to see him as a great leader.<button class=\"fn\" data-g=\"n_caesar\" aria-label=\"Note 2\">2<\/button>", "why": "A writer's aims shape what they put in and leave out.", "uses": []}, {"text": "Decide what to trust. The places, the order of events and the general outcome are probably reliable. The huge numbers of enemies he says he defeated are probably exaggerated.", "why": "Readers in Rome could check where Caesar went, but not how many enemies he faced, and big numbers made him look better.", "uses": []}, {"text": "Compare with other evidence. Archaeologists have dug at sites he describes, such as the siege of Alesia, and found traces of the siege works he reports.", "why": "Where an independent source agrees, confidence goes up.", "uses": []}]}, "practice": {"q": "You have a diary kept by a soldier during a battle in 1916, and a 1990 documentary about the same battle. Which is the primary source? Give one weakness of each.", "answer": "The <strong>diary<\/strong> is the primary source. Its weakness: one soldier saw only a small part of the battle and may not have known the bigger picture. The documentary is secondary. Its weakness: it was made long after, and depends on which sources its makers chose and how they told the story."}, "stub": false}, {"id": "causation", "title": "Causes and effects in history", "prereqs": [], "big": "Most events in history have several causes working together, and historians sort them into the ones that made an event possible and the one that set it off.", "recap": "Most events have several causes. Long-term causes build up over years and make an event possible. A short-term cause, the trigger, sets it off. And just because something happened first does not mean it caused what came after.", "check": {"q": "A forest is very dry after months without rain. Then lightning strikes and a fire starts. Which is the trigger?", "options": ["The lightning strike", "The months without rain", "The fire", "There is no trigger, only the dry weather"], "answer": 0, "why": "The lightning set the fire off at one moment. The dry months are the long-term cause: they made a big fire possible. The fire is the result, not a cause."}, "body": "<h2>More than one cause<\/h2>\n<p>Ask \"why did this happen?\" about almost any event, and you will find more than one answer.<\/p>\n<p>Think of a forest fire. It might need months of dry weather, a strong wind and a lightning strike. Take away any one of them and there may be no fire, or a much smaller one. History works the same way.<\/p>\n<h2>Long-term causes and triggers<\/h2>\n<p>Historians often sort causes by how long they took to build up.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Kind of cause<\/th><th>What it does<\/th><th>Forest fire<\/th><th>World War I<\/th><\/tr><\/thead><tbody><tr><td>Long-term<\/td><td>Builds up over years and makes the event possible<\/td><td>Months of dry weather<\/td><td>Rival alliances, nationalism<\/td><\/tr><tr><td>Trigger<\/td><td>Sets the event off at one moment<\/td><td>A lightning strike<\/td><td>The killing of an archduke in 1914<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A <button class=\"term\" data-g=\"long-term-cause\">long-term cause<\/button> is a condition, such as debt, rivalry or a new idea spreading. A <button class=\"term\" data-g=\"trigger\">trigger<\/button> is an event. Without the conditions, the trigger might have changed little. In 1914, <button class=\"clink\" data-c=\"sarajevo-assassination\">one assassination<\/button> could start a world war only because so much tension had already built up.<\/p>\n<h2>First is not the same as cause<\/h2>\n<p>Just because one thing happened before another does not mean it caused it.<button class=\"fn\" data-g=\"n_post_hoc\" aria-label=\"Note 1\">1<\/button> To show a cause, you need a link: a way the first thing actually led to the second. Evidence for that link comes from sources.<\/p>\n<h2>Causes become consequences<\/h2>\n<p>Every event has <button class=\"term\" data-g=\"consequence\">consequences<\/button>, and those consequences become causes of later events. That is why history is a web, not a list. Each page on this site that leads to another is one strand of that web.<\/p>\n<p><strong>Why historians argue.<\/strong> Historians usually agree on the list of causes. They disagree about which mattered most. Weighing causes is a judgment, made from evidence, and new evidence can change it.<\/p>", "example": {"title": "Sort the causes of the French Revolution of 1789.", "steps": [{"text": "France's government was deeply in debt, partly from paying for wars, including its help to the American revolutionaries.", "why": "Debt built up over decades. It is a long-term cause: it made a crisis possible.", "uses": []}, {"text": "Taxes fell mostly on ordinary people, while nobles and the Church paid little.", "why": "Resentment grew over a long time. Another long-term cause.", "uses": []}, {"text": "New ideas spread that rulers' power should come from the people and that all should be equal before the law.", "why": "Ideas take years to spread. They gave people reasons to demand change, so they are long-term causes too.", "uses": []}, {"text": "A bad harvest in 1788 made bread very expensive. In May 1789 an assembly the king had called to fix the debt, the Estates-General, met for the first time in 175 years.", "why": "These were short-term causes. The meeting gave angry people a place to act, and it set the Revolution off.", "uses": []}]}, "practice": {"q": "A student writes: \"The western Roman Empire fell in 476 CE because its last emperor was a teenager.\" What is wrong with this as an explanation?", "answer": "It names, at most, a detail of the final moment, not the causes. The last emperor, Romulus Augustulus, was a teenager who was removed by a Germanic general, Odoacer. But the empire was already very weak after long-term problems: years of invasions, civil wars, money troubles and a split between east and west. Those long-term causes made the fall possible."}, "stub": false}, {"id": "human-origins", "title": "The first humans and their spread", "prereqs": ["chronology"], "big": "Modern humans first appeared in Africa about 300,000 years ago, and over tens of thousands of years spread across every continent except Antarctica.", "recap": "Modern humans, Homo sapiens, appeared in Africa about 300,000 years ago. They lived as hunter-gatherers, moving to find food. From about 70,000 to 50,000 years ago groups spread out of Africa, and by at least 15,000 years ago people had reached the Americas.", "check": {"q": "Where did modern humans first appear?", "options": ["Africa", "Europe", "Asia", "The Americas"], "answer": 0, "why": "The oldest fossils of modern humans, and the greatest genetic variety among living people, are both in Africa. Europe has famous cave paintings, but modern humans arrived there only about 45,000 years ago. The Americas were the last major region people reached."}, "body": "<h2>A very long story<\/h2>\n<p>Human history before farming is enormous. For this stretch, historians usually count in \"years ago\" instead of BCE, because the numbers are so large and so rough. 300,000 years ago is about 298,000 BCE, but no one knows the date that closely.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>How long ago<\/th><th>What happened<\/th><\/tr><\/thead><tbody><tr><td>About 2 million years<\/td><td>Earlier human species, such as Homo erectus, spread out of Africa<\/td><\/tr><tr><td>About 300,000 years<\/td><td>Modern humans appear in Africa<\/td><\/tr><tr><td>About 70,000 to 50,000 years<\/td><td>Modern humans spread out of Africa<\/td><\/tr><tr><td>At least 50,000 years<\/td><td>People reach Australia, by boat<\/td><\/tr><tr><td>About 45,000 years<\/td><td>Modern humans reach Europe<\/td><\/tr><tr><td>At least 15,000 years<\/td><td>People reach the Americas<\/td><\/tr><tr><td>About 12,000 years<\/td><td>Farming begins<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: farming, cities and writing fill only the last few percent of the human story.<\/em><\/p>\n<h2>Who the first humans were<\/h2>\n<p>We belong to one species, <button class=\"term\" data-g=\"homo-sapiens\">Homo sapiens<\/button>. For most of our past we shared the world with other kinds of humans, such as the Neanderthals of Europe and western Asia. They died out about 40,000 years ago, but not completely: many people today carry a little Neanderthal DNA.<button class=\"fn\" data-g=\"n_neanderthal\" aria-label=\"Note 1\">1<\/button><\/p>\n<h2>How they lived<\/h2>\n<p>For more than 95 percent of human history, everyone was a <button class=\"term\" data-g=\"hunter-gatherer\">hunter-gatherer<\/button>. People lived in small bands, moved with the seasons and got food by hunting, fishing and gathering plants.<\/p>\n<p>This was the <button class=\"term\" data-g=\"stone-age\">Old Stone Age<\/button>. People made stone tools, controlled fire, made clothing and painted. The paintings in Chauvet Cave in France are about 36,000 years old.<\/p>\n<h2>Spreading across the world<\/h2>\n<p>Small groups moved, generation by generation, following animals, coasts and better land. During the <button class=\"term\" data-g=\"ice-age\">Ice Age<\/button>, so much water was frozen in ice sheets that the seas were lower. Land appeared where there is sea today, which opened routes between continents.<\/p>\n<p><strong>Why it matters.<\/strong> This slow spread put people on every continent except Antarctica. When the ice melted and the seas rose, some groups were cut off from others for thousands of years. That is one reason the Americas and the rest of the world developed separately until 1492.<\/p>", "example": {"title": "How did people reach the Americas?", "steps": [{"text": "During the Ice Age, vast ice sheets locked up water, and sea level fell by over 100 meters.", "why": "Water frozen on land is water missing from the oceans.", "uses": []}, {"text": "A wide land bridge, now called Beringia, joined Siberia to Alaska.", "why": "The sea between them is shallow, so a lower sea left it dry.", "uses": []}, {"text": "People crossed into the Americas, on foot and possibly by boat along the coast.", "why": "They followed animals and coastlines, not a plan to find a new continent.", "uses": []}, {"text": "As the ice melted, the sea rose and covered the bridge. The Americas were cut off from Asia.", "why": "From then until 1492, the peoples of the Americas developed without contact with Africa, Asia and Europe.<button class=\"fn\" data-g=\"n_americas\" aria-label=\"Note 2\">2<\/button>", "uses": []}]}, "practice": {"q": "Why do historians usually write \"years ago\" instead of BCE for the time of the first humans?", "answer": "The numbers are huge and only roughly known. \"About 300,000 years ago\" is honest about how rough the date is. Writing \"298,000 BCE\" would suggest a precision nobody has."}, "stub": false}, {"id": "agricultural-revolution", "title": "The farming revolution", "prereqs": ["human-origins"], "big": "About 12,000 years ago people began to grow crops and raise animals, and this change to farming reshaped almost everything about human life.", "recap": "Starting about 10,000 BCE in southwest Asia, and soon after in several other places on its own, people began to farm. Farming fed more people from less land, so people settled in villages, populations grew, and some food could be stored as a surplus.", "check": {"q": "Why is the change to farming called a revolution, even though it took thousands of years?", "options": ["It changed almost everything about how people lived.", "It happened suddenly, within a single lifetime.", "It began with an uprising against hunters.", "It spread from one village to the whole world."], "answer": 0, "why": "\"Revolution\" here means a total change, not a fast one. Farming changed where people lived, how many there were, what they owned and how they were organized. It was not sudden or violent, and it began separately in several places rather than spreading from one."}, "body": "<h2>From gathering to growing<\/h2>\n<p>For hundreds of thousands of years, people found their food. Then, about 12,000 years ago, some began to grow it.<\/p>\n<p>They learned to <button class=\"term\" data-g=\"domesticate\">domesticate<\/button> plants and animals: to choose and breed them until they became crops and herds that depended on people, and people on them.<\/p>\n<p>This happened first in the <button class=\"term\" data-g=\"fertile-crescent\">Fertile Crescent<\/button> of southwest Asia, around 10,000 BCE. Then it happened again, on its own, in other parts of the world.<button class=\"fn\" data-g=\"n_independent\" aria-label=\"Note 1\">1<\/button><\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Region<\/th><th>About when<\/th><th>First crops and animals<\/th><\/tr><\/thead><tbody><tr><td>Fertile Crescent (southwest Asia)<\/td><td>10,000 BCE<\/td><td>Wheat, barley, lentils, sheep, goats<\/td><\/tr><tr><td>China<\/td><td>7000 BCE<\/td><td>Rice in the south, millet in the north, pigs<\/td><\/tr><tr><td>Mesoamerica (Mexico and Central America)<\/td><td>7000 BCE<\/td><td>Maize (corn), squash, beans<\/td><\/tr><tr><td>The Andes (South America)<\/td><td>6000 BCE<\/td><td>Potatoes, llamas<\/td><\/tr><tr><td>Africa south of the Sahara<\/td><td>3000 BCE<\/td><td>Sorghum, yams<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the dates are rough, and they differ by thousands of years. Each region farmed the wild plants that grew there.<\/em><\/p>\n<h2>Why then?<\/h2>\n<p>The Ice Age ended about 11,700 years ago. The climate became warmer, wetter and steadier. Wild grains spread, and people who gathered them began to plant them too. Over many generations, gathering became farming.<\/p>\n<h2>What farming changed<\/h2>\n<p>Farming produces far more food from a small area of land than hunting does. That one fact changed nearly everything.<\/p>\n<ul><li><strong>People settled down.<\/strong> Farmers stay near their fields, so villages grew up. Jericho and Çatalhöyük were early ones.<\/li><li><strong>Populations grew.<\/strong> More food fed more children.<\/li><li><strong>Food could be stored.<\/strong> A good harvest left a <button class=\"term\" data-g=\"surplus\">surplus<\/button>, food beyond what people needed right away.<\/li><li><strong>Property and inequality grew.<\/strong> Land, herds and stored food could be owned, so some families became richer than others.<\/li><\/ul>\n<h2>Not all better<\/h2>\n<p>Farming was not simply progress. Skeletons show that early farmers were often shorter and less healthy than hunter-gatherers. Their diet was narrower, the work was hard, and living close to animals and to each other spread disease. A bad harvest could mean famine. But farming could feed far more people, so farming peoples grew in number and spread.<\/p>\n<p><strong>Why it is a turning point.<\/strong> Every later step on this site, from cities to empires, rests on farming. Without a surplus of food, there are no cities, no kings and no full-time scribes or soldiers.<\/p>", "example": {"title": "How farming led to a surplus, and why a surplus mattered.", "steps": [{"text": "Farmers grew more grain than their families needed in a good year.", "why": "A planted field yields far more food per acre than wild land.", "uses": []}, {"text": "They stored the extra grain in pits, jars and granaries.", "why": "Grain keeps for months or years if kept dry.", "uses": []}, {"text": "The stored grain could feed people who did not farm.", "why": "Some people were now free to do other work, such as making pots, building or leading rituals.", "uses": []}, {"text": "Whoever controlled the stores gained power over others.", "why": "Food is the most basic need. Controlling it is one root of rulers and social classes.", "uses": ["causation"]}]}, "practice": {"q": "Give one way farming made life harder for people, compared with hunting and gathering.", "answer": "Any of these: the work was longer and harder; diets were narrower, so health suffered; living crowded together with animals spread disease; and a failed harvest could cause famine."}, "stub": false}, {"id": "civilization", "title": "What makes a civilization", "prereqs": ["agricultural-revolution"], "big": "A civilization is a complex society built around cities, where a food surplus lets people do many different jobs under some kind of government.", "recap": "Historians use \"civilization\" for a society with cities, a food surplus, people in specialized jobs, social classes, a government and, usually, a way of keeping records. The first ones grew up in river valleys after about 3500 BCE. The word does not mean \"better\" than other peoples.", "check": {"q": "Which of these is the best sign that a society was a civilization, as historians use the word?", "options": ["It had cities, where people did many different jobs.", "Its people were kinder or cleverer than their neighbors.", "Its people farmed.", "Its people used stone tools."], "answer": 0, "why": "Cities with many specialized jobs are the core of the definition. Farming alone is not enough, since many farming villages never grew into cities. Stone tools were used by almost everyone. And \"civilization\" is not a judgment that one people is better than another."}, "body": "<h2>Villages to cities<\/h2>\n<p>Farming villages stayed small for thousands of years. Then, in a few places, some grew into true <button class=\"term\" data-g=\"city\">cities<\/button>: thousands or tens of thousands of people living packed together.<\/p>\n<p>The first cities appeared in Mesopotamia, in what is now Iraq, by about 3500 BCE. Uruk was one of the biggest. By 3000 BCE it may have held tens of thousands of people.<\/p>\n<h2>The signs of a civilization<\/h2>\n<p>Historians use \"civilization\" for this new kind of society.<button class=\"fn\" data-g=\"n_civ_word\" aria-label=\"Note 1\">1<\/button> There is no single test, but most civilizations shared these features:<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Feature<\/th><th>What it means<\/th><\/tr><\/thead><tbody><tr><td>Cities<\/td><td>Large, crowded, permanent settlements<\/td><\/tr><tr><td>Food surplus<\/td><td>Farmers grow enough to feed people who do not farm<\/td><\/tr><tr><td>Specialized jobs<\/td><td>Potters, metalworkers, priests, soldiers, scribes<\/td><\/tr><tr><td>Social classes<\/td><td>Rulers and priests at the top, farmers and slaves at the bottom<\/td><\/tr><tr><td>Government<\/td><td>Rulers who make laws, collect taxes and organize work<\/td><\/tr><tr><td>Big public works<\/td><td>Temples, walls, palaces, canals<\/td><\/tr><tr><td>Record keeping<\/td><td>Usually writing, to track taxes and goods<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: almost every feature depends on the one before it. Without a surplus, nobody can be spared to be a potter or a priest.<\/em><\/p>\n<p><button class=\"term\" data-g=\"specialization\">Specialization<\/button> is the key change. In a village, almost everyone farms. In a city, many people do one particular job, and they trade or pay taxes for food. This created <button class=\"term\" data-g=\"social-class\">social classes<\/button>: groups with very different wealth and power.<\/p>\n<h2>Why rivers?<\/h2>\n<p>The first civilizations all grew up along great rivers: the Tigris and Euphrates in Mesopotamia, the Nile in Egypt, the Indus in South Asia and the Yellow River in China.<\/p>\n<p>Rivers gave water in dry lands, rich soil from floods, and an easy way to move goods. But using a river well took work. <button class=\"term\" data-g=\"irrigation\">Irrigation<\/button>, digging canals to carry water to fields, needed many people working together, and someone to plan and direct them. That need for organization helped create governments.<\/p>\n<p><strong>Why it matters.<\/strong> Civilization is not a reward for being better. It is a way of living that a big food surplus made possible, and it brought both great achievements and great inequality.<\/p>", "example": {"title": "How a river valley could grow into a civilization.", "steps": [{"text": "Farmers in a dry river valley dug canals to bring river water to their fields.", "why": "Without irrigation, the land was too dry for big harvests.", "uses": ["agricultural-revolution"]}, {"text": "Large canal systems needed planners, organizers and many workers.", "why": "One family cannot dig and maintain miles of canals alone.", "uses": []}, {"text": "Irrigated fields produced a large surplus, which leaders collected and stored.", "why": "Controlling the food gave leaders the means to feed workers, priests and soldiers.", "uses": []}, {"text": "Cities grew around temples and stores, full of people in specialized jobs, under rulers who kept records.", "why": "The surplus let many people stop farming. The rulers needed records to track what they collected.", "uses": []}]}, "practice": {"q": "Why did the earliest civilizations grow up along rivers?", "answer": "Rivers gave water to farm in dry regions, fertile soil from floods, and an easy way to move goods. Irrigating from a river also needed large-scale organization, which encouraged the growth of leaders and government."}, "stub": false}, {"id": "writing", "title": "The invention of writing", "prereqs": ["civilization", "primary-sources"], "big": "Writing was invented about 5,000 years ago to keep records, and it let people store knowledge, run large states and leave messages for the future.", "recap": "Writing began in Mesopotamia around 3200 BCE, as a way to keep accounts of goods and taxes. It was also invented separately in Egypt, China and Mesoamerica. Written records are why historians can study events, names and ideas, not just objects, from about that time on.", "check": {"q": "What were the earliest writings from Mesopotamia mostly used for?", "options": ["Keeping accounts of goods, such as grain and animals", "Writing down stories and poems", "Sending letters between friends", "Recording a code of laws"], "answer": 0, "why": "The oldest clay tablets, from the city of Uruk, are mostly lists and accounts. Stories such as the Epic of Gilgamesh, letters and law codes such as Hammurabi's came later, once writing could record whole sentences."}, "body": "<h2>Counting before writing<\/h2>\n<p>Early cities collected and stored huge amounts of goods: grain, oil, sheep, cloth. Officials needed to know who had paid what, and who was owed what. Memory was not enough.<\/p>\n<p>So, around 3200 BCE in Mesopotamia, officials began pressing marks into wet clay tablets. At first the marks were small pictures of things, with signs for numbers: \"5 sheep\", \"10 jars of oil\".<\/p>\n<h2>From pictures to sounds<\/h2>\n<p>Pictures are good for things, but not for names, actions or ideas. The breakthrough was letting signs stand for <strong>sounds<\/strong>. A sign for a word could be borrowed for any word, or part of a word, that sounded the same.<\/p>\n<p>With sound signs, people could write anything they could say. Over time the pictures were simplified into wedge-shaped marks pressed with a cut reed. This script is called <button class=\"term\" data-g=\"cuneiform\">cuneiform<\/button>, from the Latin for \"wedge\".<\/p>\n<h2>Invented more than once<\/h2>\n<p>Writing was not invented once and passed around. It was invented separately in at least four places.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Where<\/th><th>Script<\/th><th>About when<\/th><\/tr><\/thead><tbody><tr><td>Mesopotamia<\/td><td>Cuneiform<\/td><td>3200 BCE<\/td><\/tr><tr><td>Egypt<\/td><td><button class=\"term\" data-g=\"hieroglyphs\">Hieroglyphs<\/button><\/td><td>3200 BCE<\/td><\/tr><tr><td>China<\/td><td>Oracle bone script, the ancestor of Chinese characters<\/td><td>1200 BCE<\/td><\/tr><tr><td>Mesoamerica<\/td><td>Zapotec and later Maya scripts<\/td><td>Before 300 BCE<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the Mesopotamian and Egyptian dates are so close that historians still debate whether one influenced the other.<\/em><\/p>\n<p>Some scripts are still a mystery. The Indus Valley script has never been deciphered.<button class=\"fn\" data-g=\"n_undeciphered\" aria-label=\"Note 1\">1<\/button><\/p>\n<h2>Scribes and power<\/h2>\n<p>Early scripts had hundreds of signs and took years to learn. Only a few people, the <button class=\"term\" data-g=\"scribe\">scribes<\/button>, could read and write. They worked for temples and kings, which made writing a tool of power: of taxes, laws and royal boasts.<\/p>\n<p>Much later, around 1800 BCE, people in the region of Egypt and Sinai developed signs for single sounds. This became the first <button class=\"term\" data-g=\"alphabet\">alphabet<\/button>, with only a few dozen signs. It passed through the Phoenicians to the Greeks and Romans, and it is the ancestor of the letters on this page.<\/p>\n<figure class=\"fig pic\" data-src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Rosetta_Stone.JPG?width=800\" data-page=\"https://commons.wikimedia.org/wiki/File:Rosetta_Stone.JPG\" data-alt=\"The Rosetta Stone, a dark slab of stone covered in three kinds of writing\"><div class=\"picframe\"><\/div><figcaption>The Rosetta Stone (196 BCE) repeats one decree in three scripts. Notice the three bands of different writing.<span class=\"credit\">Image: Hans Hillewaert, CC BY-SA 4.0 · <a href=\"https://commons.wikimedia.org/wiki/File:Rosetta_Stone.JPG\" target=\"_blank\" rel=\"noopener\">source<\/a><\/span><\/figcaption><\/figure>\n<h2>The line between prehistory and history<\/h2>\n<p>Writing changes what we can know. The time before written records is called <button class=\"term\" data-g=\"prehistory\">prehistory<\/button>. We know it only through <button class=\"term\" data-g=\"archaeology\">archaeology<\/button>. After writing, we have <button class=\"clink\" data-c=\"primary-sources\">sources<\/button> in people's own words: names, laws, prayers, complaints.<button class=\"fn\" data-g=\"n_rosetta\" aria-label=\"Note 2\">2<\/button><\/p>\n<p><strong>Why it matters.<\/strong> Writing let a state count its people and goods, send orders far away and keep laws fixed. It let knowledge outlive the people who had it. Large states and empires would have been very hard to run without it.<\/p>", "example": {"title": "How a temple record became a writing system.", "steps": [{"text": "A temple official needed to record that a farmer had delivered five sheep.", "why": "Cities collected goods as taxes and offerings, and needed proof of who had paid.", "uses": ["civilization"]}, {"text": "The official pressed a picture of a sheep and five number marks into clay.", "why": "Pictures and numbers were enough for simple accounts.", "uses": []}, {"text": "To write the farmer's name, scribes used signs for their sounds, not their meaning.", "why": "A name cannot be drawn as a picture, but it can be spelled out in sounds.", "uses": []}, {"text": "With sound signs, scribes could write whole sentences: letters, laws and stories.", "why": "Anything that can be said can be written once signs stand for sounds.", "uses": []}]}, "practice": {"q": "Why is the time before writing called \"prehistory\", and how do historians learn about it?", "answer": "\"History\" in the strict sense is built from written records, and before writing there are none. Historians learn about prehistory from archaeology: tools, bones, buildings, art and other things people left behind."}, "stub": false}, {"id": "mesopotamia", "title": "Mesopotamia", "prereqs": ["writing"], "big": "Mesopotamia, the land between the Tigris and Euphrates rivers in today's Iraq, saw the world's first cities, first writing and first empire.", "recap": "Mesopotamia is the land between the Tigris and Euphrates rivers, in modern Iraq. There the Sumerians built the first cities and invented cuneiform writing. Later, Sargon of Akkad built the first empire, and Hammurabi of Babylon issued a famous law code. Its open land was conquered by one people after another.", "check": {"q": "What was Hammurabi's Code?", "options": ["A set of laws carved on stone by a king of Babylon, about 1754 BCE", "The first writing system in the world", "A holy book about the Sumerian gods", "A peace treaty between Mesopotamia and Egypt"], "answer": 0, "why": "Hammurabi, king of Babylon, had nearly 300 laws carved on a tall stone pillar for all to see. Writing was much older, about 1,500 years, by his time. The code is about crimes, trade, family and wages, not gods or treaties."}, "body": "<h2>The land between the rivers<\/h2>\n<p>\"Mesopotamia\" is Greek for \"between the rivers\". It is the flat land between the Tigris and Euphrates, mostly in modern Iraq. It is part of the Fertile Crescent, where farming began.<\/p>\n<p>The rivers made the land rich, but they were hard to live with. Their floods came at unpredictable times and could be violent. Rain was scarce. Farmers needed canals and dikes to control the water, and that took organization.<\/p>\n<h2>Sumer: the first cities<\/h2>\n<p>By about 3500 BCE, the people of Sumer, in the far south, had built the first cities: Uruk, Ur, Lagash and others. Each was a <button class=\"term\" data-g=\"city-state\">city-state<\/button>, an independent city ruling its nearby farmland.<\/p>\n<p>At the center of each city stood a <button class=\"term\" data-g=\"ziggurat\">ziggurat<\/button>, a stepped temple tower for the city's own god. The Sumerians believed in many gods, who controlled the weather, the rivers and the harvest. Keeping them happy was the city's most important job.<\/p>\n<p>The Sumerians gave the world a great deal:<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Invention<\/th><th>Why it mattered<\/th><\/tr><\/thead><tbody><tr><td>Cuneiform writing<\/td><td>Records, laws, letters and stories could be kept<\/td><\/tr><tr><td>Some of the earliest wheels<\/td><td>First for pottery, then for carts<\/td><\/tr><tr><td>Counting in 60s<\/td><td>It is why an hour has 60 minutes and a circle 360 degrees<\/td><\/tr><tr><td>Written stories<\/td><td>The Epic of Gilgamesh, one of the oldest stories we have<button class=\"fn\" data-g=\"n_gilgamesh\" aria-label=\"Note 1\">1<\/button><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The first empire<\/h2>\n<p>The city-states often fought each other over water and land. Around 2300 BCE, Sargon of Akkad conquered them all. He ruled the first known <button class=\"term\" data-g=\"empire\">empire<\/button>: one ruler governing many cities and peoples.<\/p>\n<h2>Hammurabi's laws<\/h2>\n<p>Around 1754 BCE, Hammurabi, king of Babylon, had his laws carved on a stone pillar and set up in public. The code covered theft, trade, marriage, wages and injury.<\/p>\n<p>Two things stand out. First, the laws were written down, so everyone could, in principle, know them. Second, punishments depended on who you were. Hurting a noble cost far more than hurting a commoner or a slave. \"An eye for an eye\" applied between equals.<\/p>\n<h2>A crossroads, often conquered<\/h2>\n<p>Mesopotamia had no mountains or deserts to protect it, and its wealth attracted invaders. After the Sumerians and Akkadians came the Babylonians, the Assyrians, and later the Persians, who all ruled it in turn.<\/p>\n<p><strong>Why it matters.<\/strong> Cities, writing, written law and empire all appear here first. Later peoples, from the Hebrews to the Persians and Greeks, built on what Mesopotamia started.<\/p>", "example": {"title": "Why was Mesopotamia ruled by so many different peoples?", "steps": [{"text": "Mesopotamia was flat and open on most sides.", "why": "There were no mountains, seas or deserts to keep invaders out.", "uses": []}, {"text": "Its irrigated farmland and trade made it rich.", "why": "A rich land is worth conquering.", "uses": ["civilization"]}, {"text": "Its city-states were often divided and at war with each other.", "why": "Rival cities rarely united against an outside enemy, which made conquest easier.", "uses": []}, {"text": "So one people after another conquered it: Akkadians, Babylonians, Assyrians, Persians.", "why": "Easy to enter, rich to own and hard to defend, it changed hands again and again.", "uses": ["causation"]}]}, "practice": {"q": "Why is an hour divided into 60 minutes?", "answer": "The Mesopotamians counted in groups of 60. Their astronomers' system was passed on to the Greeks and from them to us. So our hours, minutes and the 360 degrees of a circle all come from Mesopotamian counting."}, "stub": false}, {"id": "ancient-egypt", "title": "Ancient Egypt", "prereqs": ["writing"], "big": "Ancient Egypt grew along the Nile, whose regular floods fed a kingdom that lasted about 3,000 years under god-kings called pharaohs.", "recap": "Egypt was a long, narrow kingdom along the Nile. The river flooded at the same time every year, leaving rich soil, so farming was reliable. Egypt was united about 3100 BCE and ruled by pharaohs, seen as gods on earth, who built pyramids as tombs. Deserts protected it, and it lasted about 3,000 years.", "check": {"q": "Why could Egypt's farmers rely on their river more than Mesopotamia's farmers could?", "options": ["The Nile flooded at about the same time every year.", "The Nile never flooded.", "Egypt had heavy rain every year.", "Egypt's farmers did not need water."], "answer": 0, "why": "Every summer the Nile rose, spread over the fields and left fresh black soil, almost like clockwork. Mesopotamia's rivers flooded at unpredictable times. Rain in Egypt is very rare, so the yearly flood was everything."}, "body": "<h2>The gift of the Nile<\/h2>\n<p>Egypt is almost all desert. But through it runs the Nile, the longest river in Africa. Every summer, rains far to the south made the Nile rise and spread over its banks. When the water went down, it left a layer of rich black mud. Farmers planted in it and harvested before the next flood.<\/p>\n<p>The flood was regular and usually gentle. That made Egyptian farming dependable, and it made the surplus large. The Egyptians called their country Kemet, \"the black land\", after that soil.<\/p>\n<p>The Nile was also a highway. The current flows north, and the wind usually blows south. Boats could drift one way and sail back the other.<\/p>\n<h2>Pharaohs<\/h2>\n<p>Around 3100 BCE, Upper Egypt (the south) and Lower Egypt (the north) were united under one king. Egypt's rulers came to be called <button class=\"term\" data-g=\"pharaoh\">pharaohs<\/button>. Egyptians believed the pharaoh was a god on earth, who kept order in the world and made sure the Nile rose.<\/p>\n<p>Ruling families passed power down for generations. Each family is a <button class=\"term\" data-g=\"dynasty\">dynasty<\/button>. Historians group Egypt's long history into three great periods of strength:<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Period<\/th><th>About when<\/th><th>Known for<\/th><\/tr><\/thead><tbody><tr><td>Old Kingdom<\/td><td>2700 to 2200 BCE<\/td><td>The great pyramids<\/td><\/tr><tr><td>Middle Kingdom<\/td><td>2050 to 1650 BCE<\/td><td>Trade, literature, a strong government<\/td><\/tr><tr><td>New Kingdom<\/td><td>1550 to 1070 BCE<\/td><td>An empire abroad; pharaohs such as Hatshepsut and Ramesses II<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>Notice: Egypt lasted so long that its own history has ancient and modern parts.<\/em><button class=\"fn\" data-g=\"n_cleopatra\" aria-label=\"Note 1\">1<\/button><\/p>\n<h2>Pyramids and the afterlife<\/h2>\n<p>Egyptians believed in life after death. They preserved bodies as <button class=\"term\" data-g=\"mummy\">mummies<\/button> and filled tombs with things the dead would need.<\/p>\n<p>The pyramids were tombs for pharaohs. The Great Pyramid at Giza was built for the pharaoh Khufu around 2560 BCE. It was the tallest human-made structure in the world for about 3,800 years.<\/p>\n<p>The pyramids were not built by slaves, as people once believed. Archaeologists have found the villages and tombs of the workers. They were paid laborers and farmers, organized by the state, many working in the flood season when their fields were under water.<\/p>\n<figure class=\"fig pic\" data-src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Kheops-Pyramid.jpg?width=800\" data-page=\"https://commons.wikimedia.org/wiki/File:Kheops-Pyramid.jpg\" data-alt=\"The Great Pyramid of Giza, a huge stone pyramid in the desert\"><div class=\"picframe\"><\/div><figcaption>The Great Pyramid of Khufu at Giza (about 2560 BCE). Notice its size: it was built from about 2.3 million stone blocks.<span class=\"credit\">Image: Wikimedia Commons (author and license on the source page) · <a href=\"https://commons.wikimedia.org/wiki/File:Kheops-Pyramid.jpg\" target=\"_blank\" rel=\"noopener\">source<\/a><\/span><\/figcaption><\/figure>\n<h2>Protected by desert<\/h2>\n<p>Deserts to the east and west and the sea to the north made Egypt hard to invade. For long stretches it was left alone to develop in its own way, unlike open Mesopotamia. Egypt was eventually conquered by Persia in 525 BCE, by Alexander the Great in 332 BCE, and by Rome in 30 BCE.<\/p>\n<p><strong>Why it matters.<\/strong> Egypt shows how much geography can shape a civilization. A reliable river and protective deserts gave it unusual stability, and that stability let one way of life last for three thousand years.<\/p>", "example": {"title": "How the Nile shaped Egypt.", "steps": [{"text": "The Nile flooded every year at the same season, leaving rich soil.", "why": "Rains far south, in the Ethiopian highlands, fell every summer.", "uses": []}, {"text": "Farming was reliable, so Egypt produced a big, steady surplus.", "why": "Farmers could plan around a flood that came on time.", "uses": ["civilization"]}, {"text": "The whole country lay along one river, which was also its main road.", "why": "Moving soldiers, officials and grain by boat made it easier to rule as one kingdom.", "uses": []}, {"text": "Deserts on both sides kept most invaders out.", "why": "With few outside threats, Egypt's kingdom and culture lasted for about 3,000 years.", "uses": ["causation"]}]}, "practice": {"q": "Who built the pyramids, and how do we know?", "answer": "Paid workers and farmers, organized by the state, many working while their fields were flooded. We know because archaeologists have excavated the workers' villages, bakeries and tombs near the pyramids at Giza. Workers buried near the king's tomb would not have been slaves."}, "stub": false}, {"id": "indus-valley", "title": "The Indus Valley civilization", "prereqs": ["civilization"], "big": "Along the Indus River, in today's Pakistan and northwest India, people built carefully planned cities around 2600 BCE, but we still cannot read their writing.", "recap": "The Indus Valley civilization flourished about 2600 to 1900 BCE in modern Pakistan and northwest India. Its cities, such as Harappa and Mohenjo-daro, had grid streets, standard bricks and covered drains. Its script has never been deciphered, so much about it is still unknown.", "check": {"q": "What is one big reason we know less about the Indus Valley civilization than about ancient Egypt?", "options": ["Its writing has never been deciphered.", "It left no ruins behind.", "It lasted only a few years.", "No archaeologist has ever dug there."], "answer": 0, "why": "Without being able to read their writing, we cannot learn their names, laws or beliefs from their own words. Their cities have been well excavated, and the civilization lasted about 700 years. The gap is the writing."}, "body": "<h2>Rediscovered cities<\/h2>\n<p>For thousands of years this civilization was forgotten. Then, in the 1920s, archaeologists digging at Harappa and Mohenjo-daro, in today's Pakistan, found the ruins of great cities. It is often called the Harappan civilization after the first city found.<\/p>\n<p>At its height, about 2600 to 1900 BCE, it covered a larger area than Egypt or Mesopotamia.<\/p>\n<h2>Planned cities<\/h2>\n<p>The cities stand out for how carefully they were planned.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>What archaeologists found<\/th><th>What it suggests<\/th><\/tr><\/thead><tbody><tr><td>Streets laid out in a grid<\/td><td>Someone planned the cities in advance<\/td><\/tr><tr><td>Baked bricks of the same proportions in many cities<\/td><td>Shared rules across a wide area<\/td><\/tr><tr><td>Covered drains and bathrooms in houses<\/td><td>Strong concern with water and cleanliness<\/td><\/tr><tr><td>A large public pool, the \"Great Bath\"<\/td><td>Perhaps bathing rituals, but we do not know<\/td><\/tr><tr><td>Standard stone weights<\/td><td>Organized trade, with agreed measures<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: every line in the right-hand column is a guess from objects. Without texts, that is all archaeology can give.<\/em><\/p>\n<p>Indus merchants traded far away. Their stamp <button class=\"term\" data-g=\"seal\">seals<\/button> have been found in Mesopotamia.<\/p>\n<h2>The great puzzle<\/h2>\n<p>The seals carry short inscriptions in the Indus script. No one has been able to <button class=\"term\" data-g=\"decipher\">decipher<\/button> it.<button class=\"fn\" data-g=\"n_undeciphered\" aria-label=\"Note 1\">1<\/button> So we do not know what language these people spoke, what they called themselves, or who ruled them.<\/p>\n<p>Strangely, archaeologists have found no grand palaces or royal tombs and few weapons. Power may have been organized differently from Egypt or Mesopotamia, but this is uncertain.<\/p>\n<h2>Decline<\/h2>\n<p>After about 1900 BCE, the cities slowly emptied. Most historians now link this to changes in climate and rivers, which shifted course or dried up, together with a decline in trade. An older idea, that invaders destroyed the cities, has been largely rejected because there is little evidence of conquest.<\/p>\n<p><strong>Why it matters.<\/strong> The Indus Valley shows how much we can learn from objects alone, and how much we cannot. It is also a reminder that early civilization was not only a story of kings and wars.<\/p>", "example": {"title": "What can we work out about the Indus people without reading their writing?", "steps": [{"text": "Their streets run in straight grids, and their bricks match from city to city.", "why": "That level of order across many cities suggests planning and shared rules.", "uses": ["primary-sources"]}, {"text": "Their houses had drains connected to covered sewers along the streets.", "why": "Someone organized public works that served ordinary homes.", "uses": []}, {"text": "Their seals and weights turn up far away, including in Mesopotamia.", "why": "Objects found far from home are evidence of trade.", "uses": []}, {"text": "We cannot say who ruled them, what they believed or what they called themselves.", "why": "Those things normally come from written sources, and theirs cannot be read.", "uses": ["writing"]}]}, "practice": {"q": "Why have most historians dropped the idea that invaders destroyed the Indus cities?", "answer": "The evidence shows a slow decline over centuries, not sudden destruction. There are few signs of attack. Changes in climate and in the rivers, and falling trade, fit the evidence better."}, "stub": false}, {"id": "early-china", "title": "Early China (Shang and Zhou)", "prereqs": ["writing"], "big": "China's first recorded kingdoms, the Shang and Zhou, grew along the Yellow River and gave China its writing and the idea of the Mandate of Heaven.", "recap": "The Shang dynasty (about 1600 to 1046 BCE) ruled along the Yellow River and left the earliest Chinese writing, on oracle bones. The Zhou overthrew them in 1046 BCE and claimed the Mandate of Heaven: the belief that Heaven lets a just ruler govern and takes that right away from a bad one.", "check": {"q": "What was the Mandate of Heaven?", "options": ["The belief that Heaven gave a just ruler the right to rule, and could take it away", "A rule that the oldest son always became king", "A holy book written on oracle bones", "A treaty that split China between the Shang and the Zhou"], "answer": 0, "why": "The Zhou said Heaven chose rulers for their goodness. A cruel or failing ruler lost Heaven's support, which made rebellion against him right. It was an idea about why rulers deserved power, not a rule of inheritance, a book or a treaty."}, "body": "<h2>The Yellow River<\/h2>\n<p>Chinese civilization grew up along the Huang He, the Yellow River, named for the yellow soil it carries. That fine soil, called loess, is easy to farm. But the river floods violently and has often changed its course, killing huge numbers of people. It has been called \"China's sorrow\".<\/p>\n<p>Farmers here grew millet in the north, while rice was farmed along the Yangtze River to the south.<\/p>\n<h2>The Shang<\/h2>\n<p>The first Chinese <button class=\"term\" data-g=\"dynasty\">dynasty<\/button> we know from its own writing is the Shang, which ruled from about 1600 to 1046 BCE.<button class=\"fn\" data-g=\"n_xia\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>The Shang kings asked their ancestors for advice. Priests carved questions on <button class=\"term\" data-g=\"oracle-bones\">oracle bones<\/button>, turtle shells and the shoulder blades of oxen, then heated them until they cracked. The cracks were read as answers: Will the harvest be good? Should the king go to war?<\/p>\n<p>These carvings are the earliest Chinese writing, and they are the direct ancestor of the characters used in China today. That is a continuity of over 3,000 years.<\/p>\n<p>The Shang were also master workers in <button class=\"term\" data-g=\"bronze\">bronze<\/button>. They cast huge, richly decorated vessels for offerings to their ancestors.<\/p>\n<h2>The Zhou and the Mandate of Heaven<\/h2>\n<p>In 1046 BCE, the Zhou people overthrew the last Shang king. They needed to explain why rebelling against a king was right. Their answer was the <button class=\"term\" data-g=\"mandate-of-heaven\">Mandate of Heaven<\/button>.<\/p>\n<p>Heaven, they said, gives the right to rule to a just and good ruler. If a ruler becomes cruel or careless, Heaven takes the mandate away and gives it to someone else. Floods, famines and rebellions were signs that a ruler had lost it.<\/p>\n<p>The Zhou ruled longer than any other Chinese dynasty, until 256 BCE. But in its later centuries, the king's power faded and rival states fought for control. In this troubled time lived the thinker Confucius (about 551 to 479 BCE), who taught how to restore order through good government and proper behavior.<\/p>\n<p><strong>Why it matters.<\/strong> The Mandate of Heaven shaped Chinese politics for 3,000 years. Every new dynasty claimed it. It explained the rise and fall of dynasties as a cycle: a strong start, slow decline, disaster, rebellion, and a new dynasty with Heaven's blessing.<\/p>", "example": {"title": "How the Zhou used the Mandate of Heaven to justify their rule.", "steps": [{"text": "In 1046 BCE the Zhou defeated the Shang king and took power.", "why": "They had built up their own strength in the west and won a decisive battle.", "uses": []}, {"text": "The Zhou needed people to accept that overthrowing a king was right.", "why": "Rule by force alone is unstable. Rulers want people to believe they deserve power.", "uses": ["causation"]}, {"text": "They said the last Shang king had been cruel, so Heaven had withdrawn its mandate.", "why": "This made the Zhou victory look like Heaven's choice, not just a seizure of power.", "uses": []}, {"text": "Every later dynasty used the same argument when it took power.", "why": "The idea worked both ways: it justified new rulers, and it warned rulers to govern well.", "uses": []}]}, "practice": {"q": "Why are oracle bones such valuable sources for historians?", "answer": "They are primary sources written by the Shang themselves, at the time. They name kings and ancestors and show what worried the Shang: harvests, weather, war, illness. They also prove that Chinese writing is over 3,000 years old."}, "stub": false}, {"id": "americas-before-1492", "title": "The Americas before 1492", "prereqs": ["civilization"], "big": "Cut off from the rest of the world, the peoples of the Americas built their own cities, empires and writing, including the Maya, the Aztecs and the Inca.", "recap": "The Americas developed separately from Asia, Africa and Europe for thousands of years. In Mesoamerica, the Maya built city-states with writing and astronomy, and the Aztecs built a tribute empire around their capital, Tenochtitlan. In the Andes, the Inca ruled a huge empire, linked by roads and run with knotted-cord records called quipu.", "check": {"q": "Which of these is true of the Inca Empire?", "options": ["It kept records with knotted cords called quipu.", "It was conquered by the Aztecs.", "Its capital was Tenochtitlan.", "It was in Mexico."], "answer": 0, "why": "The Inca had no writing, so they recorded numbers, and perhaps more, with knotted cords. The Inca lived in the Andes of South America, far from the Aztecs, and never fought them. Tenochtitlan, in Mexico, was the Aztec capital."}, "body": "<h2>A separate world<\/h2>\n<p>After the Ice Age, rising seas cut the Americas off from Asia. For thousands of years, the peoples of the Americas had no contact with the rest of the world. They domesticated their own crops, maize, beans, squash and potatoes, and built their own civilizations.<\/p>\n<p>Two regions saw the biggest states: <button class=\"term\" data-g=\"mesoamerica\">Mesoamerica<\/button> (southern Mexico and Central America) and the Andes mountains of South America.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>People<\/th><th>Where<\/th><th>About when<\/th><\/tr><\/thead><tbody><tr><td>Olmec<\/td><td>Gulf coast of Mexico<\/td><td>1200 to 400 BCE<\/td><\/tr><tr><td>Maya<\/td><td>Southern Mexico, Guatemala, Belize<\/td><td>City-states at their height about 250 to 900 CE<\/td><\/tr><tr><td>Cahokia<\/td><td>Mississippi valley, North America<\/td><td>About 1050 to 1350 CE<\/td><\/tr><tr><td>Aztec<\/td><td>Central Mexico<\/td><td>About 1325 to 1521 CE<\/td><\/tr><tr><td>Inca<\/td><td>Andes of South America<\/td><td>About 1400 to 1533 CE<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: these peoples did not all live at the same time. The Olmec flourished more than 2,000 years before the Aztecs.<\/em><\/p>\n<h2>The Maya<\/h2>\n<p>The Maya built dozens of city-states in the rainforests of Central America, with stone temples and pyramids. They developed the most complete writing system in the Americas. Their astronomers tracked the sun, moon and Venus very precisely, and their mathematics used a symbol for zero.<\/p>\n<p>Many southern Maya cities were abandoned in the 800s and 900s CE, probably because of drought, war and overused land. But the Maya people did not vanish. Millions of Maya live in the region today.<\/p>\n<h2>The Aztecs<\/h2>\n<p>The Aztecs, who called themselves the Mexica, founded their capital, Tenochtitlan, around 1325 on an island in a lake. They grew food on floating garden beds and built causeways to the shore. By 1500 the city may have had 200,000 people, more than any city in Spain at the time.<\/p>\n<p>The Aztecs ruled by conquest and <button class=\"term\" data-g=\"tribute\">tribute<\/button>. Conquered peoples paid goods, food and captives to the capital. Th
