capital and named it Constantinople in 330 CE. Today it is Istanbul, in Turkey. The city sat on a narrow strait between Europe and Asia. Water protected it on three sides, and huge walls on the fourth. Trade between Europe, Asia and the Black Sea passed its harbor, which made it rich.<\/p>\n<h2>Justinian's empire<\/h2>\n<p>The most famous Byzantine emperor was Justinian, who ruled from 527 to 565.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Achievement<\/th><th>What it was<\/th><\/tr><\/thead><tbody><tr><td>Law<\/td><td>He had centuries of Roman laws collected into one code. It later shaped the law of much of Europe<\/td><\/tr><tr><td>Building<\/td><td>He built the Hagia Sophia, a huge domed church finished in 537<\/td><\/tr><tr><td>War<\/td><td>His generals won back Italy, North Africa and part of Spain from Germanic kingdoms<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: Justinian tried to rebuild the old Roman Empire. The reconquests were costly, and a terrible plague in 541 killed a large share of the population. Much of Italy was lost to new invaders, the Lombards, within a few years of his death.<\/em><\/p>\n<figure class=\"fig pic\" data-src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Hagia_Sophia_Mars_2013.jpg?width=800\" data-page=\"https://commons.wikimedia.org/wiki/File:Hagia_Sophia_Mars_2013.jpg\" data-alt=\"The Hagia Sophia in Istanbul, a great domed building with four tall slender towers\"><div class=\"picframe\"><\/div><figcaption>The Hagia Sophia, finished in 537. For nearly 1,000 years it was the largest church in the world. The four towers, called minarets, were added after the Ottomans made it a mosque in 1453.<span class=\"credit\">Image: Wikimedia Commons (author and license on the source page) · <a href=\"https://commons.wikimedia.org/wiki/File:Hagia_Sophia_Mars_2013.jpg\" target=\"_blank\" rel=\"noopener\">source<\/a><\/span><\/figcaption><\/figure>\n<h2>Greek and Orthodox<\/h2>\n<p>Over time the empire became less Roman and more Greek. Greek replaced Latin as the language of government. The emperor was seen as God's representative on earth, and ran the Church as well as the state.<\/p>\n<p>Christians in the east and west slowly drifted apart. They disagreed about who led the Church and about religious practices, such as the use of <button class=\"term\" data-g=\"icon\">icons<\/button>. In 1054 church leaders in Rome and Constantinople excommunicated each other. This split, the <button class=\"term\" data-g=\"schism\">Great Schism<\/button>, divided Christianity into the Roman Catholic Church in the west and the <button class=\"term\" data-g=\"orthodox\">Eastern Orthodox Church<\/button> in the east. It has lasted to this day.<\/p>\n<h2>A long decline<\/h2>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Year<\/th><th>Event<\/th><\/tr><\/thead><tbody><tr><td>630s to 640s<\/td><td>Arab Muslim armies take Syria, Palestine and Egypt<\/td><\/tr><tr><td>1071<\/td><td>The Seljuk Turks defeat a Byzantine army at Manzikert and move into Anatolia<\/td><\/tr><tr><td>1204<\/td><td>Western crusaders capture and loot Constantinople<\/td><\/tr><tr><td>1261<\/td><td>The Byzantines win back their capital, but the empire is now small and weak<\/td><\/tr><tr><td>1453<\/td><td>The Ottoman Turks capture Constantinople. The empire ends<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the empire was worn down over 800 years, from many directions. Its final blow came from the Ottomans, but some of the worst damage was done by fellow Christians in 1204.<\/em><\/p>\n<h2>Why it matters<\/h2>\n<p>The Byzantines kept ancient Greek books safe while much of the west lost them. Greek scholars who fled to Italy before and after 1453 brought those books with them.<\/p>\n<p>They also spread Orthodox Christianity north. Two Byzantine missionaries, Cyril and Methodius, created an alphabet for Slavic languages in the 800s. Their followers developed it into the Cyrillic alphabet, still used in Russian, Ukrainian, Serbian and Bulgarian.<\/p>", "example": {"title": "Explain how the Byzantine Empire survived nearly a thousand years after the west fell.", "steps": [{"text": "Its capital, Constantinople, was protected by water on three sides and massive walls on the fourth.", "why": "Attackers could rarely take the city. Losing provinces did not mean losing the empire, as long as the capital held.", "uses": []}, {"text": "The east was richer than the west, with more cities and trade.", "why": "Money paid for armies and fleets, and could buy off enemies.", "uses": ["fall-of-rome"]}, {"text": "The empire had a strong government and one shared faith.", "why": "The emperor led both the state and the Orthodox Church, which helped hold the empire together.", "uses": ["christianity"]}, {"text": "When Constantinople finally fell in 1453, it was to an enemy with huge cannons.", "why": "New technology broke the walls that had protected the city for a thousand years.", "uses": []}]}, "practice": {"q": "Why do some historians say the Roman Empire did not really end until 1453?", "answer": "The Byzantine Empire was the eastern half of the Roman Empire, not a new state. Its rulers were Roman emperors, its people called themselves Romans, and it kept Roman law. Only the western half fell in 476, so the Roman Empire, in this view, ended when the Ottomans captured Constantinople in 1453."}, "stub": false}, {"id": "islam", "title": "The rise of Islam", "prereqs": ["christianity"], "big": "In the 600s CE, Muhammad, a merchant from Mecca in Arabia, preached a new monotheistic religion, Islam, which united the Arab peoples and became one of the world's great religions.", "recap": "Islam began in Arabia in the early 600s CE, when Muhammad began preaching that there is only one God. Muslims believe God revealed the Quran to him. He moved to Medina in 622, then returned to take Mecca in 630, and by his death in 632 most of Arabia had accepted Islam. Muslims follow the Five Pillars. Islam shares many prophets with Judaism and Christianity. A dispute over who should lead after Muhammad later split Muslims into Sunni and Shia.", "check": {"q": "Which statement about early Islam is correct?", "options": ["Muhammad preached that there is one God, the same God worshiped by Jews and Christians.", "Islam began in Egypt around 100 CE.", "Muslims believe Muhammad was God.", "Islam teaches that Abraham and Moses were not prophets."], "answer": 0, "why": "Islam is monotheistic and teaches that God is the God of Abraham, also worshiped by Jews and Christians. It began in Arabia in the 600s. Muslims see Muhammad as a human prophet, the last of many, including Abraham, Moses and Jesus."}, "body": "<h2>Arabia before Islam<\/h2>\n<p>Arabia is a large desert peninsula. Most Arabs were nomadic herders, living in tribes that often fought one another. Some lived in trading towns along the caravan routes.<\/p>\n<p>One such town was Mecca. It was a trading center and a place of pilgrimage. At its heart stood the Kaaba, a cube-shaped shrine then filled with statues of many gods.<\/p>\n<h2>Muhammad<\/h2>\n<p>Muhammad was born in Mecca around 570 CE and became a merchant.<button class=\"fn\" data-g=\"n_muhammad_sources\" aria-label=\"Note 1\">1<\/button> Muslims believe that around 610, when he was about 40, the angel Gabriel brought him the first of many messages from God. These messages were later collected as the <button class=\"term\" data-g=\"quran\">Quran<\/button>, the holy book of Islam.<\/p>\n<p>Muhammad preached that there is only one God, Allah in Arabic, and that all people are equal before God. He told the rich to care for the poor. Many of Mecca's leaders saw this as a threat to their gods, their pilgrim trade and their power.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Year<\/th><th>Event<\/th><\/tr><\/thead><tbody><tr><td>about 610<\/td><td>Muhammad begins preaching in Mecca<\/td><\/tr><tr><td>622<\/td><td>Facing danger, he and his followers move to the town of Medina. This journey is the <button class=\"term\" data-g=\"hijra\">Hijra<\/button><\/td><\/tr><tr><td>630<\/td><td>Muhammad returns with an army and takes Mecca peacefully. The statues are removed from the Kaaba<\/td><\/tr><tr><td>632<\/td><td>Muhammad dies. Most of Arabia has accepted Islam<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the Hijra is so important that the Islamic calendar counts its years from 622.<\/em><\/p>\n<h2>What Muslims believe<\/h2>\n<p>\"Islam\" means submission to God. A follower is a Muslim, \"one who submits.\" Muslims see Muhammad as a human <button class=\"term\" data-g=\"prophet\">prophet<\/button>, the last in a line that includes Abraham, Moses and Jesus. That is why the Quran calls Jews and Christians \"People of the Book.\"<\/p>\n<p>The core duties of a Muslim are the <button class=\"term\" data-g=\"five-pillars\">Five Pillars<\/button>:<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Pillar<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Declaration of faith<\/td><td>\"There is no god but God, and Muhammad is the messenger of God\"<\/td><\/tr><tr><td>Prayer<\/td><td>Praying five times a day, facing Mecca<\/td><\/tr><tr><td>Charity<\/td><td>Giving a share of one's wealth to the poor<\/td><\/tr><tr><td>Fasting<\/td><td>Not eating or drinking from dawn to sunset in the month of Ramadan<\/td><\/tr><tr><td>Pilgrimage<\/td><td>Traveling to Mecca at least once in life, if able<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The split over leadership<\/h2>\n<p>Muhammad left no agreed successor. Most Muslims accepted leaders chosen by the community. A smaller group believed leadership belonged to Muhammad's family, through his cousin and son-in-law, Ali. This disagreement led, over time, to the two main branches of Islam, <button class=\"term\" data-g=\"sunni-shia\">Sunni and Shia<\/button>. Today most Muslims are Sunni.<\/p>", "example": {"title": "Explain how Islam spread through Arabia in Muhammad's lifetime.", "steps": [{"text": "Muhammad preached one God and equality before God in Mecca from about 610.", "why": "His message attracted followers, especially among the poor, but threatened Mecca's leaders.", "uses": []}, {"text": "In 622 he moved to Medina, where he became both religious leader and ruler.", "why": "In Medina, Islam became a community with its own laws and army, not just a set of beliefs.", "uses": []}, {"text": "In 630 he took Mecca and cleared the Kaaba of its statues.", "why": "Mecca was Arabia's main religious center. Winning it showed Islam's strength.", "uses": []}, {"text": "By his death in 632, most Arab tribes had joined.", "why": "Islam gave feuding tribes one faith and one community, which united Arabia for the first time.", "uses": []}]}, "practice": {"q": "Why do Muslims call Jews and Christians \"People of the Book\"?", "answer": "Islam teaches that the same one God sent earlier messages to Jews and Christians through prophets such as Abraham, Moses and Jesus, and that these messages were written down in scriptures. So Muslims see Jews and Christians as fellow believers in God who received earlier revelations, while believing the Quran is God's final message."}, "stub": false}, {"id": "islamic-caliphates", "title": "The Islamic caliphates", "prereqs": ["islam", "byzantine-empire"], "big": "Within a century of Muhammad's death, Muslim rulers called caliphs built an empire from Spain to India, and under the Abbasids, Baghdad became a world center of learning.", "recap": "After Muhammad died in 632, his successors, the caliphs, led Arab armies that took Persia and much of the Byzantine Empire. The Umayyad caliphs, ruling from Damascus, stretched the empire from Spain to India by about 750. The Abbasid caliphs moved the capital to Baghdad, where scholars translated Greek, Persian and Indian works and made advances in mathematics, medicine and science. The caliphate later broke into rival states, and the Mongols destroyed Baghdad in 1258.", "check": {"q": "What happened at the House of Wisdom in Baghdad?", "options": ["Scholars translated and built on Greek, Persian and Indian learning.", "The caliphs planned the conquest of China.", "Muhammad received the Quran.", "The Crusaders signed a peace treaty."], "answer": 0, "why": "Under the Abbasids, Baghdad's House of Wisdom gathered scholars who translated older works into Arabic and added discoveries of their own. The caliphate never conquered China, and Muhammad lived in Arabia long before Baghdad was founded."}, "body": "<h2>The caliphs<\/h2>\n<p>After Muhammad died in 632, the Muslim community chose a leader called the <button class=\"term\" data-g=\"caliph\">caliph<\/button>, meaning \"successor.\" The first four caliphs were close companions of Muhammad. The fourth was Ali.<\/p>\n<p>Arab armies burst out of Arabia. Both great empires next door, the Byzantines and the Persians, were exhausted from decades of fighting each other.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Dates<\/th><th>Rulers<\/th><th>Capital<\/th><th>What happened<\/th><\/tr><\/thead><tbody><tr><td>632 to 661<\/td><td>The first four caliphs<\/td><td>Medina, later Kufa<\/td><td>Arabs take Syria, Egypt and the whole Persian Empire<\/td><\/tr><tr><td>661 to 750<\/td><td>Umayyad caliphs<\/td><td>Damascus<\/td><td>The empire reaches from Spain to the borders of India<\/td><\/tr><tr><td>750 to 1258<\/td><td>Abbasid caliphs<\/td><td>Baghdad<\/td><td>A golden age of trade and learning; real power slowly passes to local rulers<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: in about 100 years the caliphate became one of the largest empires the world had seen.<\/em><\/p>\n<h2>Ruling many peoples<\/h2>\n<p>At first most people in the conquered lands were not Muslims. Christians and Jews were usually allowed to keep their faith, as \"People of the Book,\" if they paid a special tax called the <button class=\"term\" data-g=\"jizya\">jizya<\/button>. They were protected but had fewer rights than Muslims. Over centuries, most people in these lands became Muslims and many came to speak Arabic.<\/p>\n<h2>Baghdad's golden age<\/h2>\n<p>The Abbasids built a new capital, Baghdad, in 762. It became one of the largest and richest cities in the world. Goods arrived from China, India, Africa and Europe.<\/p>\n<p>The caliphs paid scholars to translate books from Greek, Persian and Sanskrit into Arabic. A center called the House of Wisdom became famous for this work. Scholars across the Islamic world built on it.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Field<\/th><th>Achievement<\/th><\/tr><\/thead><tbody><tr><td>Mathematics<\/td><td>Al-Khwarizmi wrote the book that gave us the word \"algebra.\" The word \"algorithm\" comes from his name<\/td><\/tr><tr><td>Numbers<\/td><td>Scholars adopted Indian numerals, which later reached Europe as \"Arabic numerals\"<\/td><\/tr><tr><td>Medicine<\/td><td>Ibn Sina (Avicenna), a Persian scholar, wrote a medical encyclopedia used in European universities for centuries<\/td><\/tr><tr><td>Paper<\/td><td>Papermaking spread from China into the Islamic world, and Baghdad had paper mills by about 800<button class=\"fn\" data-g=\"n_paper\" aria-label=\"Note 1\">1<\/button><\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: much of this was building on older Greek, Persian and Indian learning. When Europeans later recovered Greek works, many came through Arabic translations.<\/em><\/p>\n<h2>Breaking apart<\/h2>\n<p>The empire was too large to hold together. In 756 a surviving Umayyad prince set up his own state in Spain, at Córdoba. Later, rival caliphs ruled Egypt and Spain. Turkish soldiers took real power in Baghdad, leaving the caliph as a figurehead. In 1258 the Mongols sacked Baghdad and killed the last Abbasid caliph there.<\/p>", "example": {"title": "Explain why the early Arab conquests were so fast.", "steps": [{"text": "The Byzantine and Persian empires had just fought a long, exhausting war against each other.", "why": "Both neighbors were weak, short of money and soldiers, at the moment the Arabs attacked.", "uses": ["byzantine-empire"]}, {"text": "Islam had united the Arab tribes under one leader.", "why": "Tribes that once fought each other now fought together, with a shared purpose.", "uses": ["islam"]}, {"text": "Many conquered people were allowed to keep their religion if they paid a tax.", "why": "Some subjects, unhappy with their old rulers, did not resist hard, because life under the new rulers could be no worse.", "uses": []}]}, "practice": {"q": "How did the Islamic caliphates help preserve ancient Greek learning?", "answer": "Abbasid caliphs paid scholars, especially at the House of Wisdom in Baghdad, to translate Greek works on philosophy, science and medicine into Arabic. Muslim scholars studied, used and added to these works. Centuries later, Europeans translated many of them from Arabic into Latin, recovering knowledge that had been lost in the west."}, "stub": false}, {"id": "feudalism", "title": "Medieval Europe and feudalism", "prereqs": ["fall-of-rome"], "big": "After Rome fell, western Europe broke into small kingdoms where power rested on land, loyalty and the Church, in a system later called feudalism.", "recap": "After the western Roman Empire fell, western Europe split into small kingdoms, often attacked by Vikings and other raiders. Kings gave land to lords in return for military service, and lords did the same for knights. Most people were peasants, many of them serfs bound to a lord's manor. The Roman Catholic Church, led by the pope, was the one institution that reached everywhere and kept learning alive in monasteries. Historians call this period the Middle Ages, from about 500 to 1500.", "check": {"q": "What was the basic deal at the heart of feudalism?", "options": ["A lord gave land to a vassal, and the vassal promised loyalty and military service.", "Peasants elected their lords every year.", "The king paid every soldier a salary from taxes.", "Merchants ruled cities and hired armies."], "answer": 0, "why": "Feudalism was built on land in exchange for service. Kings had little money for salaries, so they paid in land. Peasants did not elect their lords, and merchant-run cities came later."}, "body": "<h2>After Rome<\/h2>\n<p>Without Rome, western Europe became poorer and more dangerous. Roads decayed, trade shrank and cities emptied. Germanic peoples set up their own kingdoms. Historians call the time from about 500 to 1500 the Middle Ages, or medieval period, because it sits in the middle between ancient Rome and modern times.<\/p>\n<p>The strongest of the new kingdoms was that of the Franks. Their king Charlemagne ruled much of western Europe, and on Christmas Day in 800 the <button class=\"term\" data-g=\"pope\">pope<\/button> crowned him emperor. After he died, his empire was divided among his grandsons.<\/p>\n<p>Then came new raiders. From the late 700s, Vikings from Scandinavia attacked coasts and rivers in fast longships. Magyars raided from the east and Muslim pirates from the south.<\/p>\n<h2>Land for loyalty<\/h2>\n<p>Kings could not defend every village, and they had little money to pay soldiers. What they had was land. So a system grew up that historians later called feudalism.<button class=\"fn\" data-g=\"n_feudalism_word\" aria-label=\"Note 1\">1<\/button><\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Who<\/th><th>Gave<\/th><th>Got<\/th><\/tr><\/thead><tbody><tr><td>King<\/td><td>Large grants of land to great lords<\/td><td>Their loyalty and soldiers in war<\/td><\/tr><tr><td>Lord<\/td><td>Smaller pieces of land to <button class=\"term\" data-g=\"knight\">knights<\/button><\/td><td>Their service as fighters on horseback<\/td><\/tr><tr><td>Knight<\/td><td>Protection to the peasants on his land<\/td><td>Their labor and part of their crops<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A person who received land was a <button class=\"term\" data-g=\"vassal\">vassal<\/button>, and the land was a <button class=\"term\" data-g=\"fief\">fief<\/button>. Many people were both: a lord could be the vassal of a greater lord.<\/p>\n<h2>Life on the manor<\/h2>\n<p>Most people were peasants who farmed. Many were <button class=\"term\" data-g=\"serf\">serfs<\/button>, who could not leave the land without their lord's permission. They worked his fields as well as their own, and paid him part of their harvest. In return they got a plot of land and protection.<\/p>\n<p>The basic unit was the <button class=\"term\" data-g=\"manor\">manor<\/button>: the lord's house, the village, the fields, a mill and a church. A manor produced almost everything it needed.<\/p>\n<h2>The Church<\/h2>\n<p>One institution reached across all of western Europe: the Roman Catholic Church. Its head, the pope, lived in Rome. Every village had a priest, and the Church taught that salvation came through its sacraments.<\/p>\n<p>Monasteries were communities of monks who lived by strict rules of prayer and work. Monks copied books by hand and kept reading and writing alive when few others could. The Church also owned huge amounts of land and was very powerful.<\/p>\n<p class=\"cap\"><em>Notice: kings, lords and the Church often competed for power. Popes and kings argued over who had the right to choose bishops.<\/em><\/p>", "example": {"title": "Explain why feudalism grew up in western Europe after Rome fell.", "steps": [{"text": "Rome's fall left western Europe without a strong central government.", "why": "No one could raise taxes or keep a large paid army across a wide area.", "uses": ["fall-of-rome"]}, {"text": "Raiders such as the Vikings attacked suddenly and moved fast.", "why": "Defense had to be local. Help from a distant king came too late.", "uses": []}, {"text": "Kings had land but little money, so they paid warriors with land.", "why": "This created the chain of lords, vassals and knights, each bound by loyalty.", "uses": []}, {"text": "Peasants accepted serfdom in return for protection.", "why": "In a dangerous world, safety mattered more than freedom.", "uses": []}]}, "practice": {"q": "Why was the Church so powerful in medieval Europe?", "answer": "It was the one institution that reached every part of western Europe, with a priest in every village and a single leader, the pope. People believed it controlled the path to salvation. It owned vast lands, and its monks and clergy were among the few people who could read and write, so kings needed them to run their governments."}, "stub": false}, {"id": "crusades", "title": "The Crusades", "prereqs": ["islamic-caliphates", "feudalism"], "big": "From 1095 to 1291, western European Christians launched a series of holy wars to capture Jerusalem and the Holy Land from Muslim rulers.", "recap": "In 1095 Pope Urban II called on western Christians to help the Byzantine Empire against the Seljuk Turks and to capture Jerusalem. The First Crusade took Jerusalem in 1099 and set up crusader states. The Muslim leader Saladin retook Jerusalem in 1187, and later crusades failed to win it back for long. The Fourth Crusade sacked Christian Constantinople in 1204. The last crusader city, Acre, fell in 1291. The Crusades increased trade with the east but deepened hostility between Christians, Muslims and Jews.", "check": {"q": "What was the main goal of the Crusades?", "options": ["To capture Jerusalem and the Holy Land from Muslim rulers.", "To convert the Mongols to Christianity.", "To conquer Spain from the Vikings.", "To stop the Black Death."], "answer": 0, "why": "The Crusades were wars to win and hold Jerusalem and the lands around it, holy to Christians. The Mongols, Vikings and the Black Death were not their targets."}, "body": "<h2>The call<\/h2>\n<p>In the 1000s the Seljuk Turks, Muslim newcomers from Central Asia, took over much of the Middle East. In 1071 they defeated the Byzantines and moved into Anatolia. They also controlled Jerusalem, the city where Jesus died, which Christians saw as holy.<\/p>\n<p>The Byzantine emperor asked the pope for soldiers. In 1095 Pope Urban II gave a famous speech in France. He called on knights to free Jerusalem, promising that their sins would be forgiven. Crowds answered \"God wills it!\"<\/p>\n<p>A <button class=\"term\" data-g=\"crusade\">crusade<\/button> was a war that the pope declared holy. Crusaders sewed a cloth cross on their clothes. Some went out of faith, some for land, wealth or adventure, and many for all of these.<\/p>\n<h2>The main crusades<\/h2>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Dates<\/th><th>Crusade<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>1096 to 1099<\/td><td>First<\/td><td>Crusaders take Jerusalem and kill many of its Muslim and Jewish people. They set up four crusader states<\/td><\/tr><tr><td>1147 to 1149<\/td><td>Second<\/td><td>Fails<\/td><\/tr><tr><td>1187<\/td><td>—<\/td><td>Saladin, sultan of Egypt and Syria, crushes the crusaders and retakes Jerusalem<\/td><\/tr><tr><td>1189 to 1192<\/td><td>Third<\/td><td>Led by kings of England and France and the German emperor. Wins back some coast but not Jerusalem<\/td><\/tr><tr><td>1202 to 1204<\/td><td>Fourth<\/td><td>Never reaches the Holy Land. Sacks Christian Constantinople instead<\/td><\/tr><tr><td>1291<\/td><td>—<\/td><td>Acre, the last crusader city, falls to the Mamluks of Egypt<\/td><\/tr><\/tbody><\/table><\/div>\n<p><em>Notice: after the first, almost every crusade failed. The numbering was added by later historians, and many smaller crusades are left out.<\/em><button class=\"fn\" data-g=\"n_crusade_numbers\" aria-label=\"Note 1\">1<\/button><\/p>\n<h2>Who suffered<\/h2>\n<p>The Crusades were violent for many people, not only soldiers.<\/p>\n<ul><li>Muslims and Jews in Jerusalem were massacred in 1099.<\/li><li>On their way east in 1096, crusader bands attacked Jewish communities in the Rhineland, in Germany, killing thousands.<\/li><li>The sack of Constantinople in 1204 left a lasting bitterness between Catholic and Orthodox Christians.<\/li><\/ul>\n<h2>Effects<\/h2>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Area<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td>Trade<\/td><td>Italian cities such as Venice and Genoa grew rich carrying crusaders and trading for eastern spices and silk<\/td><\/tr><tr><td>Kings<\/td><td>Many troublesome nobles left or died abroad, which helped some kings increase their power<\/td><\/tr><tr><td>Ideas<\/td><td>Contact with the Muslim world added to the flow of learning into Europe, though more came through Spain and Sicily<\/td><\/tr><tr><td>Relations<\/td><td>Distrust between Christians and Muslims, and between western and eastern Christians, grew deeper<\/td><\/tr><\/tbody><\/table><\/div>", "example": {"title": "Explain why Pope Urban II's call in 1095 drew so many people.", "steps": [{"text": "Western Europe was full of knights trained only to fight.", "why": "Feudal society produced warriors. The crusade gave them a holy cause and a place to go.", "uses": ["feudalism"]}, {"text": "The pope promised that crusaders' sins would be forgiven.", "why": "In a deeply religious age, this was a powerful reward. The Church's reach meant the message spread everywhere.", "uses": ["feudalism"]}, {"text": "Jerusalem was held by Muslim rulers, and the Seljuk Turks were pressing the Byzantines.", "why": "Christians saw the Holy Land as theirs, and the Byzantine request gave a reason to act.", "uses": ["islamic-caliphates"]}, {"text": "Younger sons with no land to inherit hoped to win land and wealth.", "why": "Practical motives mixed with faith. Most people had more than one reason.", "uses": []}]}, "practice": {"q": "Why did the Fourth Crusade attack Constantinople, a Christian city?", "answer": "The crusaders could not pay Venice for the ships it had built them, so they agreed to help Venice and to back a claimant to the Byzantine throne in return for money. When that deal fell apart, they attacked and looted the city in 1204. Greed, debt and old distrust between western and eastern Christians turned the crusade against fellow Christians."}, "stub": false}, {"id": "tang-song-china", "title": "Tang and Song China", "prereqs": ["qin-han-china", "buddhism"], "big": "Under the Tang (618 to 907) and Song (960 to 1279) dynasties, China was probably the richest and most inventive society in the world, giving it printing, gunpowder, the magnetic compass and paper money.", "recap": "After centuries of division, China was reunited and ruled by the Tang dynasty from 618 to 907, then the Song dynasty from 960 to 1279. The Tang capital, Chang'an, was one of the largest cities on earth, and Buddhism and poetry flourished. The Song chose officials by written exams, grew new rice that fed a booming population, and invented or spread movable type, gunpowder weapons, the magnetic compass for ships and paper money. The Mongols conquered the Song in 1279.", "check": {"q": "How did the Song dynasty mostly choose its government officials?", "options": ["Through written exams on Confucian books.", "By birth into noble families only.", "By election in each province.", "By buying positions from the emperor."], "answer": 0, "why": "The Song made the civil service exams the main road into government, though wealthy families still had an advantage because they could pay for years of study. China had no elections, and noble birth mattered less than it had before."}, "body": "<h2>China reunited<\/h2>\n<p>After the Han dynasty fell in 220 CE, China was divided for more than 350 years. The short-lived Sui dynasty reunited it in 589 and built the Grand Canal, linking north and south by water. Then came two great dynasties.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Dynasty<\/th><th>Dates<\/th><th>Capital<\/th><\/tr><\/thead><tbody><tr><td>Tang<\/td><td>618 to 907<\/td><td>Chang'an (today Xi'an)<\/td><\/tr><tr><td>Song<\/td><td>960 to 1279<\/td><td>Kaifeng, then Hangzhou after 1127<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>The Tang: an open empire<\/h2>\n<p>The Tang reached deep into Central Asia and controlled much of the Silk Roads. Chang'an had perhaps a million people. Merchants, monks and envoys came from Persia, India, Korea and Japan.<\/p>\n<p>Buddhism, which had come from India, reached its height. Poets such as Li Bai and Du Fu wrote verses still learned by Chinese schoolchildren. Wu Zetian ruled as emperor from 690 to 705, the only woman in Chinese history to do so in her own name.<\/p>\n<p>A great rebellion from 755 to 763 badly weakened the dynasty, and it collapsed in 907.<\/p>\n<h2>The Song: a world of invention<\/h2>\n<p>The Song never matched the Tang's military power. Nomad peoples took the north, and in 1127 the Song court fled south to Hangzhou. But at home Song China boomed.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Field<\/th><th>What happened<\/th><\/tr><\/thead><tbody><tr><td>Government<\/td><td>Officials were chosen mainly by <button class=\"term\" data-g=\"civil-service-exam\">civil service exams<\/button> on Confucian classics<\/td><\/tr><tr><td>Farming<\/td><td>A fast-ripening rice from Southeast Asia allowed two harvests a year. The population roughly doubled, to about 100 million<\/td><\/tr><tr><td>Printing<\/td><td>Woodblock printing, already used under the Tang, spread widely, and Bi Sheng invented <button class=\"term\" data-g=\"movable-type\">movable type<\/button> in the 1040s<button class=\"fn\" data-g=\"n_printing\" aria-label=\"Note 1\">1<\/button><\/td><\/tr><tr><td>Weapons<\/td><td><button class=\"term\" data-g=\"gunpowder\">Gunpowder<\/button>, discovered under the Tang, was used in fire arrows, bombs and early guns<\/td><\/tr><tr><td>Navigation<\/td><td>Sailors used the magnetic compass to steer at sea<\/td><\/tr><tr><td>Money<\/td><td>The government issued paper money, the first in the world<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: many of these inventions later reached Europe and changed it. Printing, gunpowder and the compass helped launch Europe's own age of change after 1450.<\/em><\/p>\n<h2>Confucian revival<\/h2>\n<p>Song scholars renewed Confucian thought, blending in ideas from Buddhism and Daoism. This \"Neo-Confucianism\" shaped Chinese government and family life for the next 700 years.<\/p>", "example": {"title": "Explain why Song China's population grew so fast.", "steps": [{"text": "A fast-ripening rice from Southeast Asia arrived around 1012.", "why": "Farmers in the warm south could grow two crops a year on the same land.", "uses": []}, {"text": "The government spread the new seed and printed farming guides.", "why": "Printing let useful knowledge travel quickly to many farmers.", "uses": []}, {"text": "Canals and a growing trade network moved food from the south to the cities.", "why": "More food could reach more people, so cities grew too.", "uses": ["qin-han-china"]}, {"text": "The population roughly doubled, to about 100 million.", "why": "This was the result: more food supported more people.", "uses": []}]}, "practice": {"q": "Why do historians call the Song dynasty an age of invention, even though it was militarily weak?", "answer": "The Song lost northern China to nomad invaders, but its economy, cities and learning flourished. It made movable type, gunpowder weapons, the ship's compass and paper money part of everyday life, and new rice doubled its population. Military weakness did not stop it from being one of the richest and most advanced societies in the world."}, "stub": false}, {"id": "mongol-empire", "title": "The Mongol Empire", "prereqs": ["silk-roads", "tang-song-china"], "big": "In the 1200s the Mongols, nomads from the steppes of Central Asia, built the largest land empire in history, killing millions but also linking Asia and Europe by trade.", "recap": "In 1206 Temujin united the Mongol tribes and took the title Genghis Khan. His horse archers conquered northern China and Central Asia, and his successors took Russia, Persia and Baghdad, which they sacked in 1258. Kublai Khan conquered Song China in 1279. The empire, the largest land empire ever, soon split into four khanates. The conquests were terribly destructive, but the Mongol peace that followed made the Silk Roads safer than ever, helping goods, ideas and, later, disease to travel.", "check": {"q": "What was one important result of the Mongol Empire for trade?", "options": ["It made the Silk Roads safer, so trade between Asia and Europe grew.", "It closed all trade between China and Europe.", "It moved all trade to the Atlantic Ocean.", "It ended the use of camels in trade."], "answer": 0, "why": "Once the conquests were over, the Mongols protected merchants and travelers across their huge empire. This \"Mongol peace\" made overland trade between China and Europe easier than ever before."}, "body": "<h2>Nomads of the steppe<\/h2>\n<p>The steppe is a vast belt of grassland stretching across Central Asia. The Mongols who lived there were <button class=\"term\" data-g=\"nomad\">nomads<\/button>, moving with their herds of horses, sheep and goats. Children learned to ride almost before they could walk. Every man was a mounted archer.<\/p>\n<h2>Genghis Khan<\/h2>\n<p>A Mongol chief named Temujin spent years uniting the warring tribes. In 1206 they proclaimed him Genghis Khan, meaning roughly \"universal ruler.\" A <button class=\"term\" data-g=\"khan\">khan<\/button> is a ruler.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Mongol strength<\/th><th>Why it worked<\/th><\/tr><\/thead><tbody><tr><td>Speed<\/td><td>Each rider had several horses, so armies could cover huge distances fast<\/td><\/tr><tr><td>Discipline<\/td><td>Soldiers were organized in units of 10, 100, 1,000 and 10,000<\/td><\/tr><tr><td>Terror<\/td><td>Cities that resisted were often destroyed and their people killed, so others surrendered<\/td><\/tr><tr><td>Learning<\/td><td>The Mongols hired Chinese and Persian engineers to build siege weapons<\/td><\/tr><\/tbody><\/table><\/div>\n<p>He died in 1227, after conquering northern China and Central Asia.<\/p>\n<h2>The largest land empire<\/h2>\n<p>His sons and grandsons kept going.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Year<\/th><th>Event<\/th><\/tr><\/thead><tbody><tr><td>1240<\/td><td>Mongols destroy Kiev and rule the Russian lands<\/td><\/tr><tr><td>1241<\/td><td>They defeat armies in Poland and Hungary, then turn back, probably because the Great Khan had died<\/td><\/tr><tr><td>1258<\/td><td>They sack Baghdad and kill the caliph<\/td><\/tr><tr><td>1279<\/td><td>Kublai Khan, Genghis's grandson, completes the conquest of Song China and founds the Yuan dynasty<\/td><\/tr><tr><td>1274, 1281<\/td><td>Attempts to invade Japan fail, partly because of storms<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: at its height the empire stretched from Korea to Hungary. No land empire has been larger.<\/em><\/p>\n<p>The conquests killed millions of people.<button class=\"fn\" data-g=\"n_mongol_deaths\" aria-label=\"Note 1\">1<\/button> Some regions, such as parts of Persia, took centuries to recover.<\/p>\n<h2>Four khanates<\/h2>\n<p>The empire was too big for one ruler. By the 1260s it had split into four <button class=\"term\" data-g=\"khanate\">khanates<\/button>: the Golden Horde in Russia, the Ilkhanate in Persia, the Chagatai Khanate in Central Asia, and the Yuan dynasty in China.<\/p>\n<h2>The Mongol peace<\/h2>\n<p>Once the fighting stopped, the Mongols wanted trade and taxes. They protected merchants, built relay stations with fresh horses for messengers, and allowed many religions. Historians call this the Pax Mongolica, the \"Mongol peace.\"<\/p>\n<p>Travelers crossed Asia in safety. The Venetian Marco Polo said he served Kublai Khan for years.<button class=\"fn\" data-g=\"n_marco_polo\" aria-label=\"Note 2\">2<\/button> Chinese inventions, Persian astronomy and new foods moved along the routes. So, in the 1340s, did the plague.<\/p>", "example": {"title": "Explain how a nomad people with a small population conquered such huge settled empires.", "steps": [{"text": "Mongol horse archers moved faster than any army they faced.", "why": "Speed let them surprise enemies and choose where to fight.", "uses": []}, {"text": "Genghis Khan organized his army by strict units and promoted men by ability.", "why": "Discipline made a tribal force into a professional army.", "uses": []}, {"text": "They destroyed cities that resisted.", "why": "Fear made many cities surrender without a fight.", "uses": []}, {"text": "They hired engineers from conquered peoples, such as the Chinese and Persians.", "why": "Siege weapons let nomads take walled cities, which they could not do at first.", "uses": ["tang-song-china"]}]}, "practice": {"q": "How did the Mongol Empire both harm and help trade along the Silk Roads?", "answer": "The conquests destroyed cities, killed millions and wrecked farmland, which hurt trade at first. But afterward the Mongols ruled almost the whole route under one power. They protected merchants, kept roads safe and welcomed traders of all religions, so for about a century trade between China and Europe grew easier than ever before."}, "stub": false}, {"id": "black-death", "title": "The Black Death", "prereqs": ["mongol-empire", "feudalism"], "big": "In the late 1340s a plague spread from Central Asia along trade routes and killed perhaps a third to a half of Europe's people, shaking the medieval world.", "recap": "The Black Death was an outbreak of plague, caused by a bacterium carried by fleas on rats and other animals. It spread from Central Asia along Mongol-era trade routes, reached Europe in 1347 and killed perhaps a third to a half of Europe's people by 1351. It also struck the Middle East and North Africa. With so many dead, workers became scarce, so survivors could demand higher wages, and serfdom weakened in western Europe. Fear also led to attacks on Jews and to doubts about the Church.", "check": {"q": "Why did wages rise in western Europe after the Black Death?", "options": ["So many workers died that the survivors were scarce and could demand more.", "Kings ordered higher wages to celebrate the plague's end.", "The Church paid every peasant a salary.", "New machines made work more valuable."], "answer": 0, "why": "The plague killed so many people that there were not enough workers to farm the land. Lords competed for laborers, so wages rose, even though some kings passed laws trying to hold them down."}, "body": "<h2>A disease on the move<\/h2>\n<p>The Black Death was <button class=\"term\" data-g=\"plague\">plague<\/button>, a disease caused by bacteria. Fleas carried it, living on rats and other animals, and bit humans. Victims got fever and painful black swellings, and most died within days.<\/p>\n<p>The plague started in Central Asia in the 1330s. It moved west along the busy trade routes of the Mongol world.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Year<\/th><th>Where the plague struck<\/th><\/tr><\/thead><tbody><tr><td>1346<\/td><td>The Black Sea port of Caffa, under siege by a Mongol army<button class=\"fn\" data-g=\"n_caffa\" aria-label=\"Note 1\">1<\/button><\/td><\/tr><tr><td>1347<\/td><td>Italian ships carry it to Sicily, then Constantinople and Egypt<\/td><\/tr><tr><td>1348<\/td><td>Italy, France, Spain and England<\/td><\/tr><tr><td>1349 to 1351<\/td><td>Northern Europe and Russia<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: the same trade routes that the Mongol peace made safe carried the disease fast and far.<\/em><\/p>\n<h2>How many died<\/h2>\n<p>No one counted, so all numbers are estimates. Historians think that between 1347 and 1351 the plague killed between a third and a half of Europe's people, perhaps 25 to 50 million. Some towns lost more than half their people. It killed huge numbers in the Middle East and North Africa too. Plague returned again and again for centuries after.<\/p>\n<h2>How people reacted<\/h2>\n<p>No one knew what caused the plague. People blamed bad air, the position of the stars, or God's anger at sin.<\/p>\n<ul><li>Some groups, the flagellants, marched from town to town whipping themselves to beg for God's mercy.<\/li><li>In many towns, Jews were falsely accused of poisoning wells. Thousands were murdered, for example in Strasbourg in 1349.<\/li><li>Priests died at the same rate as everyone else, and prayers did not stop the dying. Some people began to doubt the Church.<\/li><\/ul>\n<h2>A changed society<\/h2>\n<p>The plague hit the feudal system hard.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Before the plague<\/th><th>After the plague<\/th><\/tr><\/thead><tbody><tr><td>Many peasants, not enough land<\/td><td>Plenty of land, not enough peasants<\/td><\/tr><tr><td>Lords could demand work from serfs<\/td><td>Workers could move to whoever paid most<\/td><\/tr><tr><td>Low wages<\/td><td>Wages rose, despite laws trying to stop them<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Lords tried to force workers back. In England a law of 1351 fixed wages at pre-plague levels, and anger over this and new taxes led to the Peasants' Revolt of 1381. The revolt was crushed, but over the next century serfdom faded away in western Europe.<\/p>\n<p class=\"cap\"><em>Notice: by killing so many, the plague gave the survivors more bargaining power.<\/em><\/p>", "example": {"title": "Trace how the Mongol Empire helped bring plague to Europe.", "steps": [{"text": "The Mongols ruled most of the route from China to the Black Sea.", "why": "One power made long-distance travel and trade safe and frequent.", "uses": ["mongol-empire"]}, {"text": "Plague broke out in Central Asia in the 1330s.", "why": "It entered a region crossed by busy trade routes.", "uses": []}, {"text": "Caravans and armies carried infected fleas and rats west to the Black Sea ports.", "why": "Trade goods and food stores sheltered rats and fleas on the journey.", "uses": ["silk-roads"]}, {"text": "Italian merchant ships carried the plague from the Black Sea into the Mediterranean in 1347.", "why": "Sea trade spread it to Europe's ports and from there inland.", "uses": []}]}, "practice": {"q": "How did the Black Death help weaken serfdom in western Europe?", "answer": "It killed so many peasants that lords had too few workers for their land. Survivors could demand higher wages or leave for lords who offered better terms. Laws trying to freeze wages and force people back to work failed and led to revolts. Over the following century, lords had to free serfs or turn them into paid workers and tenants."}, "stub": false}, {"id": "indian-ocean-trade", "title": "Indian Ocean trade", "prereqs": ["islamic-caliphates", "tang-song-china"], "big": "For centuries before Europeans arrived, the Indian Ocean was the world's busiest trading sea, linking East Africa, Arabia, India, Southeast Asia and China, and its sailors relied on the regular monsoon winds.", "recap": "The monsoon winds blow from the southwest in summer and the northeast in winter, so sailors could cross the Indian Ocean and return within a year. Muslim, Indian, Chinese and Malay merchants traded spices, cotton cloth, porcelain, silk, gold and ivory. Port cities grew rich, including the Swahili cities of East Africa and Malacca in Southeast Asia. Merchants spread Islam to East Africa and Southeast Asia. In the early 1400s, the Chinese admiral Zheng He led huge fleets as far as Africa.", "check": {"q": "Why were the monsoon winds so important for Indian Ocean trade?", "options": ["They change direction with the seasons, so ships could sail out and come back each year.", "They blow in the same direction all year, so ships never needed to return.", "They stopped all ships from sailing in summer.", "They carried ships around Africa to Europe."], "answer": 0, "why": "The monsoon blows one way for about half the year and the other way for the rest. Sailors timed their voyages to sail out on one wind and return on the other."}, "body": "<h2>Winds that change with the seasons<\/h2>\n<p>The <button class=\"term\" data-g=\"monsoon\">monsoon<\/button> is a seasonal wind. Over the Indian Ocean it blows from the southwest from about April to September, and from the northeast from about November to March.<\/p>\n<p>Sailors learned to time their trips. A ship could sail from Arabia to India on the summer wind and come home on the winter wind. The pattern was so reliable that trade ran on a yearly schedule.<\/p>\n<p class=\"cap\"><em>Notice: unlike the Silk Roads, which crossed deserts and mountains, this was a sea route. Ships could carry far heavier loads, so bulky goods like cloth, timber and rice could be traded, not only luxuries.<\/em><\/p>\n<h2>Who traded what<\/h2>\n<p>No single empire controlled the ocean. Many peoples traded in stages, like a relay.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Region<\/th><th>Goods it sold<\/th><\/tr><\/thead><tbody><tr><td>East Africa<\/td><td>Gold, ivory, timber, enslaved people<\/td><\/tr><tr><td>Arabia and Persia<\/td><td>Horses, incense, dates<\/td><\/tr><tr><td>India<\/td><td>Pepper, cotton cloth, gems<\/td><\/tr><tr><td>Southeast Asia<\/td><td>Cloves, nutmeg and other spices<\/td><\/tr><tr><td>China<\/td><td>Silk, porcelain, iron goods<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Arab and Persian sailors used the <button class=\"term\" data-g=\"dhow\">dhow<\/button>, a ship with large triangular sails. Chinese merchants sailed large ships called junks.<\/p>\n<h2>Port cities<\/h2>\n<p>Trade made port cities rich.<\/p>\n<ul><li>On the East African coast, cities such as Kilwa and Mombasa grew wealthy. Their people developed the <button class=\"term\" data-g=\"swahili\">Swahili<\/button> language and culture, mixing African and Arab ways.<\/li><li>Calicut in southwest India was a great pepper market.<\/li><li>Malacca, on the narrow strait between Malaysia and Sumatra, controlled the passage between the Indian Ocean and the South China Sea. It became one of the busiest ports in the world in the 1400s.<\/li><\/ul>\n<h2>Islam follows trade<\/h2>\n<p>Many merchants were Muslims. They married local women, built mosques and won converts, often without any conquest. Islam spread this way to the Swahili coast and to Southeast Asia. Indonesia, reached largely through trade, has more Muslims today than any other country.<\/p>\n<h2>Zheng He's fleets<\/h2>\n<p>Between 1405 and 1433, the Chinese Ming dynasty sent the admiral Zheng He on seven great voyages. His fleets had hundreds of ships and tens of thousands of men, and some of his ships were very large.<button class=\"fn\" data-g=\"n_zheng_he\" aria-label=\"Note 1\">1<\/button> They reached India, Arabia and East Africa. Then the government stopped the voyages, and China turned inward.<\/p>\n<p class=\"cap\"><em>Notice: a few decades later, in 1498, a much smaller Portuguese fleet arrived in India. Europeans would soon fight to control this trade.<\/em><\/p>", "example": {"title": "Explain how a merchant could profit from the monsoon.", "steps": [{"text": "A merchant loads cotton cloth in India.", "why": "Indian cloth was wanted all around the ocean.", "uses": []}, {"text": "He sails west to East Africa on the winter northeast monsoon.", "why": "The wind carries him there quickly and reliably.", "uses": []}, {"text": "He trades the cloth for gold and ivory in a Swahili port such as Kilwa.", "why": "Each region sold what it had plenty of and bought what it lacked.", "uses": []}, {"text": "He waits for the summer southwest monsoon and sails home.", "why": "The wind reverses, so the round trip fits into one year.", "uses": []}]}, "practice": {"q": "How did Islam spread to Southeast Asia and East Africa without armies?", "answer": "Muslim merchants from Arabia, Persia and India traded in ports around the Indian Ocean. They settled, married local women, built mosques and formed communities. Local rulers and traders often converted, partly to share in the Muslim trading network. Over generations, Islam spread from the ports to the wider population."}, "stub": false}, {"id": "west-african-empires", "title": "Ghana, Mali, Songhai and trans-Saharan trade", "prereqs": ["islamic-caliphates"], "big": "From about 800 to 1600, three great empires in West Africa, Ghana, Mali and Songhai, grew rich by controlling the trade of gold and salt across the Sahara Desert.", "recap": "Camel caravans crossed the Sahara, carrying salt from the desert south and West African gold north. Three empires rose by controlling this trade. Ghana was strong by about 800. Mali, founded by Sundiata around 1235, reached its height under Mansa Musa, whose pilgrimage to Mecca in 1324 made him famous. Songhai, the largest, ruled from Gao until a Moroccan army with guns defeated it in 1591. Rulers and traders adopted Islam, and Timbuktu became a center of learning.", "check": {"q": "What two goods were at the heart of trans-Saharan trade?", "options": ["Gold from West Africa and salt from the Sahara.", "Silk from China and spices from India.", "Wheat from Egypt and wine from Italy.", "Furs from Russia and amber from the Baltic."], "answer": 0, "why": "West Africa had gold but little salt, and the Sahara had salt but no gold. Caravans traded one for the other, and the empires that controlled the trade grew rich."}, "body": "<h2>Gold for salt<\/h2>\n<p>The Sahara is the largest hot desert in the world. Crossing it took about two months. Camels, which can go many days without water, made regular crossings possible in the early centuries CE.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Region<\/th><th>Had plenty of<\/th><th>Needed<\/th><\/tr><\/thead><tbody><tr><td>West Africa, south of the Sahara<\/td><td>Gold<\/td><td>Salt, for health and to preserve food<\/td><\/tr><tr><td>The Sahara and North Africa<\/td><td>Salt, horses, cloth<\/td><td>Gold<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Merchants from North Africa crossed the desert in <button class=\"term\" data-g=\"caravan\">caravans<\/button> of hundreds or even thousands of camels. Many were Muslims, and over time they brought Islam, Arabic writing and new ideas south.<\/p>\n<h2>Ghana<\/h2>\n<p>The first great empire was Ghana. It has no link to the modern country of Ghana, which took its name later.<\/p>\n<p>By about 800, Ghana's kings controlled the trade routes. They taxed every load of salt coming in and gold going out. An Arab writer in 1068 described a king who sat in splendor among horses wearing gold cloth. Ghana declined in the 1100s.<\/p>\n<h2>Mali<\/h2>\n<p>Around 1235, a leader named Sundiata founded the empire of Mali. His story is still told by <button class=\"term\" data-g=\"griot\">griots<\/button>, West Africa's storytellers and keepers of history.<\/p>\n<p>Mali's most famous ruler was Mansa Musa, who ruled from about 1312 to 1337. <button class=\"term\" data-g=\"mansa\">Mansa<\/button> means king. A Muslim, he made the pilgrimage to Mecca in 1324 with a huge caravan carrying gold. In Cairo he gave away and spent so much gold that its value there fell for years. Europe and the Middle East heard of Mali's wealth.<button class=\"fn\" data-g=\"n_mansa_musa\" aria-label=\"Note 1\">1<\/button><\/p>\n<figure class=\"fig pic\" data-src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Catalan_Atlas_BNF_Sheet_6_Mansa_Musa_%28cropped%29.jpg?width=800\" data-page=\"https://commons.wikimedia.org/wiki/File:Catalan_Atlas_BNF_Sheet_6_Mansa_Musa_%28cropped%29.jpg\" data-alt=\"A painted map detail showing a crowned African king on a throne holding up a gold nugget\"><div class=\"picframe\"><\/div><figcaption>Mansa Musa on the Catalan Atlas, a map made in 1375. Notice the gold nugget he holds up: Europeans knew Mali above all for its gold.<span class=\"credit\">Image: Catalan Atlas, 1375, attributed to Abraham Cresques; public domain · <a href=\"https://commons.wikimedia.org/wiki/File:Catalan_Atlas_BNF_Sheet_6_Mansa_Musa_%28cropped%29.jpg\" target=\"_blank\" rel=\"noopener\">source<\/a><\/span><\/figcaption><\/figure>\n<p>He brought scholars and an architect home and built mosques. Under Mali, the city of Timbuktu grew into a center of trade and Islamic learning, with scholars and large collections of handwritten books.<\/p>\n<h2>Songhai<\/h2>\n<p>As Mali weakened, the Songhai people, based at Gao on the Niger River, built an even larger empire in the late 1400s. Its rulers took Timbuktu in 1468 and set up an organized government with an army and tax officials.<\/p>\n<p>In 1591 a Moroccan army armed with guns crossed the desert and defeated Songhai. The empire broke apart. By then, European ships were trading on Africa's west coast, and gold no longer had to cross the Sahara.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Empire<\/th><th>Height<\/th><th>Center<\/th><\/tr><\/thead><tbody><tr><td>Ghana<\/td><td>about 800 to 1050<\/td><td>Koumbi Saleh<\/td><\/tr><tr><td>Mali<\/td><td>about 1235 to 1400<\/td><td>Niani (its exact site is debated)<\/td><\/tr><tr><td>Songhai<\/td><td>about 1464 to 1591<\/td><td>Gao<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: each empire rose by taking control of the same trade. When the trade routes shifted, power shifted with them.<\/em><\/p>", "example": {"title": "Explain how Mali's rulers grew rich without mining gold themselves.", "steps": [{"text": "The gold fields lay to the south of Mali's main towns.", "why": "Mali did not need to dig the gold. It only needed to control where the gold went.", "uses": []}, {"text": "All gold heading north, and all salt heading south, passed through Mali's trading cities.", "why": "Mali sat between the gold fields and the desert routes.", "uses": []}, {"text": "The king taxed the goods passing through.", "why": "Every trade added to the king's wealth.", "uses": []}, {"text": "Accepting Islam helped Mali's rulers deal with Muslim merchants from the north.", "why": "Shared faith, law and writing built trust in long-distance trade.", "uses": ["islamic-caliphates"]}]}, "practice": {"q": "Why did trans-Saharan trade decline after about 1500?", "answer": "Portuguese and other European ships began trading directly along Africa's west coast, so gold and other goods could go by sea instead of crossing the desert. Then in 1591 a Moroccan army destroyed the Songhai Empire, which had kept the desert routes organized and safe. With the trade moving to the coast, the inland empires lost their main source of wealth."}, "stub": false}, {"id": "nationalism", "title": "Nationalism", "prereqs": [], "big": "Nationalism is the belief that a people who share a language, culture and history should rule themselves in their own country.", "recap": "<button class=\"term\" data-g=\"nationalism\">Nationalism<\/button> is the idea that each nation, a people sharing a language, culture and history, should have its own country and rule itself. It can join small states into one, or break a many-peoples empire apart.", "check": {"q": "Why was nationalism a danger to Austria-Hungary in 1914?", "options": ["It ruled many peoples, and some of them wanted their own states.", "It was a nation-state, so nationalism could only make it stronger.", "Its people all spoke German and wanted to join Germany.", "Nationalism had been banned across Europe since 1871."], "answer": 0, "why": "Austria-Hungary ruled Germans, Hungarians, Czechs, Poles, Croats, Serbs and several other peoples. If each of them demanded a state of its own, the empire would fall apart. It was the opposite of a nation-state, and most of its people did not speak German."}, "body": "<h2>One people, one country<\/h2>\n<p>A <button class=\"term\" data-g=\"nation\">nation<\/button> is a group of people who feel they belong together. Usually they share a language, a culture and a history. A <button class=\"term\" data-g=\"state\">state<\/button> is a country with its own government and borders.<\/p>\n<p>Nationalism says the two should match. Each nation should have its own state, and should rule itself instead of being ruled by outsiders.<\/p>\n<h2>Joining together<\/h2>\n<p>In the 1800s, nationalism redrew the map of Europe.<\/p>\n<div class=\"tablewrap\"><table class=\"t\"><thead><tr><th>Year<\/th><th>What happened<\/th><th>How nationalism shows<\/th><\/tr><\/thead><tbody><tr><td>1861<\/td><td>The Kingdom of Italy is proclaimed<\/td><td>Italian speakers in many small states join into one country<\/td><\/tr><tr><td>1871<\/td><td>The German Empire is proclaimed<\/td><td>German states join under the lead of Prussia<\/td><\/tr><tr><td>1878<\/td><td>Serbia becomes fully independent of the Ottoman Empire<\/td><td>Serbs gain a state of their own<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"cap\"><em>Notice: in Italy and Germany, nationalism built a bigger country by joining small ones.<\/em><\/p>\n<h2>Breaking apart<\/h2>\n<p>Nationalism can also pull a country apart. An <button class=\"term\" data-g=\"empire\">empire<\/button> rules many different peoples from one center. Austria-Hungary ruled more than ten peoples. The Ottoman Empire, which once held most of southeastern Europe, had lost nearly all of it by 1914.<\/p>\n<p>For an empire, nationalism is a threat. Each people that wants its own state is a piece that might break off.<\/p>\n<h2>Why it mattered in 1914<\/h2>\n<p>Many <button class=\"term\" data-g=\"south-slavs\">South Slavs<\/button> lived inside Austria-Hungary. Next door was Serbia, an independent South Slav state. Some South Slavs dreamed of leaving Austria-Hungary and joining Serbia in one big South Slav country.<button class=\"fn\" data-g=\"n_yugoslavia\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>Austria-Hungary's leaders feared that if the South Slavs left, other peoples would follow and the empire would collapse. That fear shaped everything that happened in <button class=\"clink\" data-c=\"balkan-tensions\">the Balkans<\/button> before 1914.<\/p>\n<p><strong>Why nationalism is so strong.<\/strong> It gives ordinary people a reason to feel loyal to \"their\" country, to pay its taxes and to fight for it. That loyalty can hold a nation-state together. In an empire of many nations, the same loyalty points people away from the empire.<\/p>", "example": {"title": "How nationalism could break an empire: Austria-Hungary and the South Slavs.", "steps": [{"text": "Millions of South Slavs, such as Croats, Serbs and Slovenes, lived inside Austria-Hungary.", "why": "The empire had grown by taking land, not by uniting one people, so many nations lived inside it.", "uses": []}, {"text": "Just across the border, Serbia was an independent South Slav state.", "why": "Serbia had won its independence from the Ottoman Empire step by step, and fully in 1878.", "uses": []}, {"text": "Some South Slavs inside Austria-Hungary began to look to Serbia, not to Vienna.", "why": "Nationalism says a nation should live in one state. For a South Slav nationalist, that state was a South Slav one.", "uses": []}, {"text": "Austria-Hungary's leaders came to see Serbia as a threat to the empire's survival.", "why": "If the South Slavs broke away, Czechs, Poles and others might try the same.", "uses": []}]}, "practice": {"q": "In 1871 nationalism helped create a new, stronger Germany. Why did the same idea weaken Austria-Hungary?", "answer": "Germany's people mostly shared one language and culture, so nationalism joined them into one state. Austria-Hungary held many different nations. Nationalism told each of them it should have its own state, which meant leaving the empire."}, "stub": false}, {"id": "alliance-system", "title": "The alliance system", "prereqs": [], "big": "By 1914 Europe's strongest countries had split into two camps, so a quarrel between two countries could drag in all of them.", "recap": "Germany and Austria-Hungary were allies, with Italy also tied to them on paper (the Triple Alliance). France and Russia were allies, and Britain had friendly understandings with both (the Triple Entente). A war involving one member could pull in its partners.", "check": {"q": "Which country was in the Triple Alliance before 1914, but did not fight on Germany's side?", "options": ["Italy", "Russia", "The Ottoman Empire", "Britain"], "answer": 0, "why": "Italy joined the Triple Alliance in 1882, but stayed neutral in 1914 and joined the other side in 1915. Russia and Britain were never in the Triple Alliance. The Ottoman Empire did fight alongside Germany from late 1914, but it was never a member of the Triple Alliance."}, "body": "<h2>Two camps<\/h2>\n<p>Before 1914, Europe's <button class=\"term\" data-g=\"great-powers\">great powers<\/button> signed a series of agreements. Step by step, these sorted them into two camps.<\/p>\n<div class=\"widget\" data-w=\"timeline\" data-args=\"{&quot;lines&quot;: [&quot;1879 | Germany and Austria-Hungary form the Dual Alliance.&quot;, &quot;1882 | Italy joins them: the Triple Alliance.&quot;, &quot;1894 | France and Russia form an alliance.&quot;, &quot;1904 | Britain and France settle old quarrels: the Entente Cordiale.&quot;, &quot;1907 | Britain and Russia settle their quarrels in Asia.&quot;], &quot;caption&quot;: &quot;Notice: Germany&#x27;s camp was complete by 1882. The other camp took shape between 1894 and 1907.&quot;}\"><\/div>\n<div class=\"widget\" data-w=\"alliance-blocs\" data-args=\"{&quot;lines&quot;: [], &quot;caption&quot;: &quot;&quot;}\"><\/div>\n<h2>A promise, or just an understanding?<\/h2>\n<p>The two camps were not built the same way.<\/p>\n<p>An <button class=\"term\" data-g=\"alliance\">alliance<\/button> is a treaty promise to help each other in war. Germany and Austria-Hungary had one. So did France and Russia.<\/p>\n<p>An <button class=\"term\" data-g=\"entente\">entente<\/button> is a friendly understanding. It settles quarrels, but it does not promise to fight. Britain's ties to France and Russia were ententes. So in 1914, Britain was not forced to join a war. It had to decide.<\/p>\n<p>What decided it was Belgium. Britain had signed a treaty promising to respect Belgium's <button class=\"term\" data-g=\"neutrality\">neutrality<\/button>.<button class=\"fn\" data-g=\"n_belgium_1839\" aria-label=\"Note 1\">1<\/button> When Germany invaded Belgium, Britain declared war.<\/p>\n<p>Italy shows the opposite case. It was in the Triple Alliance, but it did not fight with its partners in 1914.<button class=\"fn\" data-g=\"n_italy\" aria-label=\"Note 2\">2<\/button><\/p>\n<h2>Why alliances made war bigger<\/h2>\n<p>Each alliance was meant to keep the peace. The idea was simple: no one would attack a country with strong friends.<\/p>\n<p>But the alliances also meant that a war between two countries would not stay between two countries. If one member was at war, its partners could be pulled in, and then their enemies' partners too. This is how the <button class=\"clink\" data-c=\"july-crisis\">July Crisis<\/button> of 1914 spread.<\/p>", "example": {"title": "Suppose Austria-Hungary attacks Serbia. Who might be pulled in?", "steps": [{"text": "Russia might step in to protect Serbia.", "why": "Russia had no treaty with Serbia, but it saw itself as the protector of Slavic peoples and did not want Austria-Hungary to control the Balkans.", "uses": []}, {"text": "If Russia fights Austria-Hungary, Germany backs its ally Austria-Hungary.", "why": "The Dual Alliance of 1879 tied Germany to Austria-Hungary.", "uses": []}, {"text": "If Germany fights Russia, France is likely to fight Germany.", "why": "France and Russia were allies. France also wanted back the land it had lost to Germany in 1871.", "uses": []}, {"text": "Britain is not bound to join. It must choose.", "why": "Britain's ties to France and Russia were ententes, not alliances. Only something like an attack on Belgium gave it a clear reason.", "uses": []}]}, "practice": {"q": "The alliances were meant to prevent war. Why did they make it harder to keep a war small?", "answer": "Each alliance promised help in war, so a war between two countries could pull in their partners, and then their enemies' partners. A local quarrel could quickly become a war among all the great powers."}, "stub": false}, {"id": "balkan-tensions", "title": "Tensions in the Balkans", "prereqs": ["nationalism"], "big": "Before 1914 the Balkans were where the Ottoman Empire was shrinking, Serbia was growing, and Austria-Hungary and Russia competed for control.", "recap": "As the Ottoman Empire lost its Balkan lands, Serbia grew stronger and Austria-Hungary feared that its own South Slavs would want to join Serbia. Austria-Hungary took over Bosnia in 1908, which angered Serbia and Russia.", "check": {"q": "Why did Austria-Hungary's takeover of Bosnia in 1908 anger Serbia?", "options": ["Many people in Bosnia were Serbs, and Serbia hoped to bring them into its own state.", "Bosnia had been part of Serbia until 1908.", "Austria-Hungary had promised Bosnia to Serbia in a treaty.", "The takeover started a war between Austria-Hungary and Serbia."], "answer": 0, "why": "Bosnia was Ottoman land that Austria-Hungary had occupied since 1878. Serbs were the largest group living there. Making it officially part of Austria-Hungary ended Serbian hopes of gaining it. It had never belonged to Serbia, and no war followed in 1908."}, "body": "<h2>An empire in retreat<\/h2>\n<p>For centuries the Ottoman Empire ruled the Balkans, the mountainous peninsula of southeastern Europe. In the 1800s its hold weakened. One by one, Balkan peoples won independence: Greece, then Serbia, Romania and Bulgaria.<\/p>\n<p>As the Ottomans pulled back, two great empires moved in to fill the gap.<\/p>\n<h2>Two empires watching<\/h2>\n<p><strong>Russia<\/strong> saw itself as the protector of the Slavic and Orthodox Christian peoples of the Balkans. This idea was called <button class=\"term\" data-g=\"pan-slavism\">Pan-Slavism<\/button>. Russia also wanted influence in the region.<\/p>\n<p><strong>Austria-Hungary<\/strong> feared the opposite. Every gain for Serbia made South Slav <button class=\"clink\" data-c=\"nationalism\">nationalism<\/button> inside its own borders stronger.<\/p>\n<p>So the two empires watched each other in the Balkans. Each saw the other's gain as its own loss.<\/p>\n<h2>Three crises<\/h2>\n<div class=\"widget\" data-w=\"timeline\" data-args=\"{&quot;lines&quot;: [&quot;1878 | Serbia becomes fully independent. Austria-Hungary is allowed to occupy Bosnia, which stays officially Ottoman.&quot;, &quot;1908 | Austria-Hungary formally takes over Bosnia. Serbia and Russia protest, but Russia backs down in 1909.&quot;, &quot;1912 | First Balkan War: Serbia, Bulgaria, Greece and Montenegro drive the Ottomans almost entirely out of Europe.&quot;, &quot;1913 | Second Balkan War: Bulgaria fights its former allies and loses. Serbia gains more land.&quot;], &quot;caption&quot;: &quot;Notice: in five years Serbia went from humiliated to victorious. Across the two Balkan Wars it nearly doubled in size.&quot;}\"><\/div>\n<p>In 1908 Austria-Hungary decided to <button class=\"term\" data-g=\"annex\">annex<\/button> Bosnia (in full, Bosnia and Herzegovina; this page says Bosnia for short). It had run Bosnia for thirty years, but now made it officially its own. Serbs were the largest group in Bosnia, and Serbia had hoped to gain it one day. Russia protested, then backed down when Germany firmly supported Austria-Hungary.<button class=\"fn\" data-g=\"n_russia_1905\" aria-label=\"Note 1\">1<\/button><\/p>\n<p>The Balkan Wars of 1912 and 1913 left Serbia bigger, more confident and more popular with South Slavs inside Austria-Hungary. To many in Vienna, Serbia now looked like a real danger.<\/p>\n<p><strong>Why the region was so explosive.<\/strong> Several things met in one place. A collapsing empire left land to fight over. Young nations wanted to grow. Two great powers each feared the other would win. Any spark there could involve the great powers.<\/p>", "example": {"title": "How the Ottoman retreat set Austria-Hungary against Serbia.", "steps": [{"text": "The Ottoman Empire lost almost all its Balkan land between 1878 and 1913.", "why": "Balkan peoples fought for independence, and the Ottomans were too weak to hold them.", "uses": []}, {"text": "Serbia gained independence and then, in the Balkan Wars, much more land.", "why": "Serbia was one of the winners as the Ottomans withdrew.", "uses": []}, {"text": "South Slavs inside Austria-Hungary saw a strong, successful South Slav state next door.", "why": "Nationalism draws a people toward a state of their own nation.", "uses": ["nationalism"]}, {"text": "Austria-Hungary's leaders came to believe Serbia had to be stopped, perhaps by force.", "why": "A growing Serbia seemed to threaten the empire's hold on its South Slavs.", "uses": []}]}, "practice": {"q": "Serbia did not fight Austria-Hungary in 1912 or 1913. Why did its victories in those years still worry Austria-Hungary?", "answer": "The victories made Serbia bigger and more attractive to the South Slavs living inside Austria-Hungary. The stronger Serbia grew, the more likely those South Slavs were to want to leave the empire and join it."}, "stub": false}, {"id": "sarajevo-assassination", "title": "The assassination in Sarajevo", "prereqs": ["balkan-tensions"], "big": "On 28 June 1914 a young Bosnian Serb shot the heir to Austria-Hungary's throne, and Austria-Hungary blamed Serbia.", "recap": "On 28 June 1914, Gavrilo Princip, a young Bosnian Serb nationalist, shot dead Archduke Franz Ferdinand, the heir to the throne of Austria-Hungary, in Sarajevo, the capital of Bosnia. Austria-Hungary blamed Serbia.", "check": {"q": "Who was killed in Sarajevo on 28 June 1914?", "options": ["Archduke Franz Ferdinand, heir to Austria-Hungary's throne", "Emperor Franz Joseph of Austria-Hungary", "King Peter I of Serbia", "Kaiser Wilhelm II of Germany"], "answer": 0, "why": "Franz Ferdinand was the heir, the next in line to rule. His wife Sophie was killed too. Emperor Franz Joseph, his elderly uncle, was the ruler; he lived until 1916. The Serbian king and the German kaiser were not in Sarajevo."}, "body": "<h2>The visit<\/h2>\n<p>In June 1914, Archduke Franz Ferdinand, heir to the throne of Austria-Hungary, came to Bosnia to watch army exercises. On Sunday 28 June he and his wife Sophie drove through Sarajevo, Bosnia's capital, in an open car.<\/p>\n<p>The date was a bad choice. 28 June was a Serbian national day.<button class=\"fn\" data-g=\"n_vidovdan\" aria-label=\"Note 1\">1<\/button> Bosnia had been taken over by Austria-Hungary only six years before, in a move that had angered Serbs (see <button class=\"clink\" data-c=\"balkan-tensions\">tensions in the Balkans<\/button>).<\/p>\n<h2>The plot<\/h2>\n<p>Waiting along the route were several young men from <button class=\"term\" data-g=\"young-bosnia\">Young Bosnia<\/button>, a group of mostly student revolutionaries. They wanted to end Austro-Hungarian rule over the <button class=\"term\" data-g=\"south-slavs\">South Slavs<\/button>. Most of them, including 19-year-old Gavrilo Princip, were Bosnian Serbs.<\/p>\n<p>Their pistols and bombs came from Serbia. Officers of the <button class=\"term\" data-g=\"black-hand\">Black Hand<\/button>, a secret society inside the Serbian army, armed them and helped them cross the border.<\/p>\n<h2>The day<\/h2>\n<p>In the morning, one plotter threw a bomb at the archduke's car. It missed, bounced off and exploded under the next car, wounding several people. The archduke's car sped on.<\/p>\n<p>Later that day, the archduke set off to visit the wounded in hospital. His driver took a wrong turn and stopped to reverse. By chance, Princip was standing nearby. He stepped forward and fired twice, killing both Franz Ferdinand and Sophie.<button class=\"fn\" data-g=\"n_princip\" aria-label=\"Note 2\">2<\/button><\/p>\n<h2>Who was responsible?<\/h2>\n<p>Princip and his friends were subjects of Austria-Hungary, not of Serbia. But their weapons came from Serbian officers. The head of the Black Hand was also the head of Serbia's military intelligence.<\/p>\n<p>How much the Serbian government itself knew is still debated.<button class=\"fn\" data-g=\"n_serbian_govt\" aria-label=\"Note 3\">3<\/button> Austria-Hungary did not wait to find out. Its leaders saw a chance to deal with Serbia once and for all.<\/p>\n<p><strong>Why one killing could matter so much.<\/strong> On its own, a murder does not cause a war. This one landed in a region already full of tension, between two countries that already distrusted each other. It gave Austria-Hungary a reason to act on a fear it already had.<\/p>", "example": {"title": "From a plot in Belgrade to Austria-Hungary's decision to punish Serbia.", "steps": [{"text": "Young Bosnian nationalists planned to kill the archduke.", "why": "To them he stood for Austria-Hungary's rule over the South Slavs.", "uses": ["balkan-tensions"]}, {"text": "Officers of the Black Hand supplied weapons and helped them cross from Serbia into Bosnia.", "why": "The Black Hand wanted to unite all Serbs in one state and was ready to use violence.", "uses": []}, {"text": "On 28 June 1914 Princip killed Franz Ferdinand and Sophie in Sarajevo.", "why": "A wrong turn by the driver put the car right in front of him.", "uses": []}, {"text": "Austria-Hungary blamed Serbia and decided to punish it.", "why": "Its leaders already saw Serbia as a threat. The killing gave them a reason to act.", "uses": ["balkan-tensions"]}]}, "practice": {"q": "Princip was a subject of Austria-Hungary, not a citizen of Serbia. Why did Austria-Hungary still blame Serbia?", "answer": "The weapons and help came from Serbian army officers in the Black Hand, whose leader ran Serbia's military intelligence. Austria-Hungary also already saw Serbia as the force stirring up South Slav nationalism inside its borders, so it treated the killing as Serbia's doing."}, "stub": false}, {"id": "july-crisis", "title": "The July Crisis", "prereqs": ["sarajevo-assassination", "alliance-system"], "big": "In the five weeks after the assassination, a quarrel between Austria-Hungary and Serbia turned into a war among Europe's great powers.", "recap": "Promised full support by Germany, Austria-Hungary declared war on Serbia on 28 July 1914. Russia prepared to defend Serbia, Germany declared war on Russia and France and invaded Belgium, and Britain declared war on Germany on 4 August.", "check": {"q": "Why did Britain declare war on Germany on 4 August 1914?", "options": ["Germany invaded Belgium, whose neutrality Britain had promised to respect.", "Britain had a treaty that required it to defend Serbia.", "Germany had attacked Britain first.", "Britain was a member of the Triple Alliance."], "answer": 0, "why": "Britain's ties to France and Russia did not force it to fight. Germany's invasion of neutral Belgium gave Britain its reason. Britain had no treaty with Serbia, Germany had not attacked Britain, and Britain was never in the Triple Alliance."}, "body": "<h2>Five weeks<\/h2>\n<div class=\"widget\" data-w=\"timeline\" data-args=\"{&quot;lines&quot;: [&quot;28 June | Franz Ferdinand is killed in Sarajevo.&quot;, &quot;5–6 July | Germany promises Austria-Hungary its full support: the \\&quot;blank cheque\\&quot;.&quot;, &quot;23 July | Austria-Hungary sends Serbia a list of demands with a 48-hour deadline.&quot;, &quot;25 July | Serbia accepts most of the demands, but not all. Austria-Hungary breaks off relations.&quot;, &quot;28 July | Austria-Hungary declares war on Serbia.&quot;, &quot;30 July | Russia orders its whole army to prepare for war.&quot;, &quot;1 August | Germany declares war on Russia.&quot;, &quot;3 August | Germany declares war on France.&quot;, &quot;4 August | Germany invades Belgium. Britain declares war on Germany.&quot;], &quot;caption&quot;: &quot;Notice: almost four weeks of slow pressure, then one week in which every great power was drawn in.&quot;}\"><\/div>\n<h2>Germany's promise<\/h2>\n<p>After the <button class=\"clink\" data-c=\"sarajevo-assassination\">assassination<\/button>, Austria-Hungary wanted to punish Serbia. But attacking Serbia might bring in Russia. So Austria-Hungary first asked its ally Germany. On 5 and 6 July, Germany promised to back it whatever it did. This promise is called the <button class=\"term\" data-g=\"blank-cheque\">blank cheque<\/button>.<\/p>\n<h2>The ultimatum<\/h2>\n<p>On 23 July, Austria-Hungary sent Serbia an <button class=\"term\" data-g=\"ultimatum\">ultimatum<\/button>: a list of harsh demands, with 48 hours to accept. One demand was that Austro-Hungarian officials take part in the investigation inside Serbia. The demands were written to be hard to accept.<\/p>\n<p>Serbia's reply accepted most of them, but not all. Austria-Hungary called that a rejection. On 28 July it declared war.<\/p>\n<h2>How two countries became many<\/h2>\n<p>Now the <button class=\"clink\" data-c=\"alliance-system\">alliance system<\/button> took over.<\/p>\n<ul><li><strong>Russia<\/strong> backed Serbia. On 30 July it ordered its whole army to <button class=\"term\" data-g=\"mobilize\">mobilize<\/button>.<\/li><li><strong>Germany<\/strong> saw Russian mobilization as a threat. Its war plan, the Schlieffen Plan, assumed a war on two fronts. It aimed to knock out France quickly, by marching through Belgium, before Russia's huge army was ready. So Germany declared war on Russia, then on France.<\/li><li><strong>Britain<\/strong> was not bound to fight. But when Germany invaded neutral Belgium on 4 August, Britain declared war.<\/li><\/ul>\n<p>Who was most to blame is still argued about.<button class=\"fn\" data-g=\"n_blame\" aria-label=\"Note 1\">1<\/button><\/p>\n<p><strong>Why it moved so fast at the
